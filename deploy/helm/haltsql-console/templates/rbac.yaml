{{- if .Values.rbac.create }}
{{- /* Verifier restarts: `patch` on the named workloads in the verifiers'
       namespace. RBAC cannot narrow a patch to the restartedAt annotation the
       console sets, so this grants a full patch of those Deployments and
       StatefulSets (image, command, env included); a compromised console
       container could change them. The token is projected into the console
       container only. Add an admission policy (ValidatingAdmissionPolicy,
       Kyverno, Gatekeeper) if patches must be limited to the restart
       annotation; see docs/console/deploy.md. No get/list/watch, no other
       resources, no cluster scope. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "console.fullname" . }}-restart
  namespace: {{ include "console.rbacNamespace" . }}
  labels:
    {{- include "console.labels" . | nindent 4 }}
rules:
  {{- with .Values.rbac.deployments }}
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames:
      {{- toYaml . | nindent 6 }}
    verbs: [patch]
  {{- end }}
  {{- with .Values.rbac.statefulsets }}
  - apiGroups: [apps]
    resources: [statefulsets]
    resourceNames:
      {{- toYaml . | nindent 6 }}
    verbs: [patch]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "console.fullname" . }}-restart
  namespace: {{ include "console.rbacNamespace" . }}
  labels:
    {{- include "console.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "console.fullname" . }}-restart
subjects:
  - kind: ServiceAccount
    name: {{ include "console.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
