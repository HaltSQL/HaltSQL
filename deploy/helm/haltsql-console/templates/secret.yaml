{{- if .Values.secretEnv }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "console.fullname" . }}-env
  labels:
    {{- include "console.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secretEnv }}
  {{- if not (regexMatch "^[A-Za-z_][A-Za-z0-9_]*$" $k) }}
  {{- fail (printf "secretEnv key %q is not a valid environment variable name" $k) }}
  {{- end }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
{{- end }}
