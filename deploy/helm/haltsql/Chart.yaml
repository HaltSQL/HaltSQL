apiVersion: v2
name: haltsql
description: HaltSQL policy firewall for LLM-generated PostgreSQL (HTTP sidecar service)
type: application
# The chart versions in lockstep with HaltSQL: `version` and `appVersion` are the
# release version (scripts/check-versions.sh enforces it). It was 0.2.0 before
# its first publication; no 0.2.0 chart was ever released.
version: 0.0.1
appVersion: "0.0.1"
# matchLabelKeys in the default topology spread needs 1.27+; the optional
# preStop sleep (preStopSleepSeconds) needs 1.30+.
kubeVersion: ">=1.27.0-0"
home: https://github.com/HaltSQL/HaltSQL
sources:
  - https://github.com/HaltSQL/HaltSQL
keywords: [sql, postgres, security, llm, policy, firewall]
maintainers:
  - name: Arnav Dadarya
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/images: |
    - name: haltsql
      image: ghcr.io/haltsql/haltsql:0.0.1
