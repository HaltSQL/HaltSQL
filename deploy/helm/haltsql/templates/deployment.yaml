{{- $preStop := int .Values.preStopSleepSeconds -}}
{{- if and (gt $preStop 0) (ge $preStop (int .Values.terminationGracePeriodSeconds)) -}}
{{- fail "preStopSleepSeconds must be lower than terminationGracePeriodSeconds" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "haltsql.fullname" . }}
  labels:
    {{- include "haltsql.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "haltsql.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      annotations:
        # Roll pods when the Config or token hashes change. Policy changes are
        # hot-reloaded in place (reload.watch) and do not restart pods.
        checksum/config: {{ include "haltsql.config" . | sha256sum }}
        checksum/tokens: {{ toJson .Values.tokens | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "haltsql.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "haltsql.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      enableServiceLinks: false
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.runtimeClassName }}
      runtimeClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: haltsql
          image: {{ include "haltsql.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config
            - /etc/haltsql/config/config.yaml
            # Flags outrank the image's HALTSQL_LISTEN, so server.port, the
            # containerPort, the probes and the Service always agree.
            - --listen
            - "0.0.0.0:{{ .Values.server.port }}"
            {{- if .Values.tls.enabled }}
            - --health-listen
            - "0.0.0.0:{{ .Values.tls.healthPort }}"
            {{- end }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          {{- if or .Values.tokens .Values.extraEnv .Values.server.verifyThreads }}
          env:
            {{- with .Values.server.verifyThreads }}
            - name: HALTSQL_VERIFY_THREADS
              value: {{ . | int | quote }}
            {{- end }}
            {{- range $i, $t := .Values.tokens }}
            - name: HALTSQL_TOKEN_{{ $i }}_SHA256
              valueFrom:
                secretKeyRef:
                  name: {{ include "haltsql.tokenSecretName" $ }}
                  key: HALTSQL_TOKEN_{{ $i }}_SHA256
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
              protocol: TCP
            {{- if .Values.tls.enabled }}
            - name: health
              containerPort: {{ .Values.tls.healthPort }}
              protocol: TCP
            {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            {{- include "haltsql.probe" (dict "probe" .Values.startupProbe "root" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            {{- include "haltsql.probe" (dict "probe" .Values.livenessProbe "root" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            {{- include "haltsql.probe" (dict "probe" .Values.readinessProbe "root" $) | nindent 12 }}
          {{- end }}
          {{- if gt $preStop 0 }}
          lifecycle:
            preStop:
              sleep:
                seconds: {{ $preStop }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/haltsql/config
              readOnly: true
            - name: policies
              mountPath: /etc/haltsql/policies
              readOnly: true
            - name: audit
              mountPath: /var/log/haltsql
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: {{ required "cache.mountPath is required" .Values.cache.mountPath | quote }}
            {{- if .Values.tls.enabled }}
            - name: tls
              mountPath: /etc/haltsql/tls
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- with .Values.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "haltsql.fullname" . }}-config
        - name: policies
          {{- if or .Values.policies .Values.existingPolicyConfigMap }}
          configMap:
            name: {{ include "haltsql.policyConfigMapName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: audit
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: cache
          {{- if not (and (kindIs "map" .Values.cache.volume) .Values.cache.volume) }}
          {{- fail "cache.volume must be a pod volume source (e.g. {emptyDir: {}} or {persistentVolumeClaim: {claimName: ...}})" }}
          {{- end }}
          {{- if ne (len .Values.cache.volume) 1 }}
          {{- fail "cache.volume must have exactly one volume source; when replacing the default, set emptyDir: null (e.g. {emptyDir: null, persistentVolumeClaim: {claimName: ...}})" }}
          {{- end }}
          {{- if hasKey .Values.cache.volume "name" }}
          {{- fail "cache.volume must not set name (the chart names it \"cache\")" }}
          {{- end }}
          {{- toYaml .Values.cache.volume | nindent 10 }}
        {{- if .Values.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ required "tls.secretName is required when tls.enabled" .Values.tls.secretName }}
            defaultMode: 0440
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- else if eq .Values.podAntiAffinityPreset "soft" }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "haltsql.selectorLabels" . | nindent 20 }}
      {{- else if eq .Values.podAntiAffinityPreset "hard" }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  {{- include "haltsql.selectorLabels" . | nindent 18 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml .Values.topologySpreadConstraints | nindent 8 }}
      {{- else if .Values.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpread.maxSkew }}
          topologyKey: {{ .Values.topologySpread.topologyKey }}
          whenUnsatisfiable: {{ .Values.topologySpread.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "haltsql.selectorLabels" . | nindent 14 }}
          matchLabelKeys: [pod-template-hash]
      {{- end }}
