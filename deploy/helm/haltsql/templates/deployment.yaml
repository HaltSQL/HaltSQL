apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "haltsql.fullname" . }}
  labels:
    {{- include "haltsql.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "haltsql.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      annotations:
        # Roll pods when the Config or token hashes change. Policy changes are
        # hot-reloaded in place (reload.watch) and do not restart pods.
        checksum/config: {{ include "haltsql.config" . | sha256sum }}
        checksum/tokens: {{ toJson .Values.tokens | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "haltsql.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "haltsql.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: haltsql
          image: {{ include "haltsql.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config", "/etc/haltsql/config/config.yaml"]
          env:
            {{- range $i, $t := .Values.tokens }}
            - name: HALTSQL_TOKEN_{{ $i }}_SHA256
              valueFrom:
                secretKeyRef:
                  name: {{ include "haltsql.tokenSecretName" $ }}
                  key: HALTSQL_TOKEN_{{ $i }}_SHA256
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/haltsql/config
              readOnly: true
            - name: policies
              mountPath: /etc/haltsql/policies
              readOnly: true
            - name: audit
              mountPath: /var/log/haltsql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "haltsql.fullname" . }}-config
        - name: policies
          {{- if or .Values.policies .Values.existingPolicyConfigMap }}
          configMap:
            name: {{ include "haltsql.policyConfigMapName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: audit
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
