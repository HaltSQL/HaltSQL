{{- if and .Values.tokens (not .Values.existingTokenSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "haltsql.tokenSecretName" . }}
  labels:
    {{- include "haltsql.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $i, $t := .Values.tokens }}
  {{- if not (regexMatch "^[0-9a-fA-F]{64}$" ($t.sha256 | toString)) }}
  {{- fail (printf "tokens[%d].sha256 must be a 64-character hex SHA-256 digest (never the token itself)" $i) }}
  {{- end }}
  HALTSQL_TOKEN_{{ $i }}_SHA256: {{ $t.sha256 | lower | quote }}
  {{- end }}
{{- end }}
