apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "haltsql.fullname" . }}-config
  labels:
    {{- include "haltsql.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- include "haltsql.config" . | nindent 4 }}
{{- if and .Values.policies (not .Values.existingPolicyConfigMap) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "haltsql.policyConfigMapName" . }}
  labels:
    {{- include "haltsql.labels" . | nindent 4 }}
data:
  {{- range $file, $doc := .Values.policies }}
  {{ $file }}: |
    {{- $doc | nindent 4 }}
  {{- end }}
{{- end }}
