{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
{{- $eg := $np.egress }}
{{- if not (or (kindIs "map" $eg) (kindIs "slice" $eg) (kindIs "invalid" $eg)) }}
{{- fail "networkPolicy.egress must be a map (allowHTTPS/allowDNS/extraRules) or a list of NetworkPolicyEgressRule objects" }}
{{- end }}
{{- $https := false }}
{{- $extra := list }}
{{- $dns := false }}
{{- if kindIs "map" $eg }}
{{- $https = include "haltsql.egressHTTPS" . | eq "true" }}
{{- $extra = $eg.extraRules | default list }}
{{- if eq (toString $eg.allowDNS) "auto" }}
{{- $dns = or $https (gt (len $extra) 0) }}
{{- else }}
{{- $dns = $eg.allowDNS }}
{{- end }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "haltsql.fullname" . }}
  labels:
    {{- include "haltsql.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "haltsql.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: http
          protocol: TCP
      {{- with $np.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- else }}
      from:
        - podSelector: {}
      {{- end }}
    {{- with $np.metricsFrom }}
    - ports:
        - port: http
          protocol: TCP
      from:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- if .Values.tls.enabled }}
    # Probes go to the plain-HTTP health port when TLS is enabled.
    - ports:
        - port: health
          protocol: TCP
    {{- end }}
    {{- with $np.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  # Verification itself makes no network calls, so egress is denied unless
  # OIDC (JWKS over HTTPS) or networkPolicy.egress rules need it.
  {{- if kindIs "slice" $eg }}
  {{- with $eg }}
  egress:
    {{- toYaml . | nindent 4 }}
  {{- else }}
  egress: []
  {{- end }}
  {{- else if or $dns $https $extra }}
  egress:
    {{- if $dns }}
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- end }}
    {{- if $https }}
    - ports:
        - port: 443
          protocol: TCP
    {{- end }}
    {{- with $extra }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- else }}
  egress: []
  {{- end }}
{{- end }}
