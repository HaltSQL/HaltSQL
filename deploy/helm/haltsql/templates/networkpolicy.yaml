{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
{{- $https := include "haltsql.egressHTTPS" . | eq "true" }}
{{- $extra := $np.egress.extraRules | default list }}
{{- $dns := false }}
{{- if eq (toString $np.egress.allowDNS) "auto" }}
{{- $dns = or $https (gt (len $extra) 0) }}
{{- else }}
{{- $dns = $np.egress.allowDNS }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "haltsql.fullname" . }}
  labels:
    {{- include "haltsql.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "haltsql.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: http
          protocol: TCP
      {{- with $np.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- else }}
      from:
        - podSelector: {}
      {{- end }}
    {{- with $np.metricsFrom }}
    - ports:
        - port: http
          protocol: TCP
      from:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with $np.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  # Verification itself makes no network calls, so egress is denied unless
  # OIDC (JWKS over HTTPS) or networkPolicy.egress rules need it.
  {{- if or $dns $https $extra }}
  egress:
    {{- if $dns }}
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- end }}
    {{- if $https }}
    - ports:
        - port: 443
          protocol: TCP
    {{- end }}
    {{- with $extra }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- else }}
  egress: []
  {{- end }}
{{- end }}
