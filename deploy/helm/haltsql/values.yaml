# Default values for the haltsql chart. Every key is validated by
# values.schema.json; see README.md in this directory for the full reference.

replicaCount: 2
revisionHistoryLimit: 5

image:
  repository: ghcr.io/haltsql/haltsql
  tag: ""            # defaults to .Chart.AppVersion
  # Pin an exact, signed image. When set it wins over `tag`. Verify first:
  #   cosign verify ghcr.io/haltsql/haltsql@sha256:... \
  #     --certificate-identity-regexp 'https://github.com/HaltSQL/HaltSQL/' \
  #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
  digest: ""         # e.g. sha256:3f1c...
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}    # e.g. eks.amazonaws.com/role-arn, iam.gke.io/gcp-service-account
  # haltsql does not call the Kubernetes API. Set to true only for Vault's
  # kubernetes auth method (secrets.vault.auth.method: kubernetes).
  automountServiceAccountToken: false

podAnnotations: {}
podLabels: {}
priorityClassName: ""
runtimeClassName: ""

# haltsql-server settings rendered into the Config document (kind: Config).
server:
  port: 8080
  maxRequestBytes: 1048576
  # Threads that parse and analyse statements (HALTSQL_VERIFY_THREADS, 1-256).
  # null: the server uses the CPU count it sees (2 to 32). Without a CPU limit
  # that is the node's CPU count; set this to about the CPU request (minimum
  # 2) on large nodes.
  verifyThreads: null
  allowUnauthenticated: false   # development only: every caller is accepted
  # Refuse to render when a token below has neither `context` nor
  # `request_context_fields`. Off by default (an unbound token is correct for
  # a policy without tenancy); turn it on when every policy isolates tenants.
  requireBoundTokens: false
  defaultPolicy: ""
  reloadWatch: true          # policies are mounted from a ConfigMap; kubelet updates trigger a reload
  logLevel: info             # debug | info | warn | error
  logFormat: json            # json | text
  metrics: true
  audit:
    # Audit records go to stdout by default (collected by your log pipeline).
    # Add {type: file, path: /var/log/haltsql/audit.jsonl} to also write a file
    # (an emptyDir is mounted at /var/log/haltsql).
    sinks:
      - type: stdout
    logRawSql: false
  # Extra Config keys deep-merged over the rendered document, e.g.
  # telemetry.otlp, secrets.vault, or S3/GCS audit sinks. Outbound calls these
  # make need networkPolicy.egress (below). See docs/config-reference.md.
  # The top-level extraConfig (below) is merged after this one and wins.
  extraConfig: {}
  #  telemetry:
  #    otlp:
  #      endpoint: http://otel-collector.observability:4318

# Bearer tokens. Only SHA-256 hashes are stored (in a Secret, injected into the
# config through ${env:...} placeholders). Each token is pinned to one policy.
#   printf '%s' "$TOKEN" | sha256sum
# Bind each token to its tenant with `context`: the request body can then no
# longer name another tenant (403 CONTEXT_NOT_ALLOWED), and may add only the
# fields in `request_context_fields`. A token with neither key is unbound: its
# holder names the tenant in the body, which is only right for a trusted
# backend or a policy without tenancy (the server logs a warning otherwise).
# Both keys need a haltsql image newer than 0.0.2.
tokens: []
#  - name: acme-agent
#    sha256: 3f7c...e9
#    policy: analytics-agent
#    context: { tenant_id: acme }            # fixed for this token
#    request_context_fields: [user_id]       # the body may still add these

# Use an existing Secret (e.g. from External Secrets / Sealed Secrets / Vault
# Agent) instead of rendering one. It must contain one key per token named
# HALTSQL_TOKEN_<INDEX>_SHA256 (0-based, in the order of `tokens`); `tokens`
# still supplies the names and policies. Pods do not roll automatically when
# an external Secret changes: bump podAnnotations or use a reloader.
existingTokenSecret: ""

# Built-in TLS (server.tls). The Secret is mounted as a directory, so
# cert-manager / kubelet rotations are picked up by reload.watch without a
# restart. With TLS enabled, probes move to a plain-HTTP health port that
# serves only /healthz and /readyz (--health-listen).
tls:
  enabled: false
  # A kubernetes.io/tls Secret (e.g. from cert-manager) with tls.crt, tls.key
  # and, for client certificates, ca.crt.
  secretName: ""
  clientAuth: none          # none | optional | required (optional/required need ca.crt)
  minVersion: "1.2"         # "1.2" | "1.3"
  healthPort: 8081

# OIDC providers (server.auth.oidc), rendered verbatim. See docs/authentication.md.
# The server fetches discovery documents and JWKS over HTTPS, so with
# networkPolicy.enabled the chart opens egress to TCP 443 (allowHTTPS: auto).
oidc: []
#  - name: corp-okta
#    issuer: https://corp.okta.com/oauth2/default
#    audiences: [haltsql]
#    policy_claim: haltsql_policy
#    allowed_policies: [analytics-agent]
#    context_claims: { tenant_id: "https://corp.example/tenant" }
#    required_claims: { scope: sql.verify }

# mTLS identities (server.auth.mtls.identities), rendered verbatim. Need
# tls.enabled, ca.crt in the Secret and tls.clientAuth optional or required.
mtlsIdentities: []
#  - spiffe_id: spiffe://corp.example/ns/agents/sa/analytics
#    policy: analytics-agent
#    context: { tenant_id: acme }

# Policies, keyed by file name. Each value is a full Policy document (YAML).
policies: {}
#  analytics-agent.yaml: |
#    apiVersion: haltsql.dev/v1
#    kind: Policy
#    metadata: { name: analytics-agent }
#    ...

# Use an existing ConfigMap holding the policy files instead of `policies`.
existingPolicyConfigMap: ""
# File names (keys) in existingPolicyConfigMap to load.
existingPolicyFiles: []

# Extra container settings.
extraArgs: []          # appended to the haltsql-server command line
extraEnv: []           # [{name: AWS_REGION, value: eu-west-1}, {name: X, valueFrom: {...}}]
extraEnvFrom: []       # [{secretRef: {name: haltsql-cloud-creds}}]
extraVolumes: []       # pod volumes
extraVolumeMounts: []  # mounts into the haltsql container
initContainers: []
extraContainers: []    # sidecars (e.g. a log shipper for file audit sinks)

# Extra Config policies[] entries, appended to the policies rendered from
# `policies` / `existingPolicyFiles`. Each entry is a full Config policy entry
# (path, inline, bundle or bundle_source; see docs/config-reference.md). A
# bundle_source entry without cache_dir gets "<cache.mountPath>/bundles", so a
# restarted pod can start from its last verified bundle while the source is
# down. Secrets (registry passwords, tokens) belong in ${env:...} placeholders,
# never inline.
extraPolicies: []
#  - bundle_source: { oci: "registry.corp.example/haltsql/policies:prod" }
#    public_keys: ["ed25519:BASE64..."]
#    name_prefix: prod.
#    poll_interval_s: 60

# Extra Config keys, deep-merged into the rendered Config document after
# extraPolicies are appended and after server.extraConfig: nested maps merge
# key by key and extraConfig wins; lists and scalars replace the rendered
# value. Use it for settings the chart has no value for (telemetry.otlp,
# secrets, opa, audit sinks, ...). server.extraConfig is the same mechanism,
# merged first (the cloud overlays use it); set either. `policies` is refused
# in both (it would replace the chart's list): use extraPolicies. Outbound
# calls these settings make need networkPolicy.egress (below).
extraConfig: {}
#  telemetry:
#    otlp: { endpoint: "http://otel-collector.monitoring:4318" }
#  opa:
#    url: "https://opa.policy.svc:8181"
#    decision_path: haltsql/allow

# Writable volume for bundle-source caches (the root filesystem is read-only).
# It is mounted at mountPath, and bundle_source entries in extraPolicies
# without their own cache_dir use "<mountPath>/bundles". `volume` is any pod
# volume source; the default emptyDir survives container restarts but not pod
# rescheduling. Use a persistentVolumeClaim (or an ephemeral volume) to keep
# the cache across rescheduling.
cache:
  mountPath: /var/cache/haltsql
  volume:
    emptyDir:
      sizeLimit: 256Mi
  #  persistentVolumeClaim: { claimName: haltsql-cache }

service:
  type: ClusterIP            # ClusterIP | NodePort | LoadBalancer
  port: 8080
  nodePort: null             # only for NodePort / LoadBalancer
  annotations: {}            # cloud LB annotations, e.g.
  #  service.beta.kubernetes.io/aws-load-balancer-scheme: internal
  #  networking.gke.io/load-balancer-type: Internal
  #  service.beta.kubernetes.io/azure-load-balancer-internal: "true"
  labels: {}
  loadBalancerClass: ""
  loadBalancerSourceRanges: []
  externalTrafficPolicy: ""  # Cluster | Local (NodePort / LoadBalancer only)
  internalTrafficPolicy: ""  # Cluster | Local

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    # No CPU limit by default (avoids CFS throttling on the verify hot path).
    memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  privileged: false
  capabilities:
    drop: [ALL]
  seccompProfile:
    type: RuntimeDefault

# Probes. With tls.enabled the chart points them at the plain-HTTP health port.
# startupProbe gives a slow first policy load (large policies, Vault/AWS secret
# resolution) up to failureThreshold * periodSeconds before liveness applies.
startupProbe:
  enabled: true
  httpGet: { path: /healthz, port: http }
  periodSeconds: 2
  timeoutSeconds: 2
  failureThreshold: 30
livenessProbe:
  enabled: true
  httpGet: { path: /healthz, port: http }
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3
readinessProbe:
  enabled: true
  httpGet: { path: /readyz, port: http }
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 2

# Seconds a terminating pod keeps serving after it is removed from Service
# endpoints, so in-flight callers are not cut off (lifecycle.preStop.sleep,
# Kubernetes >= 1.30). 0 disables it. Must be < terminationGracePeriodSeconds.
preStopSleepSeconds: 0
terminationGracePeriodSeconds: 20

podDisruptionBudget:
  enabled: true
  # maxUnavailable wins when set. The PDB is skipped when fewer than 2
  # replicas run, since a PDB on a single replica blocks node drains.
  minAvailable: 1
  maxUnavailable: null
  unhealthyPodEvictionPolicy: ""   # IfHealthyBudget | AlwaysAllow (Kubernetes >= 1.27)

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: null
  behavior: {}       # autoscaling/v2 HPA behavior, rendered verbatim

networkPolicy:
  enabled: true
  # Pods allowed to call haltsql (empty = any pod in the namespace).
  ingressFrom: []
  #  - podSelector: { matchLabels: { app: my-agent } }
  # Allow Prometheus to scrape /metrics from this namespace selector.
  metricsFrom: []
  #  - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
  extraIngress: []   # extra NetworkPolicy ingress rules, rendered verbatim
  # Egress is denied by default: verification needs no network access.
  # `egress` takes one of two forms:
  #   * a map (below): DNS/HTTPS toggles plus extraRules;
  #   * a list of NetworkPolicyEgressRule objects, rendered verbatim as the
  #     whole egress section (no automatic DNS/HTTPS rules; [] denies all).
  #     The Terraform haltsql-kubernetes module uses this form.
  egress:
    # DNS (UDP/TCP 53) is opened whenever any other egress rule is rendered.
    # allowHTTPS: TCP 443 to any destination. "auto" = only when `oidc` is set
    # (discovery + JWKS). Prefer false plus extraRules with the IdP's CIDRs
    # where your IdP has stable addresses.
    allowHTTPS: auto
    allowDNS: auto     # auto | true | false
    extraRules: []     # e.g. OTLP collector, Vault, S3/GCS endpoints
    #  - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: observability } } }]
    #    ports: [{ port: 4318, protocol: TCP }]

serviceMonitor:
  enabled: false
  namespace: ""      # defaults to the release namespace
  interval: 30s
  scrapeTimeout: 10s
  labels: {}         # e.g. { release: kube-prometheus-stack }
  honorLabels: false
  relabelings: []
  metricRelabelings: []
  # With tls.enabled the endpoint is scraped over HTTPS; set e.g.
  # { ca: { secret: { name: haltsql-tls, key: ca.crt } }, serverName: haltsql }
  tlsConfig: {}

# Google Cloud Managed Service for Prometheus (monitoring.googleapis.com/v1
# PodMonitoring). Needs the GMP CRDs (enabled by default on GKE Autopilot).
podMonitoring:
  enabled: false
  interval: 30s
  timeout: 10s
  labels: {}

nodeSelector: {}
tolerations: []
# Full affinity override. When empty the podAntiAffinityPreset below applies.
affinity: {}
# Spread replicas across nodes: soft (preferred) | hard (required) | "" (none).
podAntiAffinityPreset: soft
# Full topologySpreadConstraints override. When empty and
# topologySpread.enabled, a zone spread with this release's selector is used.
topologySpreadConstraints: []
topologySpread:
  enabled: true
  topologyKey: topology.kubernetes.io/zone
  maxSkew: 1
  whenUnsatisfiable: ScheduleAnyway   # DoNotSchedule for strict zone spreading
