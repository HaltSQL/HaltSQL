---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: haltsqlpolicies.haltsql.dev
spec:
  group: haltsql.dev
  names:
    categories:
    - haltsql
    kind: HaltSQLPolicy
    listKind: HaltSQLPolicyList
    plural: haltsqlpolicies
    shortNames:
    - hsqlpolicy
    - hsqlp
    singular: haltsqlpolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.policyName
      name: Policy
      type: string
    - jsonPath: .status.conditions[?(@.type=="Valid")].status
      name: Valid
      type: string
    - jsonPath: .status.conditions[?(@.type=="Synced")].status
      name: Synced
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          HaltSQLPolicy is a HaltSQL policy that HaltSQLServers in the same
          namespace can load.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              HaltSQLPolicySpec defines one HaltSQL policy: either an inline policy
              document or a signed bundle fetched by haltsql-server.
            properties:
              bundleSource:
                description: |-
                  BundleSource is a signed policy bundle that haltsql-server fetches from
                  an OCI registry, S3 (or an S3-compatible store) or HTTPS and polls for
                  updates. Signature verification is mandatory.
                properties:
                  https:
                    description: HTTPS fetches the bundle from an HTTPS URL.
                    properties:
                      auth:
                        description: Auth reads credentials from a Secret.
                        properties:
                          passwordKey:
                            description: PasswordKey is the Secret key holding the
                              password (default `password`).
                            type: string
                          secretName:
                            description: SecretName is the name of the Secret.
                            maxLength: 253
                            minLength: 1
                            type: string
                          tokenKey:
                            description: TokenKey is the Secret key holding the token
                              (default `token`).
                            type: string
                          type:
                            description: Type is `token` (bearer token) or `basic`
                              (username and password).
                            enum:
                            - token
                            - basic
                            type: string
                          usernameKey:
                            description: UsernameKey is the Secret key holding the
                              user name (default `username`).
                            type: string
                        required:
                        - secretName
                        - type
                        type: object
                        x-kubernetes-validations:
                        - message: tokenKey is only allowed with type token; usernameKey
                            and passwordKey only with type basic
                          rule: 'self.type == ''token'' ? !has(self.usernameKey) &&
                            !has(self.passwordKey) : !has(self.tokenKey)'
                      url:
                        description: URL is an https URL without credentials, query
                          or fragment.
                        maxLength: 2048
                        minLength: 1
                        type: string
                    required:
                    - url
                    type: object
                  namePrefix:
                    description: NamePrefix is prepended to the names of the bundle's
                      policies.
                    pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
                    type: string
                  oci:
                    description: OCI fetches the bundle from an OCI registry.
                    properties:
                      auth:
                        description: Auth reads registry credentials from a Secret.
                        properties:
                          passwordKey:
                            description: PasswordKey is the Secret key holding the
                              password (default `password`).
                            type: string
                          secretName:
                            description: SecretName is the name of the Secret.
                            maxLength: 253
                            minLength: 1
                            type: string
                          tokenKey:
                            description: TokenKey is the Secret key holding the token
                              (default `token`).
                            type: string
                          type:
                            description: Type is `token` (bearer token) or `basic`
                              (username and password).
                            enum:
                            - token
                            - basic
                            type: string
                          usernameKey:
                            description: UsernameKey is the Secret key holding the
                              user name (default `username`).
                            type: string
                        required:
                        - secretName
                        - type
                        type: object
                        x-kubernetes-validations:
                        - message: tokenKey is only allowed with type token; usernameKey
                            and passwordKey only with type basic
                          rule: 'self.type == ''token'' ? !has(self.usernameKey) &&
                            !has(self.passwordKey) : !has(self.tokenKey)'
                      plainHTTP:
                        description: |-
                          PlainHTTP talks plain HTTP to the registry. haltsql only accepts it for
                          loopback registries (local tests).
                        type: boolean
                      ref:
                        description: |-
                          Ref is `registry[:port]/repository:tag`, `...@sha256:<digest>` or both.
                          The registry host is mandatory. Pin a digest for immutable deployments.
                        maxLength: 1024
                        minLength: 1
                        type: string
                    required:
                    - ref
                    type: object
                  pollIntervalSeconds:
                    description: PollIntervalSeconds is the time between update checks
                      (10-86400, default 60).
                    format: int32
                    maximum: 86400
                    minimum: 10
                    type: integer
                  publicKeys:
                    description: |-
                      PublicKeys are the trusted ed25519 public keys: inline PEM
                      (-----BEGIN PUBLIC KEY-----) or the base64 of the 32 raw key bytes.
                    items:
                      maxLength: 4096
                      minLength: 1
                      type: string
                    maxItems: 16
                    minItems: 1
                    type: array
                  s3:
                    description: S3 fetches the bundle from an S3 object.
                    properties:
                      bucket:
                        maxLength: 63
                        minLength: 3
                        type: string
                      credentials:
                        description: Credentials selects how haltsql-server authenticates
                          to S3.
                        properties:
                          accessKeyIDKey:
                            description: AccessKeyIDKey defaults to `access_key_id`.
                            type: string
                          secretAccessKeyKey:
                            description: SecretAccessKeyKey defaults to `secret_access_key`.
                            type: string
                          secretName:
                            description: SecretName holds the static keys.
                            type: string
                          sessionTokenKey:
                            description: SessionTokenKey is optional; without it no
                              session token is used.
                            type: string
                          source:
                            description: |-
                              Source is `env` (AWS_* variables, set them with HaltSQLServer
                              spec.env), `static` (keys from a Secret), `web_identity` (IRSA) or
                              `instance`.
                            enum:
                            - env
                            - static
                            - web_identity
                            - instance
                            type: string
                        required:
                        - source
                        type: object
                        x-kubernetes-validations:
                        - message: secretName is required with source static and only
                            allowed with it
                          rule: 'self.source == ''static'' ? has(self.secretName)
                            : !has(self.secretName) && !has(self.accessKeyIDKey) &&
                            !has(self.secretAccessKeyKey) && !has(self.sessionTokenKey)'
                      endpoint:
                        description: Endpoint is an S3-compatible URL (for example
                          MinIO).
                        maxLength: 2048
                        type: string
                      key:
                        maxLength: 1024
                        minLength: 1
                        type: string
                      region:
                        maxLength: 64
                        minLength: 1
                        type: string
                    required:
                    - bucket
                    - key
                    - region
                    type: object
                required:
                - publicKeys
                type: object
                x-kubernetes-validations:
                - message: exactly one of oci, s3 or https is required
                  rule: '(has(self.oci) ? 1 : 0) + (has(self.s3) ? 1 : 0) + (has(self.https)
                    ? 1 : 0) == 1'
              policy:
                description: |-
                  Policy is a complete HaltSQL policy document (kind: Policy) as a YAML
                  or JSON string. It must not reference a catalog file (`catalog: <path>`);
                  write the catalog snapshot inline instead.
                maxLength: 262144
                minLength: 1
                type: string
            type: object
            x-kubernetes-validations:
            - message: exactly one of spec.policy or spec.bundleSource is required
              rule: has(self.policy) != has(self.bundleSource)
          status:
            description: HaltSQLPolicyStatus is the observed state of a HaltSQLPolicy.
            properties:
              conditions:
                description: 'Conditions: Valid and Synced.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              contentHash:
                description: |-
                  ContentHash is the sha256 of the validated content. HaltSQLServers
                  report the hash they run, which drives the Synced condition.
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation the Valid condition
                  refers to.
                format: int64
                type: integer
              policyName:
                description: |-
                  PolicyName is the policy document's metadata.name (inline policies only).
                  Tokens, OIDC providers and defaultPolicy refer to this name.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
