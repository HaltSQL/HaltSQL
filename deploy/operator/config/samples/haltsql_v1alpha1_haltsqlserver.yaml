apiVersion: haltsql.dev/v1alpha1
kind: HaltSQLServer
metadata:
  name: haltsql
spec:
  replicas: 2
  image: ghcr.io/haltsql/haltsql:0.0.1
  policies:
    - name: analytics
  config:
    logLevel: info
  auth:
    tokens:
      - name: analytics-agent
        policy: analytics-agent
        sha256SecretRef: { name: haltsql-tokens, key: analytics-agent.sha256 }
  audit:
    sinks:
      - type: stdout
  podDisruptionBudget:
    enabled: true
  networkPolicy:
    enabled: true
    ingressFrom:
      - podSelector:
          matchLabels:
            app: analytics-agent
