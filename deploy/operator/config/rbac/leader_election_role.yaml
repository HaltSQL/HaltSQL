# Leader election (only used with --leader-elect), scoped to the operator's
# own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: leader-election-role
  namespace: system
  labels:
    app.kubernetes.io/name: haltsql-operator
    app.kubernetes.io/managed-by: kustomize
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
