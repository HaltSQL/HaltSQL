# Azure Key Vault -> files, via the Secrets Store CSI driver
# (AKS add-on: azure-keyvault-secrets-provider) and Workload Identity.
#
# HaltSQL has no native Key Vault client. It reads these files through
# ${file:...} placeholders in its config. Two classes keep the raw token and
# its hash in different containers of the same pod:
#   - haltsql-agent:   the raw bearer token, mounted only into the agent
#   - haltsql-sidecar: the SHA-256 of that token, mounted only into haltsql
#
# clientID is the user-assigned managed identity federated with the pod's
# ServiceAccount (agents/analytics-agent). It needs the "Key Vault Secrets
# User" role on the vault (or on these two secrets only).
#
# Rotation: with --enable-secret-rotation the driver refreshes the files
# (default every 2 minutes). haltsql-server does NOT watch files referenced by
# ${file:...}; restart the pod (kubectl rollout restart) after rotating the
# token. Rotate by adding the new hash as a second token entry first.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: haltsql-sidecar
  namespace: agents
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "REPLACE_MI_CLIENT_ID"
    keyvaultName: "REPLACE_KV"
    tenantId: "REPLACE_TENANT_ID"
    objects: |
      array:
        - |
          objectName: haltsql-token-sha256
          objectType: secret
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: haltsql-agent
  namespace: agents
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "REPLACE_MI_CLIENT_ID"
    keyvaultName: "REPLACE_KV"
    tenantId: "REPLACE_TENANT_ID"
    objects: |
      array:
        - |
          objectName: haltsql-agent-token
          objectType: secret
