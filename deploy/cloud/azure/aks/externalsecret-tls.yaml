# OPTIONAL: sync haltsql's TLS certificate from Azure Key Vault into the
# kubernetes.io/tls Secret that the Helm chart mounts (values-aks.yaml,
# tls.secretName: haltsql-tls), using External Secrets Operator (ESO).
#
# Why ESO and not the CSI driver here: the Helm chart has no extraVolumes
# value, so a CSI volume cannot be mounted into the chart's pods, and the CSI
# driver's secretObjects sync only runs while some pod mounts the volume.
# cert-manager with an internal issuer is an equally good choice.
#
# Requirements:
#   - ESO installed (v0.17+ serves external-secrets.io/v1);
#   - a user-assigned MI federated with ServiceAccount haltsql/eso-keyvault,
#     with "Key Vault Secrets User" on the vault;
#   - the Key Vault certificate created with content type PEM
#     (application/x-pem-file). Reading "secret/<cert-name>" returns the
#     private key and the chain.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-keyvault
  namespace: haltsql
  annotations:
    azure.workload.identity/client-id: "REPLACE_ESO_MI_CLIENT_ID"
    azure.workload.identity/tenant-id: "REPLACE_TENANT_ID"
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: azure-keyvault
  namespace: haltsql
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: https://REPLACE_KV.vault.azure.net
      serviceAccountRef:
        name: eso-keyvault
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: haltsql-tls
  namespace: haltsql
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: azure-keyvault
  target:
    name: haltsql-tls
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
      engineVersion: v2
      data:
        tls.crt: '{{ .pem | filterPEM "CERTIFICATE" }}'
        tls.key: '{{ .pem | filterPEM "PRIVATE KEY" }}'
  data:
    - secretKey: pem
      remoteRef:
        key: secret/haltsql-tls
