# Helm values overlay: haltsql-server as a SHARED SERVICE on AKS, with
# Microsoft Entra ID (OIDC/JWT) authentication, built-in TLS and zone spread.
#
#   kubectl create namespace haltsql
#   kubectl apply -f networkpolicy-shared.yaml
#   helm upgrade --install haltsql oci://ghcr.io/haltsql/charts/haltsql --version 0.0.3 -n haltsql \
#     -f deploy/cloud/azure/aks/values-aks.yaml
#
# Replace every REPLACE_* value. For the sidecar pattern use
# agent-sidecar.yaml instead of this chart.

replicaCount: 3

image:
  repository: ghcr.io/haltsql/haltsql
  tag: "0.0.3"
  # digest: sha256:...          # pin the signed image digest in production

# haltsql calls no Azure API, so its pods need no Workload Identity: leave the
# ServiceAccount without azure.workload.identity annotations.
serviceAccount:
  create: true
  automountServiceAccountToken: false

server:
  reloadWatch: true
  audit:
    # Audit to stdout -> Container Insights (Log Analytics). For WORM
    # retention, export the table to an immutable storage container (see
    # docs/deploy-azure.md). There is no native Azure Blob sink.
    sinks:
      - type: stdout
    logRawSql: false

# Entra ID access tokens. The 'haltsql' app registration must issue v2.0
# tokens (api.requestedAccessTokenVersion = 2) so `iss` matches the issuer
# below; `aud` is then the app's client id. One entry per agent identity:
# `azp` is the calling managed identity's client id and pins its policy.
oidc:
  - name: entra-analytics-agent
    issuer: https://login.microsoftonline.com/REPLACE_TENANT_ID/v2.0
    audiences: [REPLACE_HALTSQL_APP_CLIENT_ID]
    algorithms: [RS256]
    policy: analytics-agent
    required_claims:
      azp: REPLACE_AGENT_MI_CLIENT_ID
      roles: SQL.Verify
    request_context_fields: [tenant_id]

# Built-in TLS. haltsql-tls is a kubernetes.io/tls Secret from cert-manager
# (internal CA issuer) or synced from a Key Vault certificate by External
# Secrets Operator (externalsecret-tls.yaml). The chart mounts it as a
# directory, so rotations are hot-reloaded.
tls:
  enabled: true
  secretName: haltsql-tls
  clientAuth: none
  minVersion: "1.3"
  healthPort: 8081

policies:
  analytics-agent.yaml: |
    apiVersion: haltsql.dev/v1
    kind: Policy
    metadata: { name: analytics-agent, owner: data-platform }
    search_path: [app]
    statements: { allow: [select] }
    require_limit: { max: 1000 }
    tenancy:
      mode: bound
      keys: { tenant: "${ctx.tenant_id}" }
    tables:
      app.orders:
        columns: [id, tenant_id, status, total_cents, created_at]
        tenant_column: tenant_id
      app.currencies:
        columns: "*"
    functions:
      presets: [aggregates, datetime]
    mode: enforce

service:
  type: ClusterIP
  port: 8443
  # To reach it from outside the cluster (other VNets), use an internal
  # Azure load balancer instead:
  # type: LoadBalancer
  # annotations:
  #   service.beta.kubernetes.io/azure-load-balancer-internal: "true"
  #   service.beta.kubernetes.io/azure-load-balancer-internal-subnet: snet-haltsql-ilb

resources:
  requests: { cpu: 200m, memory: 128Mi }
  limits: { memory: 256Mi }

podDisruptionBudget:
  enabled: true
  minAvailable: 2

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 60

# The chart's NetworkPolicy denies ALL egress (haltsql needs none with static
# tokens). OIDC must fetch Entra's JWKS from login.microsoftonline.com:443, so
# disable it here and apply networkpolicy-shared.yaml instead.
networkPolicy:
  enabled: false

# The chart's ServiceMonitor uses monitoring.coreos.com; Azure Managed
# Prometheus reads azmonitoring.coreos.com. Use the PodMonitor in
# networkpolicy-shared.yaml instead.
serviceMonitor:
  enabled: false

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: haltsql
        app.kubernetes.io/instance: haltsql
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: haltsql
        app.kubernetes.io/instance: haltsql
