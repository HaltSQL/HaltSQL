# Key Vault -> Kubernetes Secret for haltsql-console (Secrets Store CSI driver,
# Azure provider, Workload Identity). The console has no Key Vault secrets
# provider, so values reach it as environment variables from the synced
# Secret (existingSecret: haltsql-console-env) and ${env:NAME} placeholders.
#
#   az aks enable-addons --addons azure-keyvault-secrets-provider -g <RG> -n <AKS>
#   az role assignment create --role "Key Vault Secrets User" \
#     --assignee REPLACE_CLIENT_ID --scope <key vault resource id>
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: haltsql-console-kv
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: REPLACE_CLIENT_ID          # the workload identity's client id
    keyvaultName: kv-haltsql
    tenantId: REPLACE_TENANT_ID
    objects: |
      array:
        - |
          objectName: haltsql-console-admin-token
          objectType: secret
  secretObjects:
    - secretName: haltsql-console-env
      type: Opaque
      data:
        - objectName: haltsql-console-admin-token
          key: HALTSQL_ADMIN_TOKEN
