# haltsql-server as a sidecar in an agent pod on Amazon EKS, with IRSA for
# Secrets Manager (token hashes) and an S3 Object Lock audit bucket, and OTLP
# export to an ADOT collector. See docs/deploy-aws.md.
#
# Before applying:
#   - create the IAM role (deploy/cloud/aws/iam or deploy/cloud/aws/terraform)
#     trusted for system:serviceaccount:agents:analytics-agent;
#   - store the token hash in Secrets Manager as JSON, e.g.
#       aws secretsmanager create-secret --name prod/haltsql/tokens \
#         --secret-string "{\"analytics-agent\":\"$(printf '%s' "$TOKEN" | sha256sum | cut -d' ' -f1)\"}"
#   - give the agent its raw token (Secret analytics-agent-haltsql, key token).
# Replace 111122223333, eu-west-1 and corp-haltsql-audit.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: analytics-agent
  namespace: agents
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/haltsql-analytics-agent
    eks.amazonaws.com/sts-regional-endpoints: "true"
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: analytics-agent-haltsql-config
  namespace: agents
data:
  config.yaml: |
    apiVersion: haltsql.dev/v1
    kind: Config
    server:
      listen: 0.0.0.0:8080          # the image sets HALTSQL_LISTEN=0.0.0.0:8080 anyway
      auth:
        allow_unauthenticated: false
        tokens:
          - name: analytics-agent
            token_sha256: ${aws-sm:prod/haltsql/tokens#analytics-agent}
            policy: analytics-agent
    policies:
      - path: /etc/haltsql/policies/analytics-agent.yaml
    reload:
      watch: true                   # ConfigMaps are mounted as directories (no subPath)
    audit:
      sinks:
        - type: s3
          bucket: corp-haltsql-audit
          region: eu-west-1
          prefix: haltsql/audit/analytics-agent/
          object_lock: { mode: COMPLIANCE, retain_days: 365 }
          batch: { max_records: 500, max_seconds: 10 }
          credentials: { source: web_identity }
          spool_dir: /var/lib/haltsql/spool
          on_error: fail_closed
      log_raw_sql: false
    telemetry:
      metrics:
        prometheus: true
      otlp:
        endpoint: http://adot-collector.observability:4318
        service_name: haltsql-analytics-agent
    logging:
      level: info
      format: json
    secrets:
      aws:
        region: eu-west-1
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: analytics-agent-haltsql-policies
  namespace: agents
data:
  analytics-agent.yaml: |
    apiVersion: haltsql.dev/v1
    kind: Policy
    metadata: { name: analytics-agent, owner: data-platform }
    search_path: [app]
    statements: { allow: [select] }
    require_limit: { max: 1000 }
    tenancy:
      mode: bound
      keys: { tenant: "${ctx.tenant_id}" }
    tables:
      app.orders:
        columns: [id, tenant_id, status, total_cents, created_at]
        tenant_column: tenant_id
    functions:
      presets: [aggregates, datetime]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-agent
  namespace: agents
spec:
  replicas: 2
  selector:
    matchLabels: { app: analytics-agent }
  template:
    metadata:
      labels: { app: analytics-agent }
      annotations:
        # Only the haltsql container gets the IRSA token and AWS_* variables;
        # the agent cannot write audit objects or read the token hashes.
        eks.amazonaws.com/skip-containers: agent
    spec:
      serviceAccountName: analytics-agent
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: analytics-agent }
      containers:
        - name: agent
          image: 111122223333.dkr.ecr.eu-west-1.amazonaws.com/analytics-agent:1.4.2
          env:
            - name: HALTSQL_URL
              value: http://127.0.0.1:8080
            - name: HALTSQL_TOKEN
              valueFrom:
                secretKeyRef: { name: analytics-agent-haltsql, key: token }
        - name: haltsql
          image: ghcr.io/haltsql/haltsql:0.0.3     # pin by digest in production
          args: ["--config", "/etc/haltsql/config/config.yaml"]
          env:
            - name: AWS_REGION
              value: eu-west-1
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: config, mountPath: /etc/haltsql/config, readOnly: true }
            - { name: policies, mountPath: /etc/haltsql/policies, readOnly: true }
            - { name: spool, mountPath: /var/lib/haltsql }
            - { name: tmp, mountPath: /tmp }
      # Give in-flight requests and the last audit batch time to finish.
      terminationGracePeriodSeconds: 30
      volumes:
        - name: config
          configMap: { name: analytics-agent-haltsql-config }
        - name: policies
          configMap: { name: analytics-agent-haltsql-policies }
        - name: spool
          emptyDir: { sizeLimit: 1Gi }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
# No ingress to the agent pods from other pods. The agent and the sidecar
# need egress to the database, the LLM API, STS / Secrets Manager / S3
# (VPC endpoints) and the ADOT collector; restrict egress to those if your
# CNI enforces NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: analytics-agent-no-ingress
  namespace: agents
spec:
  podSelector:
    matchLabels: { app: analytics-agent }
  policyTypes: [Ingress]
  ingress: []
