# OpenTelemetry Collector config for the Cloud Run sidecar pattern. Stored in
# Secret Manager (secret haltsql-otel-config) and mounted into the collector
# container. It receives haltsql's OTLP/HTTP spans, scrapes haltsql's
# /metrics (including the haltsql_audit_sink_* metrics, which OTLP does not
# carry), and writes to Cloud Trace and Managed Service for Prometheus with
# the revision's service account (roles/cloudtrace.agent,
# roles/monitoring.metricWriter).
receivers:
  otlp:
    protocols:
      http:
        endpoint: localhost:4318
  prometheus:
    config:
      scrape_configs:
        - job_name: haltsql
          scrape_interval: 30s
          static_configs:
            - targets: ["localhost:8081"]
processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20
  resourcedetection:
    detectors: [env, gcp]
    timeout: 5s
  batch: {}
exporters:
  googlecloud: {}
  googlemanagedprometheus: {}
extensions:
  health_check:
    endpoint: localhost:13133
service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [googlecloud]
    metrics:
      receivers: [prometheus]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [googlemanagedprometheus]
