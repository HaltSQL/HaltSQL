# haltsql-server as a shared, internal Cloud Run service.
#
#   gcloud run services replace service-internal.yaml --region REPLACE_ME_REGION
#   gcloud run services add-iam-policy-binding haltsql --region REPLACE_ME_REGION \
#     --member serviceAccount:analytics-agent@REPLACE_ME_PROJECT.iam.gserviceaccount.com \
#     --role roles/run.invoker
#
# - ingress=internal: only traffic from VPC networks of this project (or a
#   Shared VPC / VPC-SC perimeter), and from Cloud Run services whose egress
#   goes through the VPC, reaches it.
# - No allUsers binding: Cloud Run rejects calls without a valid ID token from
#   a principal with roles/run.invoker before haltsql sees them.
# - The runtime service account haltsql-server@ can read two secrets and the
#   policy bucket and create objects in the audit bucket. Nothing else.
# Prerequisites: ../iam/setup.sh cloud-run-internal. Replace every REPLACE_ME.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: haltsql
  annotations:
    run.googleapis.com/ingress: internal
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/execution-environment: gen2   # Cloud Storage volumes
        run.googleapis.com/cpu-throttling: "false"       # background audit flushes
        run.googleapis.com/startup-cpu-boost: "true"
        autoscaling.knative.dev/minScale: "2"            # no cold start on the verify path
        autoscaling.knative.dev/maxScale: "20"
    spec:
      serviceAccountName: haltsql-server@REPLACE_ME_PROJECT.iam.gserviceaccount.com
      containerConcurrency: 250
      timeoutSeconds: 30
      containers:
        - name: haltsql
          image: REPLACE_ME_REGION-docker.pkg.dev/REPLACE_ME_PROJECT/ghcr/haltsql/haltsql:0.0.3
          args: ["--config", "/etc/haltsql/config/config.yaml"]
          ports:
            - { name: http1, containerPort: 8080 }   # the image's HALTSQL_LISTEN
          resources:
            limits: { cpu: "1", memory: 512Mi }
          startupProbe:
            httpGet: { path: /readyz, port: 8080 }
            periodSeconds: 1
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 10
          volumeMounts:
            - { name: config, mountPath: /etc/haltsql/config }
            - { name: bundles, mountPath: /etc/haltsql/bundles }
            - { name: spool, mountPath: /var/spool/haltsql }
      volumes:
        - name: config
          secret:
            secretName: haltsql-internal-config
            items: [{ key: latest, path: config.yaml }]
        - name: bundles
          csi:
            driver: gcsfuse.run.googleapis.com
            readOnly: true
            volumeAttributes:
              bucketName: REPLACE_ME_PROJECT-haltsql-policies
        - name: spool
          emptyDir: { medium: Memory, sizeLimit: 64Mi }
