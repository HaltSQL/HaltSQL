# Cloud Run multi-container service: the agent is the ingress container and
# haltsql-server runs beside it, reachable only on localhost.
#
#   gcloud run services replace service-sidecar.yaml --region REPLACE_ME_REGION
#
# Prerequisites (../iam/setup.sh cloud-run-sidecar):
#   - runtime service account haltsql-agent@ with secretAccessor on the four
#     secrets below, objectCreator on the audit bucket, cloudtrace.agent,
#     monitoring.metricWriter, cloudsql.client + cloudsql.instanceUser;
#   - the haltsql image copied to Artifact Registry (Cloud Run cannot pull
#     from ghcr.io directly; see docs/deploy-gcp.md).
# Replace every REPLACE_ME value.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: analytics-agent
  annotations:
    # Who may reach the agent is your decision; internal + load balancer is
    # the usual choice behind an external HTTPS LB with Cloud Armor / IAP.
    run.googleapis.com/ingress: internal-and-cloud-load-balancing
spec:
  template:
    metadata:
      annotations:
        # Start haltsql (and wait for its startup probe) before the agent.
        run.googleapis.com/container-dependencies: '{"agent":["haltsql"]}'
        run.googleapis.com/execution-environment: gen2
        # Instance-based billing: CPU stays allocated between requests, so the
        # audit batches and spans are flushed on time, not on the next request.
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "true"
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "20"
        # Direct VPC egress to reach Cloud SQL's private IP.
        run.googleapis.com/network-interfaces: '[{"network":"REPLACE_ME_NETWORK","subnetwork":"REPLACE_ME_SUBNET"}]'
        run.googleapis.com/vpc-access-egress: private-ranges-only
    spec:
      serviceAccountName: haltsql-agent@REPLACE_ME_PROJECT.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - name: agent
          image: REPLACE_ME_REGION-docker.pkg.dev/REPLACE_ME_PROJECT/agents/analytics-agent:1.0.0
          ports:
            - { name: http1, containerPort: 8080 }
          env:
            - { name: HALTSQL_URL, value: "http://localhost:8081" }
            - name: HALTSQL_TOKEN
              valueFrom:
                secretKeyRef: { name: haltsql-analytics-agent-token, key: latest }
            # Connect to Cloud SQL with a Cloud SQL language connector (IAM DB
            # auth) or to its private IP with sslmode=verify-full.
            - { name: INSTANCE_CONNECTION_NAME, value: "REPLACE_ME_PROJECT:REPLACE_ME_REGION:REPLACE_ME_INSTANCE" }
          resources:
            limits: { cpu: "1", memory: 1Gi }
        - name: haltsql
          image: REPLACE_ME_REGION-docker.pkg.dev/REPLACE_ME_PROJECT/ghcr/haltsql/haltsql:0.0.1
          args: ["--config", "/etc/haltsql/config/config.yaml", "--listen", "0.0.0.0:8081"]
          env:
            - { name: HALTSQL_AUDIT_BUCKET, value: REPLACE_ME_PROJECT-haltsql-audit }
            - name: HALTSQL_TOKEN_SHA256
              valueFrom:
                secretKeyRef: { name: haltsql-analytics-agent-token-sha256, key: latest }
          startupProbe:
            httpGet: { path: /readyz, port: 8081 }
            periodSeconds: 1
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: 8081 }
            periodSeconds: 10
          resources:
            limits: { cpu: "0.5", memory: 256Mi }
          volumeMounts:
            - { name: haltsql-config, mountPath: /etc/haltsql/config }
            - { name: haltsql-policies, mountPath: /etc/haltsql/policies }
            - { name: haltsql-spool, mountPath: /var/spool/haltsql }
        - name: otel-collector
          image: docker.io/otel/opentelemetry-collector-contrib:0.164.0   # mirror to Artifact Registry in production
          args: ["--config=/etc/otelcol/config.yaml"]
          startupProbe:
            httpGet: { path: /, port: 13133 }
            periodSeconds: 1
            failureThreshold: 30
          resources:
            limits: { cpu: "0.5", memory: 256Mi }
          volumeMounts:
            - { name: otel-config, mountPath: /etc/otelcol }
      volumes:
        - name: haltsql-config
          secret:
            secretName: haltsql-sidecar-config
            items: [{ key: latest, path: config.yaml }]
        - name: haltsql-policies
          secret:
            secretName: haltsql-policy-analytics-agent
            items: [{ key: latest, path: analytics-agent.yaml }]
        - name: otel-config
          secret:
            secretName: haltsql-otel-config
            items: [{ key: latest, path: config.yaml }]
        - name: haltsql-spool
          emptyDir: { medium: Memory, sizeLimit: 64Mi }
