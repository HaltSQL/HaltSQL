# report test fixture: shop analytics rolled out in shadow mode, bound tenancy.
apiVersion: haltsql.dev/v1
kind: Policy
metadata:
  name: shop-shadow
  owner: report-tests
dialect: postgres-17
search_path: [app]
statements: { allow: [select] }
require_limit: { max: 100 }
tenancy:
  mode: bound
  keys: { tenant: "${ctx.tenant_id}" }
tables:
  app.orders:
    columns: [id, tenant_id, status, total_cents, created_at]
    tenant_column: tenant_id
  app.customers:
    # email and phone are intentionally absent
    columns: [id, tenant_id, name]
    tenant_column: tenant_id
  app.currencies:
    columns: "*"
functions:
  presets: [aggregates]
mode: shadow
