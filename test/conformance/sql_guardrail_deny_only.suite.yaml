apiVersion: haltsql.dev/v1
kind: TestSuite
metadata:
  name: sqlg-deny-only
  description: "users with only deny_columns: [password_hash]"
policy: policies/sqlg_deny_only.yaml
defaults:
  context: {"tenant_id":"42"}
cases:
  - name: "quoted uppercase is an unknown column: \"PASSWORD_HASH\" FR"
    sql: "SELECT \"PASSWORD_HASH\" FROM users LIMIT 1"
    expect: deny
    tags: ["conformance", "sqlg:tests/test_security.py::TestCategoricalBans::test_quoted_uppercase_denied_column_blocked", "differs-code"]
  - name: "quoted uppercase is an unknown column: \"Password_Hash\" FR"
    sql: "SELECT \"Password_Hash\" FROM users LIMIT 1"
    expect: deny
    tags: ["conformance", "sqlg:tests/test_security.py::TestCategoricalBans::test_quoted_uppercase_denied_column_blocked", "differs-code"]
  - name: "quoted uppercase is an unknown column: u.\"PASSWORD_HASH\" "
    sql: "SELECT u.\"PASSWORD_HASH\" FROM users u LIMIT 1"
    expect: deny
    tags: ["conformance", "sqlg:tests/test_security.py::TestCategoricalBans::test_quoted_uppercase_denied_column_blocked", "differs-code"]
  - name: "denied column"
    sql: "SELECT password_hash FROM users"
    expect: deny
    codes: [E_COLUMN_DENIED]
    tags: ["conformance", "sqlg:tests/test_security.py::TestPublicApi::test_has_category_shortcut"]
  - name: "allowed column"
    sql: "SELECT id FROM users"
    expect: allow
    bind: []
    tags: ["conformance", "sqlg:tests/test_security.py::TestPublicApi::test_has_category_shortcut"]
  - name: "other non-denied columns readable"
    sql: "SELECT id, name, ssn, email FROM users"
    expect: allow
    bind: []
    tags: ["conformance", "sqlg:tests/test_security.py::TestCategoricalBans::test_quoted_uppercase_denied_column_blocked", "sqlg-adapted"]
  - name: "star includes the denied column"
    sql: "SELECT * FROM users"
    expect: deny
    codes: [E_COLUMN_DENIED]
    tags: ["conformance", "sqlg:tests/test_security.py::TestCategoricalBans::test_quoted_uppercase_denied_column_blocked", "sqlg-adapted"]
