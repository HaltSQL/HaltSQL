    tags: ["conformance", "sqlg:tests/unit/test_predicates.py::test_predicate_cases", "differs-code"]
  - name: "predicate: extra AND conjunct on a non-allowed column"
    sql: "SELECT id FROM orders WHERE account_id = 42 AND status = 'paid'"
    expect: deny
    codes: [E_COLUMN_DENIED]
    tags: ["conformance", "sqlg:tests/unit/test_predicates.py::test_predicate_cases", "differs"]
  - name: "predicate: WHERE 1 = 1"
    sql: "SELECT id FROM orders WHERE 1 = 1"
