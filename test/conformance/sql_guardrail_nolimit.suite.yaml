    sql: "WITH x AS (INSERT INTO audit_log VALUES ('owned') RETURNING 1) SELECT * FROM x"
    expect: deny
    codes: [E_DATA_MODIFYING_CTE]
    tags: ["conformance", "sqlg:tests/unit/test_preflight.py::TestDataModifyingCTE::test_dml_in_cte_is_flagged"]
  - name: "DML in CTE: (UPDATE orders SET total "
    sql: "WITH x AS (UPDATE orders SET total = 0 RETURNING id) SELECT * FROM x"
    expect: deny
    codes: [E_DATA_MODIFYING_CTE]
    tags: ["conformance", "sqlg:tests/unit/test_preflight.py::TestDataModifyingCTE::test_dml_in_cte_is_flagged"]
  - name: "DML in CTE: (DELETE FROM users WHERE "
    sql: "WITH x AS (DELETE FROM users WHERE id = 1 RETURNING id) SELECT * FROM x"
    expect: deny
    codes: [E_DATA_MODIFYING_CTE]
    tags: ["conformance", "sqlg:tests/unit/test_preflight.py::TestDataModifyingCTE::test_dml_in_cte_is_flagged"]
  - name: "nested DML CTE"
    sql: "WITH a AS (SELECT 1), b AS (DELETE FROM users WHERE id = 1 RETURNING id) SELECT * FROM a, b"
    expect: deny
    codes: [E_DATA_MODIFYING_CTE]
    tags: ["conformance", "sqlg:tests/unit/test_preflight.py::TestDataModifyingCTE::test_nested_dml_cte_is_flagged"]
  - name: "multiple DML CTEs"
    sql: "WITH a AS (INSERT INTO t1 VALUES (1) RETURNING 1), b AS (UPDATE t2 SET x = 1 RETURNING x) SELECT * FROM a, b"
    expect: deny
    codes: [E_DATA_MODIFYING_CTE]
    tags: ["conformance", "sqlg:tests/unit/test_preflight.py::TestDataModifyingCTE::test_multiple_dml_ctes_each_flagged"]
  - name: "100 nested parentheses around TRUE"
    sql: "SELECT 1 WHERE ((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((((TRUE))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))"
    expect: allow
    bind: []
    tags: ["conformance", "sqlg:tests/test_security.py::TestRobustness::test_verify_never_raises", "ambiguous"]
  - name: "predicate: equality"
    sql: "SELECT id FROM orders WHERE account_id = 42"
    expect: allow
    bind: []
    tags: ["conformance", "sqlg:tests/unit/test_predicates.py::test_predicate_cases"]
  - name: "predicate: missing"
    sql: "SELECT id FROM orders"
    expect: deny
    codes: [E_TENANT_MISSING]
    tags: ["conformance", "sqlg:tests/unit/test_predicates.py::test_predicate_cases"]
  - name: "predicate: wrong tenant"
    sql: "SELECT id FROM orders WHERE account_id = 99"
    expect: deny
