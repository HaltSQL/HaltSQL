    tags: ["conformance", "sqlg:tests/unit/test_statement_kinds.py::test_forbidden_statement_kinds"]
  - name: "forbidden statement kind: CREATE ROLE evil WITH SUPERUSER"
    sql: "CREATE ROLE evil WITH SUPERUSER"
    expect: deny
    codes: [E_STATEMENT_KIND]
    tags: ["conformance", "sqlg:tests/unit/test_statement_kinds.py::test_forbidden_statement_kinds"]
  - name: "forbidden statement kind: DROP ROLE alice"
    sql: "DROP ROLE alice"
    expect: deny
    codes: [E_STATEMENT_KIND]
    tags: ["conformance", "sqlg:tests/unit/test_statement_kinds.py::test_forbidden_statement_kinds"]
  - name: "forbidden statement kind: ALTER ROLE alice WITH SUPERUSER"
