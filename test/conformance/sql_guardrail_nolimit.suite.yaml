# The SQL strings below are taken from that project's tests (tests/malicious,
# tests/benign, tests/test_corpus.py, tests/test_security.py, tests/unit/*);
# each case's `sqlg:<file>::<test>` tag names the original test. Expected
# verdicts follow HALTSQL semantics (PLAN.md section 6). Cases tagged `differs`
# have a different outcome from sql-guardrail, `differs-code` the same outcome
# for a different reason; cases tagged `sqlg-adapted` change the SQL slightly
# (noted in the case name); cases tagged `ambiguous` exercise behaviour
# HaltSQL's spec leaves open. See README.md.
# GENERATED from the ported data; regenerate rather than hand-editing.
# ---------------------------------------------------------------------------
apiVersion: haltsql.dev/v1
kind: TestSuite
metadata:
  name: sqlg-nolimit
  description: "sql-guardrail unit tests (predicates, statement kinds, preflight, robustness) under a policy without require_limit"
policy: policies/sqlg_nolimit.yaml
defaults:
  context: {"tenant_id":"42"}
cases:
  - name: "forbidden statement kind: CALL my_procedure()"
    sql: "CALL my_procedure()"
    expect: deny
    codes: [E_STATEMENT_KIND]
    tags: ["conformance", "sqlg:tests/unit/test_statement_kinds.py::test_forbidden_statement_kinds"]
  - name: "forbidden statement kind: CALL my_procedure(1, 2, 3)"
    sql: "CALL my_procedure(1, 2, 3)"
    expect: deny
    codes: [E_STATEMENT_KIND]
    tags: ["conformance", "sqlg:tests/unit/test_statement_kinds.py::test_forbidden_statement_kinds"]
  - name: "forbidden statement kind: SET search_path = 'evil'"
    sql: "SET search_path = 'evil'"
    expect: deny
    codes: [E_STATEMENT_KIND]
    tags: ["conformance", "sqlg:tests/unit/test_statement_kinds.py::test_forbidden_statement_kinds"]
  - name: "forbidden statement kind: SET LOCAL statement_timeout = '1s'"
    sql: "SET LOCAL statement_timeout = '1s'"
    expect: deny
    codes: [E_STATEMENT_KIND]
    tags: ["conformance", "sqlg:tests/unit/test_statement_kinds.py::test_forbidden_statement_kinds"]
  - name: "forbidden statement kind: RESET search_path"
    sql: "RESET search_path"
