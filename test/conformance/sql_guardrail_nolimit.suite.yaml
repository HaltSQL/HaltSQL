  - name: "forbidden statement kind: BEGIN"
    sql: "BEGIN"
    expect: deny
    codes: [E_STATEMENT_KIND]
    tags: ["conformance", "sqlg:tests/unit/test_statement_kinds.py::test_forbidden_statement_kinds"]
  - name: "forbidden statement kind: COMMIT"
    sql: "COMMIT"
    expect: deny
    codes: [E_STATEMENT_KIND]
    tags: ["conformance", "sqlg:tests/unit/test_statement_kinds.py::test_forbidden_statement_kinds"]
  - name: "forbidden statement kind: ROLLBACK"
    sql: "ROLLBACK"
    expect: deny
    codes: [E_STATEMENT_KIND]
    tags: ["conformance", "sqlg:tests/unit/test_statement_kinds.py::test_forbidden_statement_kinds"]
  - name: "forbidden statement kind: CREATE EXTENSION pg_stat_statements"
