    tags: ["conformance", "sqlg:tests/unit/test_cast_tolerance.py::test_cast_tolerance"]
  - name: "expression on column side does not prove: (account_id * 2)::int = 42"
    sql: "SELECT id FROM orders WHERE (account_id * 2)::int = 42"
