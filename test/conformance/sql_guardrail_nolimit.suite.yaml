    tags: ["conformance", "sqlg:tests/unit/test_statement_kinds.py::test_forbidden_statement_kinds"]
  - name: "forbidden statement kind: CREATE DATABASE evil"
    sql: "CREATE DATABASE evil"
    expect: deny
    codes: [E_STATEMENT_KIND]
    tags: ["conformance", "sqlg:tests/unit/test_statement_kinds.py::test_forbidden_statement_kinds"]
  - name: "forbidden statement kind: DROP DATABASE production"
    sql: "DROP DATABASE production"
    expect: deny
    codes: [E_STATEMENT_KIND]
    tags: ["conformance", "sqlg:tests/unit/test_statement_kinds.py::test_forbidden_statement_kinds"]
  - name: "allowed statement kind: SELECT 1"
    sql: "SELECT 1"
    expect: allow
    bind: []
    tags: ["conformance", "sqlg:tests/unit/test_statement_kinds.py::test_allowed_statement_kinds"]
  - name: "SELECT * on tenant table expands to denied columns"
    sql: "SELECT * FROM orders WHERE account_id = 42"
    expect: deny
    codes: [E_COLUMN_DENIED]
    tags: ["conformance", "sqlg:tests/unit/test_statement_kinds.py::test_allowed_statement_kinds", "differs"]
  - name: "allowed statement kind: CTE"
    sql: "WITH x AS (SELECT 1) SELECT * FROM x"
    expect: allow
    bind: []
    tags: ["conformance", "sqlg:tests/unit/test_statement_kinds.py::test_allowed_statement_kinds"]
  - name: "read-only: SELECT 1"
    sql: "SELECT 1"
    expect: allow
    bind: []
    tags: ["conformance", "sqlg:tests/unit/test_readonly.py::test_readonly_cases"]
  - name: "read-only: SELECT * FROM users WHERE id = 1"
    sql: "SELECT * FROM users WHERE id = 1"
    expect: deny
    codes: [E_COLUMN_DENIED]
    tags: ["conformance", "sqlg:tests/unit/test_readonly.py::test_readonly_cases", "differs"]
  - name: "read-only: INSERT INTO t VALUES (1)"
    sql: "INSERT INTO t VALUES (1)"
    expect: deny
    codes: [E_STATEMENT_KIND]
    tags: ["conformance", "sqlg:tests/unit/test_readonly.py::test_readonly_cases"]
  - name: "read-only: UPDATE t SET x = 1"
    sql: "UPDATE t SET x = 1"
    expect: deny
    codes: [E_STATEMENT_KIND]
    tags: ["conformance", "sqlg:tests/unit/test_readonly.py::test_readonly_cases"]
  - name: "read-only: DELETE FROM t"
    sql: "DELETE FROM t"
    expect: deny
    codes: [E_STATEMENT_KIND]
    tags: ["conformance", "sqlg:tests/unit/test_readonly.py::test_readonly_cases"]
  - name: "read-only: DROP TABLE t"
    sql: "DROP TABLE t"
    expect: deny
    codes: [E_STATEMENT_KIND]
    tags: ["conformance", "sqlg:tests/unit/test_readonly.py::test_readonly_cases"]
  - name: "read-only: CREATE TABLE t (x int)"
    sql: "CREATE TABLE t (x int)"
    expect: deny
    codes: [E_STATEMENT_KIND]
    tags: ["conformance", "sqlg:tests/unit/test_readonly.py::test_readonly_cases"]
  - name: "read-only: ALTER TABLE t ADD COLUMN y int"
    sql: "ALTER TABLE t ADD COLUMN y int"
    expect: deny
    codes: [E_STATEMENT_KIND]
    tags: ["conformance", "sqlg:tests/unit/test_readonly.py::test_readonly_cases"]
  - name: "read-only: TRUNCATE t"
    sql: "TRUNCATE t"
    expect: deny
    codes: [E_STATEMENT_KIND]
    tags: ["conformance", "sqlg:tests/unit/test_readonly.py::test_readonly_cases"]
  - name: "read-only: GRANT SELECT ON t TO u"
    sql: "GRANT SELECT ON t TO u"
    expect: deny
    codes: [E_STATEMENT_KIND]
    tags: ["conformance", "sqlg:tests/unit/test_readonly.py::test_readonly_cases"]
  - name: "read-only: REVOKE SELECT ON t FROM u"
    sql: "REVOKE SELECT ON t FROM u"
    expect: deny
    codes: [E_STATEMENT_KIND]
    tags: ["conformance", "sqlg:tests/unit/test_readonly.py::test_readonly_cases"]
  - name: "read-only: MERGE INTO t USING s ON s.id = t.id WHEN MATCHED THEN UPDATE SET x = 1"
    sql: "MERGE INTO t USING s ON s.id = t.id WHEN MATCHED THEN UPDATE SET x = 1"
    expect: deny
    codes: [E_STATEMENT_KIND]
    tags: ["conformance", "sqlg:tests/unit/test_readonly.py::test_readonly_cases"]
  - name: "read-only: WITH d AS (DELETE FROM t RETURNING 1) SELECT 1"
    sql: "WITH d AS (DELETE FROM t RETURNING 1) SELECT 1"
    expect: deny
    codes: [E_DATA_MODIFYING_CTE]
    tags: ["conformance", "sqlg:tests/unit/test_readonly.py::test_readonly_cases"]
  - name: "preflight: SELECT 1"
    sql: "SELECT 1"
    expect: allow
    bind: []
    tags: ["conformance", "sqlg:tests/unit/test_preflight.py::test_select_one_is_clean"]
  - name: "degenerate input \"\""
    sql: ""
    expect: deny
    codes: [E_EMPTY]
    tags: ["conformance", "sqlg:tests/test_security.py::TestRobustness::test_empty_or_degenerate_fails_closed", "differs-code"]
  - name: "degenerate input \"   \""
    sql: "   "
    expect: deny
    codes: [E_EMPTY]
    tags: ["conformance", "sqlg:tests/test_security.py::TestRobustness::test_empty_or_degenerate_fails_closed", "differs-code"]
  - name: "degenerate input \";\""
    sql: ";"
    expect: deny
    codes: [E_EMPTY]
    tags: ["conformance", "sqlg:tests/test_security.py::TestRobustness::test_empty_or_degenerate_fails_closed", "differs-code"]
  - name: "degenerate input \"-- only\""
    sql: "-- only"
    expect: deny
    codes: [E_EMPTY]
    tags: ["conformance", "sqlg:tests/test_security.py::TestRobustness::test_empty_or_degenerate_fails_closed", "differs-code"]
  - name: "degenerate input \"/* only */\""
    sql: "/* only */"
    expect: deny
    codes: [E_EMPTY]
    tags: ["conformance", "sqlg:tests/test_security.py::TestRobustness::test_empty_or_degenerate_fails_closed", "differs-code"]
  - name: "preflight: garbage"
    sql: "garbage SQL that won't parse $%@#"
    expect: deny
    codes: [E_PARSE]
    tags: ["conformance", "sqlg:tests/test_security.py::TestRobustness::test_verify_never_raises"]
  - name: "preflight: multi statement"
    sql: "SELECT 1; SELECT 2"
    expect: deny
    codes: [E_MULTI_STATEMENT]
    tags: ["conformance", "sqlg:tests/unit/test_preflight.py::test_multi_statement_is_flagged"]
  - name: "preflight: trailing semicolon is one statement"
    sql: "SELECT 1;"
    expect: allow
    bind: []
    tags: ["conformance", "sqlg:tests/unit/test_preflight.py::test_trailing_semicolon_does_not_count"]
  - name: "preflight: VACUUM"
    sql: "VACUUM"
    expect: deny
    codes: [E_STATEMENT_KIND]
    tags: ["conformance", "sqlg:tests/unit/test_preflight.py::test_vacuum_is_command_default_deny"]
  - name: "preflight: LISTEN"
    sql: "LISTEN foo"
    expect: deny
    codes: [E_STATEMENT_KIND]
    tags: ["conformance", "sqlg:tests/unit/test_preflight.py::test_listen_is_command_default_deny"]
  - name: "preflight: INSERT under read-only"
    sql: "INSERT INTO t (a) VALUES (1)"
    expect: deny
    codes: [E_STATEMENT_KIND]
    tags: ["conformance", "sqlg:tests/unit/test_preflight.py::test_insert_under_read_only_emits_statement_forbidden_but_continues"]
  - name: "preflight: UNION is select-like"
    sql: "SELECT 1 UNION SELECT 2"
    expect: allow
    bind: []
    tags: ["conformance", "sqlg:tests/unit/test_preflight.py::test_union_is_select_like"]
  - name: "preflight: WITH is select-like"
    sql: "WITH x AS (SELECT 1 AS a) SELECT a FROM x"
    expect: allow
    bind: []
    tags: ["conformance", "sqlg:tests/unit/test_preflight.py::test_with_cte_is_select_like"]
  - name: "preflight DDL/DCL: ALTER TABLE t ADD COLUMN c INT"
    sql: "ALTER TABLE t ADD COLUMN c INT"
    expect: deny
    codes: [E_STATEMENT_KIND]
    tags: ["conformance", "sqlg:tests/unit/test_preflight.py::test_other_ddl_dcl_rejected"]
  - name: "preflight DDL/DCL: TRUNCATE TABLE t"
    sql: "TRUNCATE TABLE t"
    expect: deny
    codes: [E_STATEMENT_KIND]
    tags: ["conformance", "sqlg:tests/unit/test_preflight.py::test_other_ddl_dcl_rejected"]
  - name: "preflight DDL/DCL: GRANT SELECT ON t TO somebody"
    sql: "GRANT SELECT ON t TO somebody"
    expect: deny
