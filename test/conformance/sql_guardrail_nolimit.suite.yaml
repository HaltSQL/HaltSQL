  - name: "cast tolerance: plain"
    sql: "SELECT id FROM orders WHERE account_id = 42"
    expect: allow
    bind: []
    tags: ["conformance", "sqlg:tests/unit/test_cast_tolerance.py::test_cast_tolerance"]
  - name: "cast on column side does not prove: account_id::text = 42"
