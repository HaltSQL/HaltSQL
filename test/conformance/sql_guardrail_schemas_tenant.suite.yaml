apiVersion: haltsql.dev/v1
kind: TestSuite
metadata:
  name: sqlg-schemas-tenant
  description: "require_predicate only on public.orders"
policy: policies/sqlg_schemas_tenant.yaml
defaults:
  context: {"tenant_id":"42"}
cases:
  - name: "public.orders without predicate"
    sql: "SELECT id FROM public.orders LIMIT 1"
    expect: deny
    codes: [E_TENANT_MISSING]
    tags: ["conformance", "sqlg:tests/test_security.py::TestIdentifiers::test_schema_qualified_require_predicate_enforced_per_schema"]
  - name: "analytics.orders without predicate"
    sql: "SELECT id FROM analytics.orders LIMIT 1"
    expect: allow
    bind: []
    tags: ["conformance", "sqlg:tests/test_security.py::TestIdentifiers::test_schema_qualified_require_predicate_enforced_per_schema"]
  - name: "public.orders with predicate"
    sql: "SELECT id FROM public.orders WHERE account_id = 42 LIMIT 1"
    expect: allow
    bind: []
    tags: ["conformance", "sqlg:tests/test_security.py::TestIdentifiers::test_schema_qualified_require_predicate_enforced_per_schema", "sqlg-adapted"]
  - name: "unqualified orders is public.orders (needs predicate)"
    sql: "SELECT id FROM orders LIMIT 1"
    expect: deny
    codes: [E_TENANT_MISSING]
    tags: ["conformance", "sqlg:tests/test_security.py::TestIdentifiers::test_unqualified_policy_matches_any_schema", "sqlg-adapted"]
  - name: "unlisted schema with same table name"
    sql: "SELECT id FROM staging.orders LIMIT 1"
    expect: deny
    codes: [E_TABLE_DENIED]
    tags: ["conformance", "sqlg:tests/test_security.py::TestIdentifiers::test_unqualified_policy_matches_any_schema", "differs"]
