#             and this permission notice shall be included in all copies or
#             substantial portions of the Software.)
# The SQL strings below are taken from that project's tests (tests/malicious,
# tests/benign, tests/test_corpus.py, tests/test_security.py, tests/unit/*);
# each case's `sqlg:<file>::<test>` tag names the original test. Expected
# verdicts follow HALTSQL semantics (PLAN.md section 6). Cases tagged `differs`
# have a different outcome from sql-guardrail, `differs-code` the same outcome
# for a different reason; cases tagged `sqlg-adapted` change the SQL slightly
# (noted in the case name); cases tagged `ambiguous` exercise behaviour
# HaltSQL's spec leaves open. See README.md.
# GENERATED from the ported data; regenerate rather than hand-editing.
# ---------------------------------------------------------------------------
apiVersion: haltsql.dev/v1
kind: TestSuite
metadata:
  name: sqlg-functions-count
  description: "allowed_functions: [count]"
policy: policies/sqlg_fn_count.yaml
defaults:
  context: {"tenant_id":"42"}
cases:
  - name: "unknown function"
    sql: "SELECT some_unknown_fn(id) FROM users LIMIT 1"
    expect: deny
    codes: [E_FUNCTION_DENIED]
    tags: ["conformance", "sqlg:tests/test_security.py::TestFunctionAllowlist::test_allowlist_set_blocks_unknown_function"]
  - name: "listed function count"
    sql: "SELECT count(id) FROM users LIMIT 1"
    expect: allow
    bind: []
    tags: ["conformance", "sqlg:tests/test_security.py::TestFunctionAllowlist::test_allowlist_passes_listed_function"]
  - name: "pg_sleep not listed"
    sql: "SELECT pg_sleep(1) FROM users LIMIT 1"
    expect: deny
    codes: [E_FUNCTION_DENIED]
    tags: ["conformance", "sqlg:tests/test_security.py::TestFunctionAllowlist::test_allowlist_blocks_pg_specific_function_when_not_listed"]
  - name: "typed func: lower(name)"
    sql: "SELECT lower(name) FROM users LIMIT 1"
    expect: deny
    codes: [E_FUNCTION_DENIED]
    tags: ["conformance", "sqlg:tests/test_security.py::TestFunctionAllowlist::test_allowlist_blocks_typed_func_subclasses_when_not_listed"]
  - name: "typed func: upper(name)"
    sql: "SELECT upper(name) FROM users LIMIT 1"
    expect: deny
    codes: [E_FUNCTION_DENIED]
    tags: ["conformance", "sqlg:tests/test_security.py::TestFunctionAllowlist::test_allowlist_blocks_typed_func_subclasses_when_not_listed"]
  - name: "typed func: length(name)"
    sql: "SELECT length(name) FROM users LIMIT 1"
    expect: deny
    codes: [E_FUNCTION_DENIED]
    tags: ["conformance", "sqlg:tests/test_security.py::TestFunctionAllowlist::test_allowlist_blocks_typed_func_subclasses_when_not_listed"]
  - name: "typed func: substring(name, 1, 3)"
    sql: "SELECT substring(name, 1, 3) FROM users LIMIT 1"
    expect: deny
    codes: [E_FUNCTION_DENIED]
    tags: ["conformance", "sqlg:tests/test_security.py::TestFunctionAllowlist::test_allowlist_blocks_typed_func_subclasses_when_not_listed"]
  - name: "typed func: abs(id)"
    sql: "SELECT abs(id) FROM users LIMIT 1"
    expect: deny
    codes: [E_FUNCTION_DENIED]
    tags: ["conformance", "sqlg:tests/test_security.py::TestFunctionAllowlist::test_allowlist_blocks_typed_func_subclasses_when_not_listed"]
  - name: "typed func: coalesce(name, 'x')"
    sql: "SELECT coalesce(name, 'x') FROM users LIMIT 1"
    expect: allow
    bind: []
    tags: ["conformance", "sqlg:tests/test_security.py::TestFunctionAllowlist::test_allowlist_blocks_typed_func_subclasses_when_not_listed", "ambiguous"]
  - name: "typed func: cast(id AS text) (a cast, not a function)"
    sql: "SELECT cast(id AS text) FROM users LIMIT 1"
    expect: allow
    bind: []
    tags: ["conformance", "sqlg:tests/test_security.py::TestFunctionAllowlist::test_allowlist_blocks_typed_func_subclasses_when_not_listed", "differs"]
  - name: "typed func: id::text (a cast, not a function)"
    sql: "SELECT id::text FROM users LIMIT 1"
    expect: allow
    bind: []
    tags: ["conformance", "sqlg:tests/test_security.py::TestFunctionAllowlist::test_allowlist_blocks_typed_func_subclasses_when_not_listed", "differs"]
  - name: "typed func: current_user"
    sql: "SELECT current_user FROM users LIMIT 1"
    expect: deny
    codes: [E_FUNCTION_DENIED]
    tags: ["conformance", "sqlg:tests/test_security.py::TestFunctionAllowlist::test_allowlist_blocks_typed_func_subclasses_when_not_listed"]
  - name: "typed func: current_database()"
    sql: "SELECT current_database() FROM users LIMIT 1"
    expect: deny
    codes: [E_FUNCTION_DENIED]
    tags: ["conformance", "sqlg:tests/test_security.py::TestFunctionAllowlist::test_allowlist_blocks_typed_func_subclasses_when_not_listed"]
  - name: "typed func: current_schema()"
    sql: "SELECT current_schema() FROM users LIMIT 1"
    expect: deny
    codes: [E_FUNCTION_DENIED]
    tags: ["conformance", "sqlg:tests/test_security.py::TestFunctionAllowlist::test_allowlist_blocks_typed_func_subclasses_when_not_listed"]
  - name: "typed func: now()"
    sql: "SELECT now() FROM users LIMIT 1"
    expect: deny
    codes: [E_FUNCTION_DENIED]
    tags: ["conformance", "sqlg:tests/test_security.py::TestFunctionAllowlist::test_allowlist_blocks_typed_func_subclasses_when_not_listed"]
  - name: "typed func: extract(YEAR FROM now())"
    sql: "SELECT extract(YEAR FROM now()) FROM users LIMIT 1"
    expect: deny
    codes: [E_FUNCTION_DENIED]
    tags: ["conformance", "sqlg:tests/test_security.py::TestFunctionAllowlist::test_allowlist_blocks_typed_func_subclasses_when_not_listed"]
  - name: "typed func: array_agg(id)"
    sql: "SELECT array_agg(id) FROM users LIMIT 1"
    expect: deny
    codes: [E_FUNCTION_DENIED]
    tags: ["conformance", "sqlg:tests/test_security.py::TestFunctionAllowlist::test_allowlist_blocks_typed_func_subclasses_when_not_listed"]
  - name: "typed func: max(id)"
    sql: "SELECT max(id) FROM users LIMIT 1"
    expect: deny
    codes: [E_FUNCTION_DENIED]
    tags: ["conformance", "sqlg:tests/test_security.py::TestFunctionAllowlist::test_allowlist_blocks_typed_func_subclasses_when_not_listed"]
  - name: "typed func: replace(name, 'a', 'b')"
    sql: "SELECT replace(name, 'a', 'b') FROM users LIMIT 1"
    expect: deny
    codes: [E_FUNCTION_DENIED]
    tags: ["conformance", "sqlg:tests/test_security.py::TestFunctionAllowlist::test_allowlist_blocks_typed_func_subclasses_when_not_listed"]
  - name: "typed func: trim(name)"
    sql: "SELECT trim(name) FROM users LIMIT 1"
    expect: deny
    codes: [E_FUNCTION_DENIED]
    tags: ["conformance", "sqlg:tests/test_security.py::TestFunctionAllowlist::test_allowlist_blocks_typed_func_subclasses_when_not_listed"]
  - name: "typed func: concat(name, '!')"
    sql: "SELECT concat(name, '!') FROM users LIMIT 1"
    expect: deny
    codes: [E_FUNCTION_DENIED]
    tags: ["conformance", "sqlg:tests/test_security.py::TestFunctionAllowlist::test_allowlist_blocks_typed_func_subclasses_when_not_listed"]
  - name: "pg_sleep inside CASE"
    sql: "SELECT CASE WHEN id = 1 THEN pg_sleep(1) ELSE 0 END FROM users LIMIT 1"
    expect: deny
    codes: [E_FUNCTION_DENIED]
    tags: ["conformance", "sqlg:tests/test_security.py::TestFunctionAllowlist::test_allowlist_still_rejects_genuine_functions_inside_case"]
