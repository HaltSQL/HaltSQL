# Threat class: table_escape.
# Policy: saas.yaml. Relations outside the allowlist must be denied wherever they appear (FROM, JOIN, subqueries, CTEs, set-op branches, LATERAL), including other schemas, catalog-qualified names and search_path tricks.
apiVersion: haltsql.dev/v1
kind: TestSuite
metadata:
  name: table_escape
policy: ../fixtures/policies/saas.yaml
defaults:
  context: { tenant_id: acme }
cases:
  - name: "table in catalog not in policy"
    sql: |-
      SELECT id, secret FROM api_keys WHERE tenant_id = $1 LIMIT 10
    expect: deny
    codes: [E_TABLE_DENIED]
    tags: [table_escape]
  - name: "qualified table not in policy"
    sql: |-
      SELECT name FROM app.feature_flags LIMIT 10
    expect: deny
    codes: [E_TABLE_DENIED]
    tags: [table_escape]
  - name: "unknown table"
    sql: |-
      SELECT * FROM salaries LIMIT 10
    expect: deny
    codes: [E_TABLE_DENIED]
    tags: [table_escape]
  - name: "public schema orders"
    sql: |-
      SELECT id FROM public.orders WHERE tenant_id = $1 LIMIT 10
    expect: deny
    codes: [E_TABLE_DENIED]
    tags: [table_escape, search_path]
  - name: "other schema same name"
    sql: |-
      SELECT id FROM billing.orders WHERE tenant_id = $1 LIMIT 10
    expect: deny
    codes: [E_TABLE_DENIED]
    tags: [table_escape, search_path]
  - name: "other schema ledger"
    sql: |-
      SELECT * FROM billing.ledger LIMIT 10
    expect: deny
    codes: [E_TABLE_DENIED]
    tags: [table_escape]
  - name: "catalog qualified name"
    sql: |-
      SELECT id FROM proddb.app.orders WHERE tenant_id = $1 LIMIT 10
    expect: deny
    tags: [table_escape, ambiguous]
  - name: "denied table in join"
    sql: |-
      SELECT o.id, k.secret FROM orders o JOIN api_keys k ON k.tenant_id = $1 WHERE o.tenant_id = $1 LIMIT 10
    expect: deny
    codes: [E_TABLE_DENIED]
    tags: [table_escape, join]
  - name: "denied table in left join"
    sql: |-
      SELECT o.id FROM orders o LEFT JOIN app.api_keys k ON k.tenant_id = o.tenant_id AND k.tenant_id = $1 WHERE o.tenant_id = $1 LIMIT 10
    expect: deny
    codes: [E_TABLE_DENIED]
    tags: [table_escape, join]
  - name: "denied table in exists"
    sql: |-
      SELECT id FROM orders o WHERE o.tenant_id = $1 AND EXISTS (SELECT 1 FROM api_keys k WHERE k.tenant_id = $1) LIMIT 10
    expect: deny
    codes: [E_TABLE_DENIED]
    tags: [table_escape, subquery]
  - name: "denied table in scalar subquery"
    sql: |-
      SELECT id, (SELECT secret FROM api_keys k WHERE k.tenant_id = $1 LIMIT 1) FROM orders WHERE tenant_id = $1 LIMIT 10
    expect: deny
    codes: [E_TABLE_DENIED]
    tags: [table_escape, subquery]
  - name: "denied table in in subquery"
    sql: |-
      SELECT id FROM orders WHERE tenant_id = $1 AND customer_id IN (SELECT id FROM api_keys WHERE tenant_id = $1) LIMIT 10
    expect: deny
    codes: [E_TABLE_DENIED]
    tags: [table_escape, subquery]
  - name: "denied table in derived table"
    sql: |-
      SELECT x.secret FROM (SELECT secret FROM api_keys WHERE tenant_id = $1) x LIMIT 10
    expect: deny
    codes: [E_TABLE_DENIED]
    tags: [table_escape, subquery]
  - name: "denied table in cte"
    sql: |-
      WITH k AS (SELECT secret FROM api_keys WHERE tenant_id = $1) SELECT secret FROM k LIMIT 10
    expect: deny
    codes: [E_TABLE_DENIED]
    tags: [table_escape, cte]
  - name: "denied table in unused cte"
    sql: |-
      WITH k AS (SELECT secret FROM api_keys) SELECT id FROM orders WHERE tenant_id = $1 LIMIT 10
    expect: deny
    codes: [E_TABLE_DENIED]
    tags: [table_escape, cte]
  - name: "denied table in union branch"
    sql: |-
      SELECT id::text FROM orders WHERE tenant_id = $1 UNION ALL SELECT secret FROM api_keys WHERE tenant_id = $1 LIMIT 10
    expect: deny
    codes: [E_TABLE_DENIED]
    tags: [table_escape, setop]
  - name: "denied table in except branch"
    sql: |-
      SELECT name FROM customers WHERE tenant_id = $1 EXCEPT SELECT name FROM feature_flags LIMIT 10
    expect: deny
    codes: [E_TABLE_DENIED]
    tags: [table_escape, setop]
  - name: "denied table in lateral"
    sql: |-
      SELECT o.id, k.secret FROM orders o CROSS JOIN LATERAL (SELECT secret FROM api_keys WHERE tenant_id = $1 LIMIT 1) k WHERE o.tenant_id = $1 LIMIT 10
    expect: deny
    codes: [E_TABLE_DENIED]
    tags: [table_escape, lateral]
  - name: "only keyword on allowed table"
    sql: |-
      SELECT id FROM ONLY orders WHERE tenant_id = $1 LIMIT 10
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [table_escape, only]
  - name: "only keyword on denied table"
    sql: |-
      SELECT secret FROM ONLY api_keys WHERE tenant_id = $1 LIMIT 10
    expect: deny
    codes: [E_TABLE_DENIED]
    tags: [table_escape, only]
  - name: "view not in policy"
    sql: |-
      SELECT * FROM app.customer_pii_view LIMIT 10
    expect: deny
    codes: [E_TABLE_DENIED]
    tags: [table_escape, view]
  - name: "materialized view not in policy"
    sql: |-
      SELECT tenant_id, revenue FROM app.mv_revenue_all_tenants LIMIT 10
    expect: deny
    codes: [E_TABLE_DENIED]
    tags: [table_escape, view]
  - name: "pg_temp schema"
    sql: |-
      SELECT * FROM pg_temp.orders LIMIT 10
    expect: deny
    codes: [E_TABLE_DENIED]
    tags: [table_escape, search_path]
  - name: "quoted schema with dot in name"
    sql: |-
      SELECT id FROM "app.orders" WHERE tenant_id = $1 LIMIT 10
    expect: deny
    codes: [E_TABLE_DENIED]
    tags: [table_escape, search_path]
  - name: "generate_series in from"
    sql: |-
      SELECT g FROM generate_series(1, 10) g LIMIT 10
    expect: deny
    codes: [E_FUNCTION_DENIED]
    tags: [table_escape, function_from]
  - name: "dblink in from"
    sql: |-
      SELECT * FROM dblink('host=evil', 'SELECT secret FROM api_keys') AS t(secret text) LIMIT 10
    expect: deny
    tags: [table_escape, function_from, ambiguous]
  - name: "pg_ls_dir in from"
    sql: |-
      SELECT * FROM pg_ls_dir('.') LIMIT 10
    expect: deny
    codes: [E_FUNCTION_DENIED]
    tags: [table_escape, function_from]
  - name: "json_to_recordset in from"
    sql: |-
      SELECT * FROM json_to_recordset('[{"a":1}]') AS x(a int) LIMIT 10
    expect: deny
    tags: [table_escape, function_from, ambiguous]
  - name: "rows from"
    sql: |-
      SELECT * FROM ROWS FROM (generate_series(1, 3)) LIMIT 10
    expect: deny
    tags: [table_escape, function_from, ambiguous]
  - name: "tablesample on allowed table"
    sql: |-
      SELECT id FROM orders TABLESAMPLE SYSTEM (10) WHERE tenant_id = $1 LIMIT 10
    expect: deny
    codes: [E_UNSUPPORTED]
    tags: [table_escape]
  - name: "values list as relation"
    sql: |-
      SELECT v.x FROM (VALUES (1), (2)) AS v(x) LIMIT 10
    expect: allow
    bind: []
    tags: [table_escape, values, ambiguous]
  - name: "alias of denied table named like allowed"
    sql: |-
      SELECT orders.secret FROM api_keys AS orders WHERE orders.tenant_id = $1 LIMIT 10
    expect: deny
    codes: [E_TABLE_DENIED]
    tags: [table_escape, alias]
