# Threat class: syntax the analyzer does not model. Anything not mapped
# precisely becomes an Unsupported node and is denied (fail closed) with
# E_UNSUPPORTED, even when the query is otherwise well-formed and tenant-filtered.
# Policy: saas.yaml.
apiVersion: haltsql.dev/v1
kind: TestSuite
metadata: { name: unsupported_syntax }
policy: ../fixtures/policies/saas.yaml
defaults:
  context: { tenant_id: acme }
cases:
  - name: grouping sets
    sql: SELECT status, count(*) FROM orders WHERE tenant_id = $1 GROUP BY GROUPING SETS ((status), ()) LIMIT 10
    expect: deny
    codes: [E_UNSUPPORTED]
    tags: [unsupported_syntax, grouping]
  - name: rollup
    sql: SELECT status, currency, count(*) FROM orders WHERE tenant_id = $1 GROUP BY ROLLUP (status, currency) LIMIT 10
    expect: deny
    codes: [E_UNSUPPORTED]
    tags: [unsupported_syntax, grouping]
  - name: cube
    sql: SELECT status, currency, count(*) FROM orders WHERE tenant_id = $1 GROUP BY CUBE (status, currency) LIMIT 10
    expect: deny
    codes: [E_UNSUPPORTED]
    tags: [unsupported_syntax, grouping]
  - name: grouping function
    sql: SELECT GROUPING(status), count(*) FROM orders WHERE tenant_id = $1 GROUP BY ROLLUP (status) LIMIT 10
    expect: deny
    codes: [E_UNSUPPORTED]
    tags: [unsupported_syntax, grouping]
  - name: tablesample system
    sql: SELECT id FROM orders TABLESAMPLE SYSTEM (10) WHERE tenant_id = $1 LIMIT 10
    expect: deny
    codes: [E_UNSUPPORTED]
    tags: [unsupported_syntax, from]
  - name: tablesample bernoulli with alias
    sql: SELECT o.id FROM orders o TABLESAMPLE BERNOULLI (1) REPEATABLE (42) WHERE o.tenant_id = $1 LIMIT 10
    expect: deny
    codes: [E_UNSUPPORTED]
    tags: [unsupported_syntax, from]
  - name: xmltable
    sql: |-
      SELECT x.a FROM XMLTABLE('/r/a' PASSING ('<r><a>1</a></r>'::xml) COLUMNS a int PATH '.') x LIMIT 10
    expect: deny
    codes: [E_UNSUPPORTED]
    tags: [unsupported_syntax, from]
  - name: json_table
    sql: |-
      SELECT jt.k FROM customers c, JSON_TABLE(c.metadata, '$.tags[*]' COLUMNS (k text PATH '$')) jt
      WHERE c.tenant_id = $1 LIMIT 10
    expect: deny
    codes: [E_UNSUPPORTED]
    tags: [unsupported_syntax, from, pg17]
  - name: rows from
    sql: SELECT * FROM ROWS FROM (generate_series(1, 3), generate_series(1, 2)) AS t(a, b) LIMIT 10
    expect: deny
    tags: [unsupported_syntax, from, ambiguous]
  - name: three part relation name
    sql: SELECT id FROM proddb.app.orders WHERE tenant_id = $1 LIMIT 10
    expect: deny
    codes: [E_UNSUPPORTED]
    tags: [unsupported_syntax, from, qualified]
  - name: three part name in join
    sql: |-
      SELECT o.id FROM orders o JOIN otherdb.app.customers c ON c.id = o.customer_id AND c.tenant_id = $1
      WHERE o.tenant_id = $1 LIMIT 10
    expect: deny
    codes: [E_UNSUPPORTED]
    tags: [unsupported_syntax, from, qualified]
  - name: row comparison subquery
    sql: |-
      SELECT id FROM orders o WHERE o.tenant_id = $1
        AND (o.id, o.customer_id) = (SELECT i.order_id, i.id FROM order_items i WHERE i.tenant_id = $1 LIMIT 1)
      LIMIT 10
    # Every relation is tenant-filtered in its own scope, so this is safe.
    expect: allow
    tags: [unsupported_syntax, sublink]
  - name: json_value pg17
    sql: SELECT JSON_VALUE(metadata, '$.segment') FROM customers WHERE tenant_id = $1 LIMIT 10
    expect: deny
    codes: [E_UNSUPPORTED]
    tags: [unsupported_syntax, json, pg17, ambiguous]
  - name: json_query pg17
    sql: SELECT JSON_QUERY(metadata, '$.tags') FROM customers WHERE tenant_id = $1 LIMIT 10
    expect: deny
    codes: [E_UNSUPPORTED]
    tags: [unsupported_syntax, json, pg17, ambiguous]
  - name: json_exists pg17
    sql: SELECT id FROM customers WHERE tenant_id = $1 AND JSON_EXISTS(metadata, '$.vip') LIMIT 10
    expect: deny
    codes: [E_UNSUPPORTED]
    tags: [unsupported_syntax, json, pg17, ambiguous]
  - name: is json predicate
    sql: SELECT id FROM customers WHERE tenant_id = $1 AND name IS JSON LIMIT 10
    expect: deny
    codes: [E_UNSUPPORTED]
    tags: [unsupported_syntax, json, ambiguous]
  - name: xmlelement
    sql: SELECT xmlelement(name x, name) FROM customers WHERE tenant_id = $1 LIMIT 10
    expect: deny
    tags: [unsupported_syntax, xml, ambiguous]
  - name: xmlserialize
    sql: SELECT XMLSERIALIZE(CONTENT '<a/>'::xml AS text) LIMIT 1
    expect: deny
    tags: [unsupported_syntax, xml, ambiguous]
  - name: cte search clause
    sql: |-
      WITH RECURSIVE t(n) AS (SELECT 1 UNION ALL SELECT n + 1 FROM t WHERE n < 5)
      SEARCH DEPTH FIRST BY n SET ord
      SELECT n FROM t LIMIT 10
    expect: deny
    tags: [unsupported_syntax, cte, ambiguous]
  - name: cte cycle clause
    sql: |-
      WITH RECURSIVE t(n) AS (SELECT 1 UNION ALL SELECT n + 1 FROM t WHERE n < 5)
      CYCLE n SET is_cycle USING path
      SELECT n FROM t LIMIT 10
    expect: deny
    tags: [unsupported_syntax, cte, ambiguous]
  - name: merge_action pg17 in plain select is invalid context
    sql: SELECT merge_action() LIMIT 1
    expect: deny
    tags: [unsupported_syntax, ambiguous]
  - name: collation for expression
    sql: SELECT COLLATION FOR (name) FROM customers WHERE tenant_id = $1 LIMIT 10
    expect: deny
    tags: [unsupported_syntax, ambiguous]
  - name: overlaps predicate
    sql: SELECT id FROM invoices WHERE tenant_id = $1 AND (issued_at, due_at) OVERLAPS (now(), now()) LIMIT 10
    expect: deny
    tags: [unsupported_syntax, ambiguous]
  - name: at time zone is supported syntax
    sql: SELECT created_at AT TIME ZONE 'UTC' FROM orders WHERE tenant_id = $1 LIMIT 10
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [unsupported_syntax, false_positive_guard, ambiguous]
  - name: plain group by is supported
    sql: SELECT status, count(*) FROM orders WHERE tenant_id = $1 GROUP BY status LIMIT 10
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [unsupported_syntax, false_positive_guard]
  - name: values list in from
    sql: SELECT v.x FROM (VALUES (1), (2)) AS v(x) LIMIT 10
    expect: allow
    bind: []
    tags: [unsupported_syntax, ambiguous]
