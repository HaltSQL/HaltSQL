  - name: strict three joins exceed max_joins 2
    sql: "SELECT o.id FROM orders o JOIN orders a ON a.id = o.id AND a.tenant_id = $1 JOIN orders b ON b.id = o.id AND b.tenant_id = $1 JOIN orders c ON c.id = o.id AND c.tenant_id = $1 WHERE o.tenant_id = $1 LIMIT 10"
    expect: deny
    codes: [E_JOIN_BUDGET]
    tags: [resource_limits, joins, strict]
  - name: strict two joins allowed
    sql: "SELECT o.id FROM orders o JOIN orders a ON a.id = o.id AND a.tenant_id = $1 JOIN orders b ON b.id = o.id AND b.tenant_id = $1 WHERE o.tenant_id = $1 LIMIT 10"
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [resource_limits, joins, strict, false_positive_guard]
  - name: strict comma join of four products
    sql: "SELECT a.sku FROM products a, products b, products c, products d LIMIT 10"
    expect: deny
    codes: [E_JOIN_BUDGET]
    tags: [resource_limits, joins, strict, cartesian]
