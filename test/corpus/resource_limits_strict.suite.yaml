# Threat class: resource exhaustion against tight limits.
# Policy: strict.yaml (max_bytes 4096, max_depth 32, max_nodes 2000, max_joins 2).
# Long SQL strings below are machine-generated.
apiVersion: haltsql.dev/v1
kind: TestSuite
metadata: { name: resource_limits_strict }
policy: ../fixtures/policies/strict.yaml
defaults:
  context: { tenant_id: acme }
cases:
