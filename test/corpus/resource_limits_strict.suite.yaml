    sql: "SELECT sku FROM products WHERE price_cents > (SELECT (SELECT (SELECT (SELECT (SELECT (SELECT (SELECT (SELECT (SELECT (SELECT (SELECT (SELECT (SELECT (SELECT (SELECT (SELECT (SELECT (SELECT (SELECT (SELECT (SELECT (SELECT (SELECT (SELECT (SELECT (SELECT (SELECT (SELECT (SELECT (SELECT (SELECT (SELECT (SELECT (SELECT (SELECT (SELECT (SELECT (SELECT (SELECT (SELECT 1)))))))))))))))))))))))))))))))))))))))) LIMIT 10"
    expect: deny
    codes: [E_LIMIT]
    tags: [resource_limits, depth, strict]
  - name: strict query over 4096 bytes
    sql: "SELECT sku FROM products WHERE title = '' LIMIT 10"
    expect: deny
    codes: [E_LIMIT]
    tags: [resource_limits, bytes, strict]
