      FROM invoices WHERE tenant_id = $1 AND paid_at IS NOT NULL LIMIT 1
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, kpi]
  - name: "arpu by plan"
    sql: |-
      SELECT c.plan, sum(o.total_cents) / NULLIF(count(DISTINCT c.id), 0) AS arpu
      FROM customers c JOIN orders o ON o.customer_id = c.id AND o.tenant_id = $1
      WHERE c.tenant_id = $1 GROUP BY c.plan LIMIT 10
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, kpi]
  - name: "repeat customers"
    sql: |-
      SELECT count(*) FROM (
        SELECT customer_id FROM orders WHERE tenant_id = $1 GROUP BY customer_id HAVING count(*) > 1
      ) r
      LIMIT 1
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, kpi]
  - name: "active users last 30 days"
    sql: |-
      SELECT count(DISTINCT actor_id) FROM audit_events
      WHERE tenant_id = $1 AND created_at >= now() - interval '30 days' LIMIT 1
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, kpi]
  - name: "largest orders with customer"
    sql: |-
      SELECT o.id, o.total_cents, c.name, c.country
      FROM orders o JOIN customers c ON c.id = o.customer_id
      WHERE o.tenant_id = $1 AND c.tenant_id = $1
      ORDER BY o.total_cents DESC LIMIT 10
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, join]
  - name: "cross join global currencies"
    sql: |-
      SELECT o.status, cur.code, count(*)
      FROM orders o CROSS JOIN currencies cur
      WHERE o.tenant_id = $1 AND cur.code = o.currency
      GROUP BY 1, 2 LIMIT 100
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, join, global]
  - name: "cte feeding window"
    sql: |-
      WITH daily AS (
        SELECT created_at::date AS d, sum(total_cents) AS rev FROM orders WHERE tenant_id = $1 GROUP BY 1
      )
      SELECT d, rev, sum(rev) OVER (ORDER BY d) AS cumulative FROM daily ORDER BY d LIMIT 365
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, cte, window]
  - name: "exists inside cte"
    sql: |-
      WITH vip AS (
        SELECT c.id FROM customers c
        WHERE c.tenant_id = $1 AND EXISTS (
          SELECT 1 FROM orders o WHERE o.tenant_id = $1 AND o.customer_id = c.id AND o.total_cents > 100000)
      )
      SELECT count(*) FROM vip LIMIT 1
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, cte, subquery]
  - name: "union inside derived table"
    sql: |-
      SELECT kind, count(*) FROM (
        SELECT 'order' AS kind FROM orders WHERE tenant_id = $1
        UNION ALL
        SELECT 'payment' FROM payments WHERE tenant_id = $1
      ) x
      GROUP BY kind LIMIT 10
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, setop, subquery]
  - name: "payment method share"
    sql: |-
      SELECT method, sum(amount_cents) AS amt, round(100.0 * sum(amount_cents) / sum(sum(amount_cents)) OVER (), 2) AS share
      FROM payments WHERE tenant_id = $1 GROUP BY method LIMIT 10
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, window]
  - name: "between numbers"
    sql: |-
      SELECT id FROM orders WHERE tenant_id = $1 AND total_cents BETWEEN 1000 AND 5000 LIMIT 100
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, conditional]
  - name: "not like"
    sql: |-
      SELECT id FROM order_items WHERE tenant_id = $1 AND product_sku NOT LIKE 'TEST-%' LIMIT 100
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, string]
  - name: "text cast of number"
    sql: |-
      SELECT id::text || '-' || status AS ref FROM orders WHERE tenant_id = $1 LIMIT 10
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, math]
  - name: "true boolean test"
    sql: |-
      SELECT id FROM orders WHERE tenant_id = $1 AND (total_cents > 0) IS TRUE LIMIT 10
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, conditional]
  - name: "group by rollup free multi column"
    sql: |-
      SELECT country, plan, count(*) FROM customers WHERE tenant_id = $1 GROUP BY country, plan ORDER BY 3 DESC LIMIT 100
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, groupby]
