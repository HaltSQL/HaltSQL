# Threat class: benign_analytics (false-positive guard).
# Policy: saas.yaml (bound tenancy, require_limit 1000).
# Realistic queries an analytics / support LLM agent writes. Every case MUST be
# allowed; each tenant-table occurrence carries `alias.tenant_id = $1` in its own
# scope, so HaltSQL must return bind_params [$1 = acme] (or [] for global-only).
apiVersion: haltsql.dev/v1
kind: TestSuite
metadata:
  name: benign_analytics
  description: Realistic analytics queries that must be allowed (false-positive guard)
policy: ../fixtures/policies/saas.yaml
defaults:
  context: { tenant_id: acme }
cases:
  - name: "simple order list"
    sql: |-
      SELECT id, status, total_cents FROM orders WHERE tenant_id = $1 LIMIT 50
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, basic]
  - name: "qualified alias order list"
    sql: |-
      SELECT o.id, o.status, o.created_at FROM orders o WHERE o.tenant_id = $1 ORDER BY o.created_at DESC LIMIT 20
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, basic]
  - name: "schema qualified table"
    sql: |-
      SELECT o.id FROM app.orders o WHERE o.tenant_id = $1 LIMIT 10
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, basic]
  - name: "table name as qualifier"
    sql: |-
      SELECT orders.id, orders.status FROM orders WHERE orders.tenant_id = $1 LIMIT 10
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, basic]
  - name: "AS alias keyword"
    sql: |-
      SELECT o.id AS order_id FROM orders AS o WHERE o.tenant_id = $1 LIMIT 10
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, basic]
  - name: "count orders"
    sql: |-
      SELECT count(*) AS n FROM orders WHERE tenant_id = $1 LIMIT 1
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, kpi]
  - name: "total revenue"
    sql: |-
      SELECT sum(total_cents) AS revenue_cents FROM orders WHERE tenant_id = $1 AND status = 'paid' LIMIT 1
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, kpi]
  - name: "average order value"
    sql: |-
      SELECT round(avg(total_cents) / 100.0, 2) AS aov FROM orders WHERE tenant_id = $1 LIMIT 1
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, kpi]
  - name: "min max order"
    sql: |-
      SELECT min(total_cents), max(total_cents) FROM orders o WHERE o.tenant_id = $1 LIMIT 1
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, kpi]
  - name: "count distinct customers"
    sql: |-
      SELECT count(DISTINCT customer_id) AS buyers FROM orders WHERE tenant_id = $1 LIMIT 1
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, kpi]
  - name: "revenue by month"
    sql: |-
      SELECT date_trunc('month', o.created_at) AS month, sum(o.total_cents) AS revenue
      FROM orders o
      WHERE o.tenant_id = $1
      GROUP BY 1
      ORDER BY 1
      LIMIT 24
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, timeseries]
  - name: "revenue by month last year"
    sql: |-
      SELECT date_trunc('month', created_at) AS month, sum(total_cents) AS revenue
      FROM orders
      WHERE tenant_id = $1 AND created_at >= now() - interval '12 months'
      GROUP BY date_trunc('month', created_at)
      ORDER BY month
      LIMIT 12
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, timeseries]
  - name: "orders per day current date"
    sql: |-
      SELECT created_at::date AS day, count(*) AS orders
      FROM orders
      WHERE tenant_id = $1 AND created_at >= CURRENT_DATE - 30
      GROUP BY 1 ORDER BY 1 LIMIT 31
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, timeseries]
  - name: "weekly signups"
    sql: |-
      SELECT date_trunc('week', c.created_at) AS week, count(*) AS signups
      FROM customers c WHERE c.tenant_id = $1
      GROUP BY 1 ORDER BY 1 DESC LIMIT 52
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, timeseries]
  - name: "orders today"
    sql: |-
      SELECT count(*) FROM orders WHERE tenant_id = $1 AND created_at >= CURRENT_DATE LIMIT 1
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, timeseries]
  - name: "orders between dates"
    sql: |-
      SELECT id, total_cents FROM orders
      WHERE tenant_id = $1 AND created_at BETWEEN '2026-01-01' AND '2026-03-31'
      ORDER BY created_at LIMIT 500
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, timeseries]
  - name: "to_char month label"
    sql: |-
      SELECT to_char(date_trunc('month', created_at), 'YYYY-MM') AS month, count(*)
      FROM orders WHERE tenant_id = $1 GROUP BY 1 ORDER BY 1 LIMIT 36
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, timeseries]
  - name: "age of open invoices"
    sql: |-
      SELECT i.id, age(now(), i.issued_at) AS open_for
      FROM invoices i WHERE i.tenant_id = $1 AND i.paid_at IS NULL
      ORDER BY i.issued_at LIMIT 100
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, timeseries]
  - name: "extract year"
    sql: |-
      SELECT EXTRACT(YEAR FROM created_at) AS yr, count(*) FROM orders
      WHERE tenant_id = $1 GROUP BY 1 ORDER BY 1 LIMIT 10
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, timeseries, special_syntax]
  - name: "date_part dow"
    sql: |-
      SELECT date_part('dow', created_at) AS dow, count(*) FROM orders
      WHERE tenant_id = $1 GROUP BY 1 ORDER BY 1 LIMIT 7
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, timeseries]
  - name: "interval due soon"
    sql: |-
      SELECT id, due_at FROM invoices
      WHERE tenant_id = $1 AND due_at < now() + interval '7 days' AND paid_at IS NULL
      LIMIT 200
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, timeseries]
  - name: "localtimestamp comparison"
    sql: |-
      SELECT id FROM orders WHERE tenant_id = $1 AND created_at < CURRENT_TIMESTAMP LIMIT 10
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, timeseries]
  - name: "status breakdown"
    sql: |-
      SELECT status, count(*) AS n FROM orders WHERE tenant_id = $1 GROUP BY status ORDER BY n DESC LIMIT 20
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, groupby]
  - name: "status having"
    sql: |-
      SELECT status, count(*) FROM orders WHERE tenant_id = $1 GROUP BY status HAVING count(*) > 10 LIMIT 20
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, groupby]
  - name: "customers by country"
    sql: |-
      SELECT country, count(*) AS customers FROM customers WHERE tenant_id = $1 GROUP BY country ORDER BY 2 DESC LIMIT 50
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, groupby]
  - name: "plan mix"
    sql: |-
      SELECT plan, count(*) FROM customers c WHERE c.tenant_id = $1 GROUP BY plan LIMIT 10
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, groupby]
  - name: "payment methods"
    sql: |-
      SELECT method, count(*), sum(amount_cents) FROM payments WHERE tenant_id = $1 GROUP BY method LIMIT 10
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, groupby]
  - name: "audit actions"
    sql: |-
      SELECT action, count(*) FROM audit_events WHERE tenant_id = $1 GROUP BY action ORDER BY 2 DESC LIMIT 25
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, groupby]
  - name: "users by role"
    sql: |-
      SELECT role, count(*) FROM users WHERE tenant_id = $1 GROUP BY role LIMIT 10
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, groupby]
  - name: "having avg"
    sql: |-
      SELECT customer_id, avg(total_cents) AS avg_cents FROM orders
      WHERE tenant_id = $1 GROUP BY customer_id HAVING avg(total_cents) > 5000 ORDER BY avg_cents DESC LIMIT 100
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, groupby]
  - name: "distinct statuses"
    sql: |-
      SELECT DISTINCT status FROM orders WHERE tenant_id = $1 LIMIT 100
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, distinct]
  - name: "distinct on latest order per customer"
    sql: |-
      SELECT DISTINCT ON (customer_id) customer_id, id, created_at
      FROM orders WHERE tenant_id = $1
      ORDER BY customer_id, created_at DESC LIMIT 1000
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, distinct]
  - name: "distinct countries"
    sql: |-
      SELECT DISTINCT country FROM customers WHERE tenant_id = $1 ORDER BY country LIMIT 300
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, distinct]
  - name: "top customers by revenue"
    sql: |-
      SELECT c.id, c.name, sum(o.total_cents) AS revenue
      FROM customers c
      JOIN orders o ON o.customer_id = c.id AND o.tenant_id = $1
      WHERE c.tenant_id = $1
      GROUP BY c.id, c.name
      ORDER BY revenue DESC
      LIMIT 10
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, join]
  - name: "top customers both filters in where"
    sql: |-
      SELECT c.name, count(o.id) AS orders
      FROM customers c, orders o
      WHERE c.tenant_id = $1 AND o.tenant_id = $1 AND o.customer_id = c.id
      GROUP BY c.name ORDER BY orders DESC LIMIT 10
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, join]
  - name: "inner join explicit"
    sql: |-
      SELECT o.id, c.name FROM orders o INNER JOIN customers c ON c.id = o.customer_id
      WHERE o.tenant_id = $1 AND c.tenant_id = $1 LIMIT 100
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, join]
  - name: "join filter in on clause"
    sql: |-
      SELECT o.id, c.name
      FROM orders o
      JOIN customers c ON c.tenant_id = $1 AND c.id = o.customer_id
      WHERE o.tenant_id = $1
      LIMIT 100
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, join]
  - name: "order items join"
    sql: |-
      SELECT oi.product_sku, sum(oi.quantity) AS units
      FROM order_items oi
      JOIN orders o ON o.id = oi.order_id AND o.tenant_id = $1
      WHERE oi.tenant_id = $1 AND o.status = 'paid'
      GROUP BY oi.product_sku ORDER BY units DESC LIMIT 20
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, join]
  - name: "left join filtered nullable side in on"
    sql: |-
      SELECT c.id, c.name, count(o.id) AS orders
      FROM customers c
      LEFT JOIN orders o ON o.customer_id = c.id AND o.tenant_id = $1
      WHERE c.tenant_id = $1
      GROUP BY c.id, c.name LIMIT 500
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, join]
  - name: "customers without orders"
    sql: |-
      SELECT c.id, c.name
      FROM customers c
      LEFT JOIN orders o ON o.customer_id = c.id AND o.tenant_id = $1
      WHERE c.tenant_id = $1 AND o.id IS NULL
      LIMIT 200
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, join]
  - name: "invoices with payments"
    sql: |-
      SELECT i.id, i.amount_cents, coalesce(sum(p.amount_cents), 0) AS paid
      FROM invoices i
      LEFT JOIN payments p ON p.invoice_id = i.id AND p.tenant_id = $1
      WHERE i.tenant_id = $1
      GROUP BY i.id, i.amount_cents
      LIMIT 500
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, join]
  - name: "outstanding balance"
    sql: |-
      SELECT i.id, i.amount_cents - coalesce(sum(p.amount_cents), 0) AS outstanding
      FROM invoices i
      LEFT JOIN payments p ON p.invoice_id = i.id AND p.tenant_id = $1
      WHERE i.tenant_id = $1 AND i.status <> 'void'
      GROUP BY i.id, i.amount_cents
      HAVING i.amount_cents - coalesce(sum(p.amount_cents), 0) > 0
      ORDER BY outstanding DESC
      LIMIT 100
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, join]
  - name: "three way join"
    sql: |-
      SELECT c.name, o.id, i.status
      FROM customers c
      JOIN orders o ON o.customer_id = c.id AND o.tenant_id = $1
      JOIN invoices i ON i.order_id = o.id AND i.tenant_id = $1
      WHERE c.tenant_id = $1
      LIMIT 100
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, join]
  - name: "five way join report"
    sql: |-
      SELECT c.name, o.id AS order_id, oi.product_sku, i.status AS invoice_status, p.method
      FROM customers c
      JOIN orders o ON o.customer_id = c.id AND o.tenant_id = $1
      JOIN order_items oi ON oi.order_id = o.id AND oi.tenant_id = $1
      JOIN invoices i ON i.order_id = o.id AND i.tenant_id = $1
      LEFT JOIN payments p ON p.invoice_id = i.id AND p.tenant_id = $1
      WHERE c.tenant_id = $1
      ORDER BY o.created_at DESC
      LIMIT 200
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, join]
  - name: "six joins with currency"
    sql: |-
      SELECT c.name, o.id, oi.product_sku, i.status, p.method, cur.symbol, u.display_name
      FROM customers c
      JOIN orders o ON o.customer_id = c.id AND o.tenant_id = $1
      JOIN order_items oi ON oi.order_id = o.id AND oi.tenant_id = $1
      JOIN invoices i ON i.order_id = o.id AND i.tenant_id = $1
      JOIN payments p ON p.invoice_id = i.id AND p.tenant_id = $1
      JOIN currencies cur ON cur.code = o.currency
      JOIN users u ON u.id = c.id AND u.tenant_id = $1
      WHERE c.tenant_id = $1
      LIMIT 100
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, join]
  - name: "join currencies global"
    sql: |-
      SELECT o.id, o.total_cents, cur.symbol, cur.decimals
      FROM orders o JOIN currencies cur ON cur.code = o.currency
      WHERE o.tenant_id = $1 LIMIT 100
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, join, global]
  - name: "join exchange rates"
    sql: |-
      SELECT o.id, o.total_cents * r.rate AS total_usd_cents
      FROM orders o
      JOIN exchange_rates r ON r.base = o.currency AND r.quote = 'USD' AND r.as_of = o.created_at::date
      WHERE o.tenant_id = $1
      LIMIT 100
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, join, global]
  - name: "self join customers same country"
    sql: |-
      SELECT a.name, b.name
      FROM customers a JOIN customers b ON a.country = b.country AND a.id < b.id AND b.tenant_id = $1
      WHERE a.tenant_id = $1
      LIMIT 50
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, join]
  - name: "join using"
    sql: |-
      SELECT o.id, oi.product_sku
      FROM orders o JOIN order_items oi ON oi.order_id = o.id
      WHERE o.tenant_id = $1 AND oi.tenant_id = $1
      LIMIT 100
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, join]
  - name: "audit events with actor"
    sql: |-
      SELECT e.action, e.created_at, u.display_name
      FROM audit_events e JOIN users u ON u.id = e.actor_id AND u.tenant_id = $1
      WHERE e.tenant_id = $1
      ORDER BY e.created_at DESC LIMIT 50
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, join]
  - name: "currencies only"
    sql: |-
      SELECT code, name, symbol FROM currencies ORDER BY code LIMIT 200
    expect: allow
    bind: []
    tags: [benign_analytics, global]
  - name: "currencies star"
    sql: |-
      SELECT * FROM currencies LIMIT 200
    expect: allow
    bind: []
    tags: [benign_analytics, global]
  - name: "latest exchange rate"
    sql: |-
      SELECT base, quote, rate FROM exchange_rates WHERE quote = 'USD' ORDER BY as_of DESC LIMIT 20
    expect: allow
    bind: []
    tags: [benign_analytics, global]
  - name: "max exchange rate date"
    sql: |-
      SELECT max(as_of) FROM exchange_rates LIMIT 1
    expect: allow
    bind: []
    tags: [benign_analytics, global]
  - name: "currency count"
    sql: |-
      SELECT count(*) FROM app.currencies LIMIT 1
    expect: allow
    bind: []
    tags: [benign_analytics, global]
  - name: "row number per customer"
    sql: |-
      SELECT id, customer_id, row_number() OVER (PARTITION BY customer_id ORDER BY created_at) AS nth
      FROM orders WHERE tenant_id = $1 LIMIT 1000
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, window]
  - name: "rank customers by spend"
    sql: |-
      SELECT customer_id, sum(total_cents) AS spend, rank() OVER (ORDER BY sum(total_cents) DESC) AS rnk
      FROM orders WHERE tenant_id = $1 GROUP BY customer_id LIMIT 100
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, window]
  - name: "dense rank countries"
    sql: |-
      SELECT country, count(*), dense_rank() OVER (ORDER BY count(*) DESC)
      FROM customers WHERE tenant_id = $1 GROUP BY country LIMIT 50
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, window]
  - name: "lag month over month"
    sql: |-
      SELECT month, revenue, revenue - lag(revenue) OVER (ORDER BY month) AS delta
      FROM (
        SELECT date_trunc('month', created_at) AS month, sum(total_cents) AS revenue
        FROM orders WHERE tenant_id = $1 GROUP BY 1
      ) m
      ORDER BY month LIMIT 24
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, window]
  - name: "lead next order gap"
    sql: |-
      SELECT id, customer_id, lead(created_at) OVER (PARTITION BY customer_id ORDER BY created_at) - created_at AS gap
      FROM orders WHERE tenant_id = $1 LIMIT 1000
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, window]
  - name: "running total"
    sql: |-
      SELECT created_at, total_cents,
             sum(total_cents) OVER (ORDER BY created_at ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS running
      FROM orders WHERE tenant_id = $1 ORDER BY created_at LIMIT 1000
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, window]
  - name: "moving average"
    sql: |-
      SELECT day, n, avg(n) OVER (ORDER BY day ROWS BETWEEN 6 PRECEDING AND CURRENT ROW) AS ma7
      FROM (SELECT created_at::date AS day, count(*) AS n FROM orders WHERE tenant_id = $1 GROUP BY 1) d
      ORDER BY day LIMIT 365
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, window]
  - name: "ntile quartiles"
    sql: |-
      SELECT customer_id, ntile(4) OVER (ORDER BY sum(total_cents)) AS quartile
      FROM orders WHERE tenant_id = $1 GROUP BY customer_id LIMIT 1000
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, window]
  - name: "first value per customer"
    sql: |-
      SELECT DISTINCT customer_id,
             first_value(created_at) OVER (PARTITION BY customer_id ORDER BY created_at) AS first_order
      FROM orders WHERE tenant_id = $1 LIMIT 1000
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, window]
  - name: "named window clause"
    sql: |-
      SELECT id, row_number() OVER w, rank() OVER w
      FROM orders WHERE tenant_id = $1
      WINDOW w AS (PARTITION BY status ORDER BY total_cents DESC)
      LIMIT 100
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, window]
  - name: "percent of total"
    sql: |-
      SELECT status, count(*) * 100.0 / sum(count(*)) OVER () AS pct
      FROM orders WHERE tenant_id = $1 GROUP BY status LIMIT 20
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, window]
  - name: "top 3 per status"
    sql: |-
      SELECT id, status, total_cents FROM (
        SELECT o.id, o.status, o.total_cents,
               row_number() OVER (PARTITION BY o.status ORDER BY o.total_cents DESC) AS rn
        FROM orders o WHERE o.tenant_id = $1
      ) t
      WHERE rn <= 3
      LIMIT 100
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, window]
  - name: "percent rank"
    sql: |-
      SELECT id, percent_rank() OVER (ORDER BY total_cents) FROM orders WHERE tenant_id = $1 LIMIT 100
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, window]
  - name: "filter clause counts"
    sql: |-
      SELECT count(*) FILTER (WHERE status = 'paid') AS paid,
             count(*) FILTER (WHERE status = 'refunded') AS refunded,
             count(*) AS total
      FROM orders WHERE tenant_id = $1 LIMIT 1
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, filter]
  - name: "filter clause sum by month"
    sql: |-
      SELECT date_trunc('month', created_at) AS m,
             sum(total_cents) FILTER (WHERE currency = 'EUR') AS eur,
             sum(total_cents) FILTER (WHERE currency = 'USD') AS usd
      FROM orders WHERE tenant_id = $1 GROUP BY 1 ORDER BY 1 LIMIT 24
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, filter]
  - name: "case bucket order size"
    sql: |-
      SELECT CASE WHEN total_cents < 1000 THEN 'small'
                  WHEN total_cents < 10000 THEN 'medium'
                  ELSE 'large' END AS bucket,
             count(*)
      FROM orders WHERE tenant_id = $1 GROUP BY 1 LIMIT 3
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, case]
  - name: "simple case status label"
    sql: |-
      SELECT id, CASE status WHEN 'paid' THEN 'Paid' WHEN 'open' THEN 'Open' ELSE 'Other' END AS label
      FROM invoices WHERE tenant_id = $1 LIMIT 100
    expect: allow
    bind: [{ param: 1, value: acme }]
    tags: [benign_analytics, case]
  - name: "sum case pivot"
    sql: |-
      SELECT customer_id,
             sum(CASE WHEN status = 'paid' THEN total_cents ELSE 0 END) AS paid_cents,
             sum(CASE WHEN status = 'refunded' THEN total_cents ELSE 0 END) AS refunded_cents
      FROM orders WHERE tenant_id = $1 GROUP BY customer_id LIMIT 500
    expect: allow
