[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "haltsql-mcp"
version = "0.1.0"
description = "MCP server that runs LLM-written SQL on PostgreSQL only after HaltSQL allows it"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "haltsql>=0.1.0",
  "mcp>=1.10",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
yaml = ["PyYAML>=6"]
test = ["pytest>=7", "pytest-asyncio>=0.21", "uvicorn>=0.30"]

[project.scripts]
haltsql-mcp = "haltsql_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
haltsql_mcp = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: needs the lab Postgres or haltsql binaries (skipped when unavailable)",
]
