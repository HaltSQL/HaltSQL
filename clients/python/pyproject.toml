[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "haltsql"
version = "0.0.3"
description = "Python client for HaltSQL, a policy firewall for LLM-generated PostgreSQL"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["httpx>=0.24,<1"]
# The `haltsql` console script is added by setup.py, only to platform wheels
# that bundle the CLI (src/haltsql/_native/, staged by scripts/build_wheel.sh).
dynamic = ["scripts"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
  "Topic :: Security",
  "Typing :: Typed",
]

[project.optional-dependencies]
psycopg = ["psycopg>=3.2"]
asyncpg = ["asyncpg>=0.27"]
test = ["pytest>=7", "pytest-asyncio>=0.21"]

[project.urls]
Homepage = "https://github.com/HaltSQL/HaltSQL"
Documentation = "https://github.com/HaltSQL/HaltSQL/blob/main/docs/sdk-python.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
haltsql = ["py.typed", "_native/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: needs the haltsql binaries or the lab Postgres (skipped when unavailable)",
  "native: needs libhaltsql / the haltsql CLI (skipped when unavailable unless HALTSQL_REQUIRE_NATIVE=1)",
  "wheel: installs a built wheel (HALTSQL_WHEEL=path/to/haltsql-*.whl) into a fresh venv",
]
