[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "haltsql-llamaindex"
version = "0.1.0"
description = "HaltSQL guard for LlamaIndex SQLDatabase, SQL retrievers and NL-to-SQL query engines"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
dependencies = ["haltsql[psycopg]>=0.1.0"]

[project.optional-dependencies]
llamaindex = ["llama-index-core>=0.10", "sqlalchemy>=2"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
haltsql_llamaindex = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the lab Postgres (skipped when unavailable)"]
