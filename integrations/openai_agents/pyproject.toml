[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "haltsql-openai-agents"
version = "0.1.0"
description = "HaltSQL verified read-only SQL tool and tool guardrail for the OpenAI Agents SDK"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["haltsql[psycopg]>=0.1.0", "openai-agents>=0.22,<0.23"]

[project.optional-dependencies]
test = ["pytest>=7", "psycopg[binary]>=3.2", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
haltsql_openai_agents = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the real haltsql binaries and the lab Postgres (skipped when unavailable)"]
