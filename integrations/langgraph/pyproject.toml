[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "haltsql-langgraph"
version = "0.0.3"
description = "HaltSQL verified read-only SQL tool (ToolNode) and retry-on-deny graph for LangGraph"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["haltsql[psycopg]>=0.0.3", "langgraph>=1.2,<2", "langgraph-prebuilt>=1.1,<2", "langchain-core>=1.6,<2"]

[project.optional-dependencies]
test = ["pytest>=7", "psycopg[binary]>=3.2", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
haltsql_langgraph = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the real haltsql binaries and the lab Postgres (skipped when unavailable)"]
filterwarnings = ["ignore:Pydantic serializer warnings:UserWarning"]
