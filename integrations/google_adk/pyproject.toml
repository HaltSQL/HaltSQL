[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "haltsql-google-adk"
version = "0.1.0"
description = "HaltSQL verified read-only SQL tool and tool guard for the Google Agent Development Kit"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["haltsql[psycopg]>=0.1.0", "google-adk>=2.9,<2.10"]

[project.optional-dependencies]
test = ["pytest>=7", "psycopg[binary]>=3.2", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
haltsql_google_adk = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the real haltsql binaries and the lab Postgres (skipped when unavailable)"]
