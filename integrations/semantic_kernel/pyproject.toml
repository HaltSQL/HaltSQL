[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "haltsql-semantic-kernel"
version = "0.0.3"
description = "HaltSQL verified read-only SQL plugin for Semantic Kernel"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["haltsql[psycopg]>=0.0.3", "semantic-kernel>=1.44,<2"]

[project.optional-dependencies]
test = ["pytest>=7", "psycopg[binary]>=3.2", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
haltsql_semantic_kernel = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the real haltsql binaries and the lab Postgres (skipped when unavailable)"]
