name: Feature request
description: Propose a new capability or a change in behavior.
title: "[feature] "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what stops you today? Include example SQL and policy if relevant.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should HaltSQL behave? For policy changes, show the YAML you would like to write.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security impact
      description: Could this make HaltSQL allow something it denies today? How should it fail closed?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: contract
    attributes:
      label: Contract changes
      description: Changes to stable contracts need an ADR (see CONTRIBUTING.md).
      options:
        - label: This changes the policy schema, verdict JSON, reason codes, HTTP API, or CLI behavior.
