name: Build images

# Builds the container image and the static binaries exactly as the release does,
# runs scripts/docker-smoke.sh against the real image (with a real Postgres for the
# proxy), and runs the small benchmark with its regression gate. Only on changes
# that can affect the build or performance.

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - dune-project
      - "*.opam"
      - bin/**
      - lib/**
      - vendor/**
      - bench/**
      - scripts/**
      - .github/workflows/build-images.yml
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

env:
  # Per-run password for the throwaway Postgres container (never a real secret).
  HALTSQL_PGPASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  image:
    name: Image + smoke test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the runtime image (haltsql-local:dev)
        run: |
          docker buildx build --platform "linux/${{ matrix.arch }}" --load \
            -t haltsql-local:dev \
            --cache-from "type=gha,scope=static-${{ matrix.arch }}" \
            --cache-to "type=gha,mode=max,scope=static-${{ matrix.arch }}" .

      - name: Build the scratch image (static binaries on an empty filesystem)
        run: |
          docker buildx build --platform "linux/${{ matrix.arch }}" --target scratch --load \
            -t haltsql-local:scratch \
            --cache-from "type=gha,scope=static-${{ matrix.arch }}" .

      - name: Export and inspect the static binaries
        run: |
          docker buildx build --platform "linux/${{ matrix.arch }}" --target dist \
            --output type=local,dest=out \
            --cache-from "type=gha,scope=static-${{ matrix.arch }}" .
          for b in haltsql haltsql-server haltsql-proxy; do
            file "out/$b"
            file "out/$b" | grep -Eq "statically linked|static-pie linked"
            if ldd "out/$b"; then echo "$b has dynamic dependencies"; exit 1; fi
            ls -l "out/$b"
          done

      - name: Start Postgres 17 for the proxy smoke test
        run: |
          docker run -d --name haltsql-release-pg -p 5417:5432 \
            -e POSTGRES_PASSWORD="$HALTSQL_PGPASSWORD" postgres:17-alpine
          for _ in $(seq 60); do
            docker exec haltsql-release-pg pg_isready -U postgres > /dev/null 2>&1 && exit 0
            sleep 1
          done
          docker logs haltsql-release-pg
          exit 1

      - name: Smoke test
        run: REQUIRE_PROXY=1 SCRATCH_IMAGE=haltsql-local:scratch scripts/docker-smoke.sh

      - name: Stop Postgres
        if: always()
        run: docker rm -f haltsql-release-pg || true

  bench:
    name: Benchmark regression gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.3"
          dune-cache: true

      - name: Install OCaml dependencies
        run: opam install . --deps-only --yes

      # Small run of the library, CLI and HTTP suites; fails only when a gated
      # workload's calibration-normalized p50 is more than 2.5x the committed
      # baseline (see docs/performance.md, "Regression gate").
      - name: Run the small benchmark against the baseline
        run: |
          opam exec -- scripts/bench.sh --small --suite library,cli,http \
            --baseline bench/baseline/ci-small.json --max-regress 1.5

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-results
          path: _build/bench-results/
          if-no-files-found: warn
