name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Password of the per-run Postgres service containers below. It is derived
  # from the run id so no database password is hardcoded; the tests read it from
  # HALTSQL_PGPASSWORD (default: the local lab value).
  HALTSQL_PGPASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  lint:
    name: Formatting (ocamlformat)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3.9.1
        with:
          ocaml-compiler: "5.2"
          dune-cache: true

      - name: Install the pinned ocamlformat
        run: |
          version="$(sed -n 's/^version *= *//p' .ocamlformat)"
          opam install --yes "ocamlformat.${version}" dune

      - name: Check formatting
        run: opam exec -- dune build @fmt

  build-test:
    name: Build and test (${{ matrix.os }}, OCaml ${{ matrix.ocaml }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ocaml: ["5.2", "5.4"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up OCaml ${{ matrix.ocaml }}
        uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3.9.1
        with:
          ocaml-compiler: ${{ matrix.ocaml }}
          dune-cache: true

      - name: Install OCaml dependencies
        run: opam install . --deps-only --with-test --yes

      - name: Build
        run: opam exec -- dune build

      # Docker-based suites (Kafka, Elasticsearch, OPA, Keycloak, registries,
      # MinIO) run for real in integration.yml.
      - name: Test
        env:
          HALTSQL_SKIP_DOCKER: "1"
        run: opam exec -- dune test

  coverage:
    name: Coverage (bisect_ppx)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3.9.1
        with:
          ocaml-compiler: "5.2"
          dune-cache: true

      - name: Install OCaml dependencies
        run: opam install . --deps-only --with-test --yes && opam install --yes bisect_ppx

      - name: Run tests with instrumentation
        env:
          HALTSQL_SKIP_DOCKER: "1"
        run: opam exec -- dune runtest --instrument-with bisect_ppx --force

      - name: Coverage report
        run: |
          opam exec -- bisect-ppx-report html -o _coverage
          opam exec -- bisect-ppx-report summary --per-file | tee _coverage/summary.txt
          {
            echo '### Coverage'
            echo '```'
            tail -n 1 _coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: _coverage/
          retention-days: 14

  postgres-integration:
    name: Postgres integration (rls, schema pull, Python guard)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports: ["5417:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s
          --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3.9.1
        with:
          ocaml-compiler: "5.4"
          dune-cache: true

      - name: Install OCaml dependencies
        run: opam install . --deps-only --with-test --yes

      # These suites skip with a message when Postgres is unreachable; here the
      # service container makes them run for real.
      - name: rls generate/check and schema pull against Postgres 17
        run: opam exec -- dune test test/rlsgen test/catalog_tools --force

  python-clients:
    name: Python SDK, MCP server and framework integrations
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports: ["5417:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s
          --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3.9.1
        with:
          ocaml-compiler: "5.4"
          dune-cache: true

      - name: Build haltsql and haltsql-server
        run: |
          opam install . --deps-only --yes
          opam exec -- dune build ./bin/haltsql/main.exe ./bin/server/main.exe
          echo "HALTSQL_BIN=$PWD/_build/default/bin/haltsql/main.exe" >> "$GITHUB_ENV"
          echo "HALTSQL_SERVER_BIN=$PWD/_build/default/bin/server/main.exe" >> "$GITHUB_ENV"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: SDK, MCP, LangChain, LlamaIndex, Vanna, agent frameworks (OpenAI Agents, LangGraph, Semantic Kernel, CrewAI, Google ADK) and test vectors
        env:
          FULL: "1"
        run: clients/python/run-all-tests.sh

  python-sdk-minimum:
    name: Python SDK (Python 3.9, no frameworks)
    needs: lint
    # ubuntu-latest (26.04) has no Python 3.9 build in actions/setup-python.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.9"
      - name: Core SDK tests (CLI, server and Postgres tests skip)
        working-directory: clients/python
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -e '.[test]' || .venv/bin/pip install -q -e . pytest
          .venv/bin/python -m pytest -q

  typescript-sdk:
    name: TypeScript SDK (Node ${{ matrix.node }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22"]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports: ["5417:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s
          --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3.9.1
        with:
          ocaml-compiler: "5.4"
          dune-cache: true

      - name: Build haltsql-server (for the real-sidecar test)
        run: |
          opam install . --deps-only --yes
          opam exec -- dune build ./bin/server/main.exe
          echo "HALTSQL_SERVER_BIN=$PWD/_build/default/bin/server/main.exe" >> "$GITHUB_ENV"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json

      - name: Test
        working-directory: clients/typescript
        run: npm ci && npm test

  go-sdk:
    name: Go SDK
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports: ["5417:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s
          --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.22"
      - name: SDK (standard library only)
        working-directory: clients/go/haltsql
        run: go vet ./... && go test -race -count=1 ./...
      - name: pgx integration
        working-directory: clients/go/pgxtest
        run: go test -count=1 ./...

  java-sdk:
    name: Java SDK (Temurin 17)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports: ["5417:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s
          --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test
        working-directory: clients/java
        run: mvn -B test

  policy-ci-action:
    name: GitHub Action and GitLab template self-test
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3.9.1
        with:
          ocaml-compiler: "5.4"
          dune-cache: true

      - name: Build haltsql
        run: |
          opam install . --deps-only --yes
          opam exec -- dune build ./bin/haltsql/main.exe

      - name: Action script tests
        run: test/bundle/action/test_action.sh _build/default/bin/haltsql/main.exe

      - name: GitLab template tests
        run: |
          python3 -m pip install --user pyyaml
          test/bundle/action/test_gitlab.sh _build/default/bin/haltsql/main.exe

      - name: shellcheck
        run: shellcheck -x .github/actions/policy-ci/*.sh test/bundle/action/*.sh

      - name: Generate a throwaway signing key
        run: |
          _build/default/bin/haltsql/main.exe bundle keygen -o "$RUNNER_TEMP/k"
          {
            echo 'HALTSQL_SELFTEST_KEY<<EOF_KEY'
            cat "$RUNNER_TEMP/k"
            echo 'EOF_KEY'
          } >> "$GITHUB_ENV"

      - name: Dogfood the action
        uses: ./
        with:
          haltsql-path: _build/default/bin/haltsql/main.exe
          # saas.json is the JSON twin of saas.yaml (same policy name), so bundle
          # one format only; test/load covers the JSON copy.
          policies: examples/policies/*.yaml
          suites: examples/suites
          bundle: "true"
          upload-bundle: "false"
          signing-key: ${{ env.HALTSQL_SELFTEST_KEY }}

  helm-chart:
    name: Helm chart (lint, template, kubeconform)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KUBECONFORM_IMAGE: ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e
      CHART: deploy/helm/haltsql
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.22.1

      - name: helm lint (defaults and cloud overlays)
        run: |
          helm lint "$CHART" --strict
          for f in deploy/cloud/*/*/values-*.yaml; do
            [ -e "$f" ] || continue
            echo "::group::$f"; helm lint "$CHART" --strict -f "$f"; echo "::endgroup::"
          done

      - name: helm template | kubeconform
        run: |
          mkdir -p "$RUNNER_TEMP/rendered"
          helm template t "$CHART" > "$RUNNER_TEMP/rendered/default.yaml"
          helm template t "$CHART" \
            --set tls.enabled=true --set tls.secretName=t-tls \
            --set autoscaling.enabled=true --set serviceMonitor.enabled=true \
            --set 'oidc[0].name=idp' --set 'oidc[0].issuer=https://idp.example' \
            --set service.type=LoadBalancer --set preStopSleepSeconds=5 \
            > "$RUNNER_TEMP/rendered/features.yaml"
          for f in deploy/cloud/*/*/values-*.yaml; do
            [ -e "$f" ] || continue
            helm template t "$CHART" -f "$f" > "$RUNNER_TEMP/rendered/$(basename "$f")"
          done
          cp deploy/k8s/*.yaml "$RUNNER_TEMP/rendered/"
          docker run --rm -v "$RUNNER_TEMP/rendered:/m:ro" "$KUBECONFORM_IMAGE" \
            -strict -summary -kubernetes-version 1.30.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /m
