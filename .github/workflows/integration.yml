name: Integration

# Docker-based integration tests against the REAL software (no fakes, mocks or
# emulators): Kafka, Elasticsearch, OpenSearch, OPA, Keycloak, registry:2 (with
# cesanta/docker_auth and the oras CLI), MinIO, nginx, Postgres, a real
# kube-apiserver (envtest) and kind. The same OCaml suites run in ci.yml with
# HALTSQL_SKIP_DOCKER=1; here they run for real.

on:
  push:
    branches: [main]
  pull_request:
    # Only pull requests into main; PRs between feature branches run nothing.
    branches: [main]
  schedule:
    - cron: "41 4 * * *" # nightly: also the kind end-to-end jobs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  # Superseded PR pushes and main merges cancel; tags (releases), schedules and
  # manual runs always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

env:
  HALTSQL_PGPASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  # Which areas this change touches (.github/scripts/changes.sh). On a PR each
  # job runs only when its area changed; main, nightly and dispatch run all.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ocaml: ${{ steps.areas.outputs.ocaml }}
      services: ${{ steps.areas.outputs.services }}
      e2e: ${{ steps.areas.outputs.e2e }}
      operator: ${{ steps.areas.outputs.operator }}
      terraform: ${{ steps.areas.outputs.terraform }}
      idle: ${{ steps.areas.outputs.idle }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The PR merge commit and its first parent (the base tip).
          fetch-depth: 2
      - id: areas
        env:
          # The nightly skips itself when main has not changed since the last one.
          NIGHTLY: ${{ github.event_name == 'schedule' && '1' || '' }}
        run: .github/scripts/changes.sh ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}

  # Built (or restored) once here, so the jobs below that only use the binaries
  # all hit the cache instead of each building them in parallel.
  binaries:
    name: Binaries (build once, cached by source hash)
    needs: changes
    if: >-
      needs.changes.outputs.idle != 'true' && (
        needs.changes.outputs.e2e == 'true' || needs.changes.outputs.ocaml == 'true' ||
        needs.changes.outputs.operator == 'true' || github.event_name != 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/haltsql-binaries

  ocaml-docker:
    name: OCaml integration (Docker suites)
    needs: changes
    # On a pull request: only when the server, the proxy or a library that talks
    # to an outside service changed (area `services`). Main and the nightly: all.
    if: needs.changes.outputs.services == 'true'
    # Pinned: the Docker-based suites are tuned on Ubuntu 24.04 runners.
    runs-on: ubuntu-24.04
    # One job for all the suites: setting up the OCaml toolchain takes about six
    # minutes and the suites themselves between thirty seconds and three
    # minutes each, so five parallel jobs paid the set-up five times.
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports: ["5417:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s
          --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3.9.1
        with:
          ocaml-compiler: "5.4"
          dune-cache: true

      - name: Install OCaml dependencies
        run: opam install . --deps-only --with-test --yes

      # The MinIO-based tests never pull on their own; minio/minio is no longer
      # published on Docker Hub, so use the pgsty build of the MinIO server.
      - name: Pull the MinIO server image
        run: docker pull pgsty/minio:latest

      # test/proxy drives the proxy with the lab's psycopg client.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Lab virtualenv
        working-directory: lab
        run: make venv

      - name: Build
        run: opam exec -- dune build ./bin/haltsql/main.exe ./bin/server/main.exe ./bin/proxy/main.exe

      # Every suite runs even when an earlier one fails, each in its own log
      # group; the step fails at the end if any suite failed or skipped a test.
      - name: Run the suites (Docker tests must not skip)
        env:
          HALTSQL_MINIO_IMAGE: pgsty/minio:latest
        run: |
          set -o pipefail
          failed=""
          suite() {
            local name="$1"; shift
            echo "::group::$name ($*)"
            local log="$RUNNER_TEMP/test-${name// /-}.log"
            if ! opam exec -- dune test "$@" --force 2>&1 | tee "$log"; then
              failed="$failed|$name (failed)"
            elif grep -E 'SKIP(PED)? ?\(|SKIP: |\[SKIP\]' "$log" | grep -viE 'HALTSQL_REQUIRE|not registered'; then
              failed="$failed|$name (a Docker-based test skipped)"
            fi
            echo "::endgroup::"
          }
          suite "Kafka, Elasticsearch, OpenSearch sinks" test/siem
          suite "OPA and server wiring" test/opa test/wiring
          suite "Keycloak policy_from_groups" test/auth
          suite "OCI, S3 and HTTPS bundle sources" test/bundle_source test/bundle
          suite "audit verify, proxy audit and reload, shadow reports" test/audit test/proxy test/report
          if [ -n "$failed" ]; then
            echo "$failed" | tr '|' '\n' | sed '/^$/d; s/^/::error::/'
            exit 1
          fi

      - name: Containers left behind
        if: always()
        run: docker ps -a --filter name=haltsql- --format '{{.Names}} {{.Status}}'

  e2e:
    name: E2E
    needs: [changes, binaries]
    if: needs.changes.outputs.e2e == 'true'
    # The end-to-end suite (test/e2e, docs/testing.md#end-to-end-suite): the
    # real services in Docker Compose, the real binaries, a pytest driver.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Binaries (cached by a hash of the OCaml sources)
        uses: ./.github/actions/haltsql-binaries

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Run (stack up, pytest; nothing may skip)
        run: |
          unset HALTSQL_SKIP_DOCKER
          export HALTSQL_E2E_REQUIRE=1
          set -o pipefail
          KEEP=1 test/e2e/stack.sh run --junitxml="$RUNNER_TEMP/e2e-junit.xml" --basetemp="$RUNNER_TEMP/e2e" 2>&1 | tee "$RUNNER_TEMP/e2e.log"
          if grep -E '^SKIPPED |[0-9]+ skipped' "$RUNNER_TEMP/e2e.log"; then
            echo "::error::an e2e test skipped"
            exit 1
          fi

      - name: Service logs
        if: failure()
        run: test/e2e/stack.sh logs --tail 300

      - name: Upload haltsql process logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs
          path: |
            ${{ runner.temp }}/e2e/**/*.log
            ${{ runner.temp }}/e2e-junit.xml
          if-no-files-found: ignore

      - name: Stop the stack
        if: always()
        run: test/e2e/stack.sh down

  operator:
    name: Operator (Go unit + envtest)
    needs: [changes, binaries]
    if: needs.changes.outputs.ocaml == 'true' || needs.changes.outputs.operator == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Binaries (the validator the operator runs; cached by source hash)
        uses: ./.github/actions/haltsql-binaries

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: deploy/operator/go.mod
          cache-dependency-path: deploy/operator/go.sum

      - name: Unit and envtest tests (real kube-apiserver and etcd)
        working-directory: deploy/operator
        run: make test

      - name: Generated files are up to date
        run: git diff --exit-code -- deploy/operator

  operator-e2e:
    name: Operator end-to-end (kind)
    needs: changes
    if: (github.event_name == 'schedule' && needs.changes.outputs.idle != 'true') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: deploy/operator/go.mod
          cache-dependency-path: deploy/operator/go.sum
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          install_only: true
      - name: kind end-to-end
        working-directory: deploy/operator
        run: make e2e

  terraform:
    name: Terraform (fmt, validate, test, tflint, trivy)
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.3"
          terraform_wrapper: false
      - name: Static checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: deploy/terraform/test/static-checks.sh

  terraform-kind:
    name: Terraform end-to-end (kind)
    needs: changes
    if: (github.event_name == 'schedule' && needs.changes.outputs.idle != 'true') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.3"
          terraform_wrapper: false
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          install_only: true
      - name: kind end-to-end
        run: deploy/terraform/test/e2e-kind.sh

  lab-compat:
    name: Postgres flavours (lab compat, local engines)
    needs: [changes, binaries]
    if: (github.event_name == 'schedule' && needs.changes.outputs.idle != 'true') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Binaries (cached by a hash of the OCaml sources)
        uses: ./.github/actions/haltsql-binaries
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Lab virtualenv
        working-directory: lab
        run: make venv
      - name: Start the engines
        run: lab/compat/run.sh up
      - name: Run
        run: lab/compat/run.sh local all
      - name: Results
        if: always()
        run: lab/compat/run.sh table >> "$GITHUB_STEP_SUMMARY" || true
      - name: Stop the engines
        if: always()
        run: lab/compat/run.sh down

  # One check that sums up the workflow, for branch protection: skipped jobs
  # (areas this change does not touch, nightly-only jobs) count as passing.
  integration-ok:
    name: Integration ok
    if: always()
    needs:
      - changes
      - binaries
      - ocaml-docker
      - e2e
      - operator
      - operator-e2e
      - terraform
      - terraform-kind
      - lab-compat
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job that ran passed
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          if [ "$FAILED" = "true" ]; then
            echo "::error::an integration job failed or was cancelled"
            exit 1
          fi
