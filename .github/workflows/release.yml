name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  IMAGE: ghcr.io/ardada2468/haltsql
  OCAML_VERSION: "5.2"

jobs:
  linux-static:
    name: Linux ${{ matrix.arch }} (static, musl)
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build static binaries in Alpine
        run: |
          mkdir -p dist && chmod 777 dist
          docker run --rm \
            -v "$PWD:/src:ro" -v "$PWD/dist:/dist" \
            -e TAG -e ARCH=${{ matrix.arch }} \
            "ocaml/opam:alpine-3.20-ocaml-${OCAML_VERSION}" \
            sh -euxc '
              sudo apk add --no-cache build-base linux-headers file gmp-dev
              cp -r /src "$HOME/haltsql" && cd "$HOME/haltsql"
              opam update --yes
              opam install . --deps-only --yes
              # Fully static executables (musl); see bin/link_flags.ml.
              HALTSQL_STATIC=1 opam exec -- dune build @install --profile release
              out="haltsql-${TAG}-linux-${ARCH}"
              mkdir -p "$out"
              # Every release ships all three binaries; a missing one fails the build.
              for b in haltsql haltsql-server haltsql-proxy; do
                cp "_build/install/default/bin/$b" "$out/"
                strip "$out/$b"
                file "$out/$b"
                file "$out/$b" | grep -q "statically linked" || { echo "$b is not static"; exit 1; }
              done
              cp LICENSE NOTICE README.md "$out/" && cp vendor/libpg_query/LICENSE "$out/LICENSE.libpg_query"
              tar -czf "/dist/$out.tar.gz" "$out"
            '

      - name: Smoke test
        run: |
          tar -xzf dist/haltsql-${TAG}-linux-${{ matrix.arch }}.tar.gz -C /tmp
          d=/tmp/haltsql-${TAG}-linux-${{ matrix.arch }}
          "$d/haltsql" version
          "$d/haltsql-server" --help=plain > /dev/null
          "$d/haltsql-proxy" --help=plain > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  macos:
    name: macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_VERSION }}

      - name: Build
        run: |
          opam install . --deps-only --yes
          opam exec -- dune build @install --profile release
          out="haltsql-${TAG}-darwin-arm64"
          mkdir -p "$out" dist
          for b in haltsql haltsql-server haltsql-proxy; do
            cp "_build/install/default/bin/$b" "$out/"
            strip "$out/$b"
            otool -L "$out/$b"
          done
          cp LICENSE NOTICE README.md "$out/" && cp vendor/libpg_query/LICENSE "$out/LICENSE.libpg_query"
          tar -czf "dist/$out.tar.gz" "$out"
          "$out/haltsql" version
          "$out/haltsql-proxy" --help=plain > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: dist-darwin-arm64
          path: dist/*.tar.gz
          if-no-files-found: error

  image:
    name: Container image (multi-arch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
          labels: |
            org.opencontainers.image.title=haltsql
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: Attest image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  publish:
    name: Checksums, SBOM, signatures, GitHub release
    needs: [linux-static, macos, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/haltsql-${{ env.TAG }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          sha256sum *.tar.gz *.cdx.json > SHA256SUMS
          cat SHA256SUMS

      - uses: sigstore/cosign-installer@v3

      - name: Sign artifacts (keyless)
        working-directory: dist
        run: |
          for f in *.tar.gz *.cdx.json SHA256SUMS; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done

      - name: Attest build provenance for binaries
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz

      - name: Extract release notes from CHANGELOG
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
          {
            echo
            echo "Container image: \`${IMAGE}:${version}\` (digest \`${{ needs.image.outputs.digest }}\`)."
            echo
            echo "Verify downloads with \`sha256sum -c SHA256SUMS\` and"
            echo "\`cosign verify-blob --bundle FILE.sigstore.json --certificate-identity-regexp 'https://github.com/ardada2468/HaltSQL/' --certificate-oidc-issuer https://token.actions.githubusercontent.com FILE\`."
          } >> release-notes.md
          cat release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: HaltSQL ${{ env.TAG }}
          body_path: release-notes.md
          prerelease: ${{ startsWith(env.TAG, 'v0.') || contains(env.TAG, '-') }}
          files: |
            dist/*.tar.gz
            dist/*.cdx.json
            dist/*.sigstore.json
            dist/SHA256SUMS
