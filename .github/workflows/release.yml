name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true

permissions:
  contents: read

# One release run per tag at a time; never cancel a release mid-publish.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  IMAGE: ghcr.io/haltsql/haltsql
  OCAML_VERSION: "5.2"
  # The static Linux tarballs are built from the `dist` stage of the Dockerfile,
  # which pins the builder image by digest and the opam-repository commit
  # (OPAM_REPOSITORY_COMMIT), so tarballs and the image always ship the same
  # dependency versions.

jobs:
  linux-static:
    name: Linux ${{ matrix.arch }} (static, musl)
    # Built exactly like the container image: the `dist` stage of the Dockerfile
    # (Alpine/musl builder, HALTSQL_STATIC=1, pinned opam-repository commit), on a
    # native runner per architecture. The builder stage itself fails unless every
    # binary is statically linked and runs.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ env.TAG }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build static binaries (Dockerfile target "dist")
        run: |
          docker buildx build --platform "linux/${{ matrix.arch }}" \
            --target dist --output "type=local,dest=out" \
            --cache-from "type=gha,scope=static-${{ matrix.arch }}" \
            --cache-to "type=gha,mode=max,scope=static-${{ matrix.arch }}" .

      - name: Check the binaries are static and run on an empty filesystem
        run: |
          set -eu
          for b in haltsql haltsql-server haltsql-proxy; do
            file "out/$b"
            file "out/$b" | grep -Eq "statically linked|static-pie linked" \
              || { echo "$b is not static"; exit 1; }
            if ldd "out/$b"; then echo "$b has dynamic dependencies"; exit 1; fi
          done
          docker buildx build --platform "linux/${{ matrix.arch }}" --target scratch \
            --cache-from "type=gha,scope=static-${{ matrix.arch }}" \
            --load -t haltsql-scratch:ci .
          for b in haltsql haltsql-server haltsql-proxy; do
            docker run --rm --entrypoint "/usr/local/bin/$b" haltsql-scratch:ci --version
          done
          out/haltsql version
          out/haltsql-server --help=plain > /dev/null
          out/haltsql-proxy --help=plain > /dev/null

      - name: Package
        run: |
          set -eu
          out="haltsql-${TAG}-linux-${{ matrix.arch }}"
          mkdir -p "$out" dist
          # Every release ships all three binaries; a missing one fails the build.
          for b in haltsql haltsql-server haltsql-proxy; do
            install -m 0755 "out/$b" "$out/$b"
          done
          cp out/LICENSE out/NOTICE out/LICENSE.libpg_query README.md "$out/"
          tar -czf "dist/$out.tar.gz" "$out"
          tar -tzvf "dist/$out.tar.gz"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  macos:
    name: macOS arm64
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ env.TAG }}

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3.9.1
        with:
          ocaml-compiler: ${{ env.OCAML_VERSION }}

      - name: Build
        run: |
          opam install . --deps-only --yes
          opam exec -- dune build @install --profile release
          out="haltsql-${TAG}-darwin-arm64"
          mkdir -p "$out" dist
          for b in haltsql haltsql-server haltsql-proxy; do
            cp "_build/install/default/bin/$b" "$out/"
            strip "$out/$b"
            otool -L "$out/$b"
          done
          cp LICENSE NOTICE README.md "$out/" && cp vendor/libpg_query/LICENSE "$out/LICENSE.libpg_query"
          tar -czf "dist/$out.tar.gz" "$out"
          "$out/haltsql" version
          "$out/haltsql-proxy" --help=plain > /dev/null

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-darwin-arm64
          path: dist/*.tar.gz
          if-no-files-found: error

  image:
    name: Container image (multi-arch)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ env.TAG }}

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
          labels: |
            org.opencontainers.image.title=haltsql
            org.opencontainers.image.licenses=MIT

      - name: Build and smoke-test the amd64 image before pushing
        run: |
          docker buildx build --platform linux/amd64 --load -t haltsql-local:dev \
            --cache-from type=gha .
          docker buildx build --platform linux/amd64 --target scratch --load \
            -t haltsql-local:scratch --cache-from type=gha .
          docker run -d --name haltsql-release-pg -p 5417:5432 \
            -e POSTGRES_PASSWORD="ci-${{ github.run_id }}" postgres:17-alpine
          for _ in $(seq 60); do
            docker exec haltsql-release-pg pg_isready -U postgres > /dev/null 2>&1 && break
            sleep 1
          done
          HALTSQL_PGPASSWORD="ci-${{ github.run_id }}" REQUIRE_PROXY=1 SCRATCH_IMAGE=haltsql-local:scratch \
            scripts/docker-smoke.sh
          docker rm -f haltsql-release-pg

      - name: Build metadata
        id: buildinfo
        run: |
          echo "created=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.TAG }}
            REVISION=${{ steps.buildinfo.outputs.revision }}
            CREATED=${{ steps.buildinfo.outputs.created }}
          # SLSA provenance (max) and an SPDX SBOM are attached to the image
          # index as in-toto attestations.
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Sign image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Verify the image signature
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null

      - name: Attest image provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  publish:
    name: Checksums, SBOM, signatures, GitHub release
    needs: [linux-static, macos, image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/haltsql-${{ env.TAG }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- *.tar.gz *.cdx.json > SHA256SUMS
          cat SHA256SUMS

      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Sign artifacts (keyless)
        working-directory: dist
        run: |
          for f in *.tar.gz *.cdx.json SHA256SUMS; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done

      - name: Attest build provenance for binaries
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/*.tar.gz

      - name: Extract release notes from CHANGELOG
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
          {
            echo
            echo "Container image: \`${IMAGE}:${version}\` (digest \`${{ needs.image.outputs.digest }}\`)."
            echo
            echo "Verify downloads with \`sha256sum -c SHA256SUMS\` and"
            echo "\`cosign verify-blob --bundle FILE.sigstore.json --certificate-identity-regexp 'https://github.com/HaltSQL/HaltSQL/' --certificate-oidc-issuer https://token.actions.githubusercontent.com FILE\`."
          } >> release-notes.md
          cat release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.TAG }}
          name: HaltSQL ${{ env.TAG }}
          body_path: release-notes.md
          prerelease: ${{ startsWith(env.TAG, 'v0.') || contains(env.TAG, '-') }}
          files: |
            dist/*.tar.gz
            dist/*.cdx.json
            dist/*.sigstore.json
            dist/SHA256SUMS
