name: Compatibility (managed Postgres)

# Runs the lab compatibility scenarios (docs/compatibility.md) against managed
# Postgres services. Manual only: each service needs a disposable database
# server and an admin DSN in a repository secret. A service whose secret is
# not set is skipped.
#
#   HALTLAB_DSN_AURORA_POSTGRESQL   Amazon Aurora PostgreSQL
#   HALTLAB_DSN_NEON                Neon
#   HALTLAB_DSN_SUPABASE_CLOUD      Supabase (hosted)
#   HALTLAB_DSN_ALLOYDB             Google AlloyDB for PostgreSQL
#
# DSN: postgresql://USER:PASSWORD@HOST:5432/postgres?sslmode=require, for a
# role that may CREATE DATABASE and CREATE ROLE. Each run creates and drops
# the database haltlab_compat_<engine>_pg17 (plus _proxy_ and _selftest_
# runs) and creates the NOLOGIN roles haltlab_owner, haltlab_rls and
# haltlab_cols. Never use a production server.
#
# Amazon Redshift has no secret: Redshift is not PostgreSQL 17 and the lab
# fixture (roles, RLS policies, REPEATABLE READ READ ONLY transactions) does
# not run there. The redshift job runs the offline grammar suite
# test/corpus/compat-redshift.suite.yaml instead.

on:
  workflow_dispatch:
    inputs:
      engines:
        description: "Space-separated engines (default: all): aurora-postgresql neon supabase-cloud alloydb redshift"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: compat-cloud
  cancel-in-progress: false

jobs:
  cloud:
    name: ${{ matrix.engine }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { engine: aurora-postgresql, secret: HALTLAB_DSN_AURORA_POSTGRESQL }
          - { engine: neon, secret: HALTLAB_DSN_NEON }
          - { engine: supabase-cloud, secret: HALTLAB_DSN_SUPABASE_CLOUD }
          - { engine: alloydb, secret: HALTLAB_DSN_ALLOYDB }
    env:
      HALTLAB_DSN: ${{ secrets[matrix.secret] }}
      ENGINES: ${{ github.event.inputs.engines }}
    steps:
      - name: Decide whether to run
        id: gate
        run: |
          run=true
          # $ENGINES is a space-separated list: word splitting is intended.
          # shellcheck disable=SC2086
          if [ -n "$ENGINES" ] && ! printf ' %s ' $ENGINES | grep -q " ${{ matrix.engine }} "; then
            echo "::notice::${{ matrix.engine }} not selected"; run=false
          elif [ -z "$HALTLAB_DSN" ]; then
            echo "::notice::secret ${{ matrix.secret }} is not set; skipping ${{ matrix.engine }}"; run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        if: steps.gate.outputs.run == 'true'

      - name: Set up OCaml
        if: steps.gate.outputs.run == 'true'
        uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3.9.1
        with:
          ocaml-compiler: "5.4"
          dune-cache: true

      - name: Build haltsql and haltsql-proxy
        if: steps.gate.outputs.run == 'true'
        run: |
          opam install . --deps-only -y
          opam exec -- dune build ./bin/haltsql/main.exe ./bin/proxy/main.exe
          echo "HALTSQL_BIN=$PWD/_build/default/bin/haltsql/main.exe" >> "$GITHUB_ENV"
          echo "HALTSQL_PROXY_BIN=$PWD/_build/default/bin/proxy/main.exe" >> "$GITHUB_ENV"

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lab/requirements-dev.txt

      - name: Install lab dependencies
        if: steps.gate.outputs.run == 'true'
        working-directory: lab
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements-dev.txt

      - name: Compatibility run (oracle self-test, HaltSQL, haltsql-proxy parity)
        if: steps.gate.outputs.run == 'true'
        run: lab/compat/run.sh cloud ${{ matrix.engine }}

      - name: Results table
        if: always() && steps.gate.outputs.run == 'true'
        run: (cd lab && .venv/bin/python -m compat table) >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload reports
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compat-${{ matrix.engine }}-${{ github.run_id }}
          # Reports hold metrics, query text and lab data, never the DSN.
          path: |
            lab/out/compat/
            !lab/out/compat/**/proxy.json
          if-no-files-found: warn
          retention-days: 30

  redshift:
    name: redshift (grammar suite, no cluster)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.inputs.engines == '' || contains(format(' {0} ', github.event.inputs.engines), ' redshift ')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up OCaml
        uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3.9.1
        with:
          ocaml-compiler: "5.4"
          dune-cache: true
      - name: Build haltsql
        run: |
          opam install . --deps-only -y
          opam exec -- dune build ./bin/haltsql/main.exe
      - name: Redshift-only SQL fails closed; portable analytics SQL is handled
        run: HALTSQL_BIN=$PWD/_build/default/bin/haltsql/main.exe lab/compat/run.sh redshift
