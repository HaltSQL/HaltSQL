name: Lab (nightly)

on:
  schedule:
    - cron: "17 3 * * *" # every night at 03:17 UTC
  workflow_dispatch:
    inputs:
      scenarios:
        description: "Space-separated scenario files under lab/ (default: the nightly set)"
        required: false
        default: ""
  pull_request:
    paths:
      - "lab/**"
      - "lib/**"
      - ".github/workflows/lab.yml"

permissions:
  contents: read

concurrency:
  group: lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lab:
    name: haltlab scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.4"
          dune-cache: true

      - name: Build haltsql
        run: |
          opam install . --deps-only -y
          opam exec -- dune build ./bin/haltsql ./bin/proxy/main.exe
          echo "HALTSQL_BIN=$PWD/_build/default/bin/haltsql/main.exe" >> "$GITHUB_ENV"
          echo "HALTSQL_PROXY_BIN=$PWD/_build/default/bin/proxy/main.exe" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lab/requirements-dev.txt

      - name: Install lab dependencies
        working-directory: lab
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements-dev.txt

      - name: Unit tests
        working-directory: lab
        run: make test

      - name: Start Postgres
        working-directory: lab
        run: make up PROFILE=${{ github.event_name == 'schedule' && 'matrix' || '' }}

      - name: Oracle self-test (allow-everything verifier must be caught)
        working-directory: lab
        run: make test-integration

      - name: Run scenarios
        working-directory: lab
        env:
          SCENARIOS: ${{ github.event.inputs.scenarios }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -n "$SCENARIOS" ]; then set -- $SCENARIOS
          elif [ "$EVENT" = "pull_request" ]; then set -- scenarios/pr-smoke.yaml
          else set -- scenarios/nightly-saas.yaml scenarios/nightly-composite.yaml \
                      scenarios/nightly-hierarchical.yaml scenarios/nightly-erp.yaml \
                      scenarios/matrix-pg13-17.yaml
          fi
          status=0
          for s in "$@"; do .venv/bin/python -m harness run "$s" || status=1; done
          exit $status

      - name: Proxy parity scenario (haltsql-proxy vs the CLI, no tenant escapes)
        working-directory: lab
        run: .venv/bin/python -m proxy run proxy/scenarios/proxy-smoke.yaml

      - name: Proxy integration tests (psycopg through haltsql-proxy)
        run: opam exec -- dune test test/proxy --force

      - name: Collect container logs
        if: always()
        working-directory: lab
        run: |
          mkdir -p out
          docker compose -f infra/compose/docker-compose.yml logs --no-color > out/compose.log 2>&1 || true

      - name: Upload lab reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-report-${{ github.run_id }}
          path: lab/out/
          if-no-files-found: warn
          retention-days: 30

      - name: Stop Postgres
        if: always()
        working-directory: lab
        run: make down
