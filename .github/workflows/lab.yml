name: Lab (nightly)

on:
  schedule:
    - cron: "17 3 * * *" # every night at 03:17 UTC
  workflow_dispatch:
    inputs:
      scenarios:
        description: "Space-separated scenario files under lab/ (default: the nightly set)"
        required: false
        default: ""
  pull_request:
    # Only pull requests into main; PRs between feature branches run nothing.
    branches: [main]
    # The oracle run matters when the verdict can change (the engine), when
    # the proxy that the parity scenario drives changes, or when the lab does.
    paths:
      - "lab/**"
      - "lib/analyzer/**"
      - "lib/parse/**"
      - "lib/core/**"
      - "lib/haltsql/**"
      - "lib/pgquery/**"
      - "lib/load/policy*"
      - "lib/pgwire/**"
      - "vendor/libpg_query/**"
      - ".github/workflows/lab.yml"

permissions:
  contents: read

concurrency:
  group: lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The nightly skips itself when main has not changed since the last one.
  gate:
    name: Anything new since last night?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: g
        env:
          EVENT: ${{ github.event_name }}
        run: |
          run=true
          if [ "$EVENT" = "schedule" ]; then
            age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
            if [ "$age" -gt $(( 26 * 3600 )) ]; then run=false; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  lab:
    name: haltlab scenarios
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3.9.1
        with:
          ocaml-compiler: "5.4"
          dune-cache: true

      - name: Build haltsql
        run: |
          opam install . --deps-only --with-test -y
          opam exec -- dune build ./bin/haltsql ./bin/proxy/main.exe
          echo "HALTSQL_BIN=$PWD/_build/default/bin/haltsql/main.exe" >> "$GITHUB_ENV"
          echo "HALTSQL_PROXY_BIN=$PWD/_build/default/bin/proxy/main.exe" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lab/requirements-dev.txt

      - name: Install lab dependencies
        working-directory: lab
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements-dev.txt

      - name: Unit tests
        working-directory: lab
        run: make test

      - name: Start Postgres
        working-directory: lab
        run: make up PROFILE=${{ github.event_name == 'schedule' && 'matrix' || '' }}

      - name: Oracle self-test (allow-everything verifier must be caught)
        working-directory: lab
        run: make test-integration

      - name: Run scenarios
        working-directory: lab
        env:
          SCENARIOS: ${{ github.event.inputs.scenarios }}
          EVENT: ${{ github.event_name }}
        run: |
          # Word splitting of $SCENARIOS is intended (space-separated list).
          # shellcheck disable=SC2086
          if [ -n "$SCENARIOS" ]; then set -- $SCENARIOS
          elif [ "$EVENT" = "pull_request" ]; then set -- scenarios/pr-smoke.yaml
          else set -- scenarios/nightly-saas.yaml scenarios/nightly-composite.yaml \
                      scenarios/nightly-hierarchical.yaml scenarios/nightly-erp.yaml \
                      scenarios/matrix-pg13-17.yaml
          fi
          status=0
          for s in "$@"; do .venv/bin/python -m harness run "$s" || status=1; done
          exit $status

      - name: Proxy parity scenario (haltsql-proxy vs the CLI, no tenant escapes)
        working-directory: lab
        run: .venv/bin/python -m proxy run proxy/scenarios/proxy-smoke.yaml

      - name: Proxy integration tests (psycopg through haltsql-proxy)
        run: opam exec -- dune test test/proxy --force

      - name: Collect container logs
        if: always()
        working-directory: lab
        run: |
          mkdir -p out
          docker compose -f infra/compose/docker-compose.yml logs --no-color > out/compose.log 2>&1 || true

      - name: Upload lab reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lab-report-${{ github.run_id }}
          path: lab/out/
          if-no-files-found: warn
          retention-days: 30

      - name: Stop Postgres
        if: always()
        working-directory: lab
        run: make down
