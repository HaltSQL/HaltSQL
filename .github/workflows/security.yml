name: Security

# CodeQL does not support OCaml, so this workflow covers what we can scan:
# dependency changes in pull requests, and the container image and repository
# configuration (Dockerfile, workflows) with Trivy.

on:
  pull_request:
    # Only pull requests into main; PRs between feature branches run nothing.
    branches: [main]
  schedule:
    - cron: "41 4 * * 1" # Mondays at 04:41 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned by digest: a mutable tag of a scanner is itself a supply-chain risk.
  # Re-pin with `docker buildx imagetools inspect aquasec/trivy:<version>`.
  TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

jobs:
  dependency-review:
    name: Dependency review
    # Dependency review needs GitHub Advanced Security on private repositories;
    # run it only where it is available (public repos).
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, SSPL-1.0

  workflow-lint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo "$ACTIONLINT_IMAGE" -color

  trivy-image:
    name: Trivy image scan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          push: false
          tags: haltsql:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/out" \
            "$TRIVY_IMAGE" image \
              --severity HIGH,CRITICAL --ignore-unfixed \
              --format sarif --output /out/trivy-image.sarif \
              haltsql:scan
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            "$TRIVY_IMAGE" image --severity HIGH,CRITICAL --ignore-unfixed \
              --exit-code 1 haltsql:scan

      - name: Upload SARIF
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  trivy-config:
    name: Trivy config scan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Scan repository configuration and secrets
        run: |
          docker run --rm -v "$PWD:/repo" "$TRIVY_IMAGE" fs \
            --scanners misconfig,secret \
            --severity MEDIUM,HIGH,CRITICAL \
            --format sarif --output /repo/trivy-config.sarif \
            /repo

      - name: Upload SARIF
        if: always() && hashFiles('trivy-config.sarif') != ''
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config
