# Runtime configuration for haltsql-server. Secrets come from the environment
# (${env:NAME}) or from files (${file:/path}); never write them here.
apiVersion: haltsql.dev/v1
kind: Config
server:
  listen: 0.0.0.0:8443
  auth:
    tokens:
      - name: analytics-agent
        token_sha256: ${env:HALTSQL_ANALYTICS_TOKEN_HASH}
        policy: saas-analytics
      - name: support-bot
        token_sha256: 5f2b9e0c8d7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b7c6d5e4f3a2b1c
        policy: support-bot
    allow_unauthenticated: false
policies:
  - path: ../policies/saas.yaml
  - path: ../policies/writes.yaml       # formats can be mixed
  - inline:
      metadata: { name: currency-lookup }
      search_path: [app]
      tables:
        app.currencies: { columns: [code, name, minor_units] }
reload: { watch: true }
audit:
  sinks:
    - type: stdout
    - type: file
      path: /var/log/haltsql/audit.jsonl
  log_raw_sql: false
telemetry:
  metrics: { prometheus: true }
  otlp_endpoint: ${env:OTEL_EXPORTER_OTLP_ENDPOINT}
logging: { level: info, format: json }
limits: { max_request_bytes: 1048576 }
