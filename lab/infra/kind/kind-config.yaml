# kind cluster for the nightly/full topology (PLAN.md §8.2): haltsql-server as a
# sidecar next to an "agent" workload, Postgres as a StatefulSet.
#   kind create cluster --config infra/kind/kind-config.yaml
#   kubectl apply -f infra/kind/manifests.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: haltlab
nodes:
  - role: control-plane
