# Compatibility run on TimescaleDB (timescale/timescaledb:2.31.0-pg17); see docs/compatibility.md. Same workload and
# expectations as pr-smoke; also run through haltsql-proxy by lab/compat/run.sh.
#   lab/compat/run.sh local timescaledb
apiVersion: haltsql.dev/v1
kind: Scenario
metadata: { name: compat-timescaledb }
environment:
  postgres: [17]
  topology: embedded
  engine: timescaledb
  dsn: postgresql://postgres:haltlab@localhost:55422/postgres   # lab-only credentials (compose profile compat)
fixture: saas_shared
data: { scale: tiny, tenants: 8, skew: zipf(1.2), seed: 42 }
workloads:
  - benign: { queries: 200 }
  - adversarial: { queries: 400 }
expect:
  escapes: 0
  side_effects: 0
  column_leaks: 0
  false_positive_rate: { max: 0.10 }
  min_executed: 50
